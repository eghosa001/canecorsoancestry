{% extends "base.html" %}
{% block title %}Account settings · Cane Corso Ancestry{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">Account settings</p>
    <h1>Change password</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-gold" type="submit">Update password</button>
    </form>
  </div>
</section>
{% endblock %}
