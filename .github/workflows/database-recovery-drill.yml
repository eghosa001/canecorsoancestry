name: Oracle offsite PostgreSQL recovery integrity

on:
  workflow_dispatch:
  schedule:
    - cron: "27 4 1 * *"
  pull_request:
    paths:
      - "scripts/oracle_runner/verify_offsite_recovery.sh"
      - "scripts/oracle_runner/r2_postgres_backup.py"
      - "scripts/oracle_runner/seal_postgres_backup.py"
      - ".github/workflows/database-recovery-drill.yml"

permissions:
  contents: read

concurrency:
  group: cca-oracle-offsite-recovery
  cancel-in-progress: false

jobs:
  verify-script:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n scripts/oracle_runner/verify_offsite_recovery.sh
          python3 -m py_compile scripts/oracle_runner/r2_postgres_backup.py scripts/oracle_runner/seal_postgres_backup.py
          python3 scripts/fast_path_guard.py

  verify-offsite:
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'eghosa001/canecorsoancestry' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify latest offsite Oracle production archive is decryptable
        run: bash scripts/oracle_runner/verify_offsite_recovery.sh
