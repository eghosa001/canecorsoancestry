name: Oracle R2 backup freshness watch
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/oracle_runner/check_offsite_backup_freshness.sh"
      - ".github/workflows/oracle-backup-freshness.yml"
  pull_request:
    paths:
      - "scripts/oracle_runner/check_offsite_backup_freshness.sh"
      - ".github/workflows/oracle-backup-freshness.yml"
permissions:
  contents: read
concurrency:
  group: cca-oracle-backup-freshness
  cancel-in-progress: false
jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/oracle_runner/check_offsite_backup_freshness.sh
  verify:
    if: github.event_name != 'pull_request' && github.repository == 'eghosa001/canecorsoancestry' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/oracle_runner/check_offsite_backup_freshness.sh
