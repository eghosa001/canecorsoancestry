name: Oracle R2 backup freshness watch
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/oracle_runner/check_offsite_backup_freshness.sh"
      - ".github/workflows/oracle-backup-freshness.yml"
  pull_request:
    paths:
      - "scripts/oracle_runner/check_offsite_backup_freshness.sh"
      - ".github/workflows/oracle-backup-freshness.yml"
permissions:
  contents: read
concurrency:
  group: cca-oracle-backup-freshness
  cancel-in-progress: false
jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/oracle_runner/check_offsite_backup_freshness.sh
  verify:
    if: github.event_name != 'pull_request' && github.repository == 'eghosa001/canecorsoancestry' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check offsite R2 backup; verify emergency local backup if R2 is unavailable
        shell: bash
        run: |
          set -euo pipefail
          if bash scripts/oracle_runner/check_offsite_backup_freshness.sh; then
            exit 0
          fi
          # GitHub can delay a scheduled upload; first try to restore a real
          # encrypted, independently verified OFFSITE backup, as before.
          echo "::warning::Offsite R2 backup is missing or stale; attempting verified recovery."
          if bash scripts/oracle_runner/backup_local_postgres.sh; then
            bash scripts/oracle_runner/check_offsite_backup_freshness.sh
            exit 0
          fi
          # Cloudflare can disable R2 following a billing downgrade. Protect
          # PostgreSQL with a new verified local backup, without claiming R2
          # is healthy or concealing the absence of disaster recovery.
          echo "::warning::Offsite R2 recovery FAILED; creating an emergency Oracle-local encrypted snapshot."
          bash scripts/oracle_runner/backup_local_postgres_no_r2.sh
          echo "::warning::DEGRADED: R2 offsite backup is unavailable; only a VERIFIED same-VM snapshot exists."
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '%s\n' '## DEGRADED — OFFSITE BACKUP UNAVAILABLE' 'Oracle PostgreSQL was backed up locally, encrypted and verified. No separate offsite backup is confirmed; restore R2 billing/access or add another offsite destination.' >> "$GITHUB_STEP_SUMMARY"
          fi
