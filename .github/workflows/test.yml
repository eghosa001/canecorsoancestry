name: Django tests

on:
  push:
    branches: [main]
    paths:
      - "accounts/**/*.py"
      - "registry/**/*.py"
      - "pedigrees/**/*.py"
      - "core/**/*.py"
      - "config/**/*.py"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "accounts/**/*.py"
      - "registry/**/*.py"
      - "pedigrees/**/*.py"
      - "core/**/*.py"
      - "config/**/*.py"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/test.yml"

permissions:
  contents: read

concurrency:
  group: django-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run change-scoped checks
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          else
            changed="$(git diff --name-only HEAD^ HEAD)"
          fi
          echo "$changed"

          if grep -Eq '(^|/)(models\.py|migrations/)' <<<"$changed"; then
            python manage.py makemigrations --check --dry-run
          fi

          python manage.py check

          targets=()

          if grep -q '^pedigrees/' <<<"$changed"; then
            targets+=("pedigrees.tests.PedigreeServiceTests")
          fi

          if grep -Eq '^registry/(management/commands/(import_canecorso_archive|refresh_canecorso_latest)\.py|tests_canecorso_(import|latest)\.py)$' <<<"$changed"; then
            targets+=("registry.tests_canecorso_import" "registry.tests_canecorso_latest")
          fi

          if grep -q '^registry/' <<<"$changed"; then
            targets+=("registry.tests.DogModelTests")
          fi

          if grep -Eq '^registry/(models|services|verification|views|querysets)\.py$|^registry/migrations/|^registry/tests_production_hardening\.py$' <<<"$changed"; then
            targets+=("registry.tests_production_hardening")
          fi

          if grep -Eq '^registry/(models|querysets)\.py$|^registry/management/commands/audit_production_invariants\.py$|^registry/tests_production_invariants\.py$|^registry/migrations/0014_unique_canonical_litter_birth\.py$' <<<"$changed"; then
            targets+=("registry.tests_production_invariants")
          fi

          if grep -Eq '^registry/(services|verification)\.py$' <<<"$changed"; then
            targets+=(
              "accounts.tests_admin_surfaces"
              "accounts.tests_member_access.MemberAccessFlowTests"
              "accounts.tests_verification.VerificationGovernanceTests"
              "accounts.tests_moderation_intelligence.DuplicateIntelligenceTests"
            )
          fi

          if grep -q '^accounts/' <<<"$changed"; then
            scoped_accounts=false

            if grep -Eq '^accounts/(direct_dog_edit|tests_direct_dog_edit|urls)[.]py$' <<<"$changed"; then
              targets+=("accounts.tests_direct_dog_edit" "accounts.tests_role_separation")
              scoped_accounts=true
            fi

            if grep -Eq '^accounts/(admin\.py|tests_admin_surfaces\.py)$' <<<"$changed"; then
              targets+=("accounts.tests_admin_surfaces")
              scoped_accounts=true
            fi

            if grep -q '^accounts/views\.py$' <<<"$changed"; then
              if [ "${{ github.event_name }}" = "pull_request" ]; then
                view_diff="$(git diff -U0 "origin/${{ github.base_ref }}...HEAD" -- accounts/views.py)"
              else
                view_diff="$(git diff -U0 HEAD^ HEAD -- accounts/views.py)"
              fi

              if grep -Eq 'moderation_|verification_|review_submission|review_dispute|merge_dogs|verify_dog|duplicate_' <<<"$view_diff"; then
                targets+=(
                  "accounts.tests_admin_surfaces"
                  "accounts.tests_moderation_intelligence.ModerationQueueTests"
                  "accounts.tests_verification.VerificationGovernanceTests"
                )
              fi

              if grep -Eq 'signup|submit_kennel|claim_kennel|edit_kennel|submit_document|request_document_visibility' <<<"$view_diff"; then
                targets+=(
                  "accounts.tests_member_access.MemberAccessFlowTests"
                  "accounts.tests_member_phase.KennelClaimTests"
                  "accounts.tests_member_phase.DocumentVisibilityTests"
                  "accounts.tests_member_phase.KennelIdentityProtectionTests"
                )
              fi

              scoped_accounts=true
            fi

            if grep -Eq '^accounts/(forms\.py|tests_account_recovery\.py)$' <<<"$changed"; then
              targets+=("accounts.tests_account_recovery")
              scoped_accounts=true
            fi

            if grep -Eq '^accounts/tests_production_readiness\.py$' <<<"$changed"; then
              targets+=("accounts.tests_production_readiness")
              scoped_accounts=true
            fi

            if grep -Eq '^accounts/(forms\.py|tests_upload_security\.py)$' <<<"$changed"; then
              targets+=("accounts.tests_upload_security")
              scoped_accounts=true
            fi

            if grep -Eq '^accounts/(models\.py|payments\.py|tests_payments\.py)$' <<<"$changed"; then
              targets+=("accounts.tests_payments")
              scoped_accounts=true
            fi

            if grep -Eq '^accounts/(forms\.py|views\.py|tests_member_access\.py)$' <<<"$changed"; then
              targets+=("accounts.tests_member_access.MemberAccessFlowTests")
              scoped_accounts=true
            fi

            if grep -Eq '^accounts/tests_moderation_intelligence\.py$' <<<"$changed"; then
              targets+=("accounts.tests_moderation_intelligence")
              scoped_accounts=true
            fi

            if grep -Eq '^accounts/tests_verification\.py$' <<<"$changed"; then
              targets+=("accounts.tests_verification")
              scoped_accounts=true
            fi

            if [ "$scoped_accounts" != "true" ]; then
              echo "::error::Accounts Python changes require an explicit change-scoped test mapping. Do not fall back to the full accounts suite."
              exit 1
            fi
          fi

          if grep -Eq '^core/.*\.py$' <<<"$changed"; then
            targets+=("core")
          fi

          if [ ${#targets[@]} -eq 0 ]; then
            echo "No changed Python app requires tests."
            exit 0
          fi

          unique_targets=()
          declare -A seen_targets=()
          for target in "${targets[@]}"; do
            if [ -z "${seen_targets[$target]+x}" ]; then
              unique_targets+=("$target")
              seen_targets["$target"]=1
            fi
          done
          targets=("${unique_targets[@]}")

          printf 'Running scoped tests: %s\n' "${targets[*]}"
          python manage.py test "${targets[@]}" --verbosity 1
