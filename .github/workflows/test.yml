name: Django tests

on:
  push:
    branches: [main]
    paths:
      - "accounts/**/*.py"
      - "registry/**/*.py"
      - "pedigrees/**/*.py"
      - "core/**/*.py"
      - "config/**/*.py"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
  pull_request:
    paths:
      - "accounts/**/*.py"
      - "registry/**/*.py"
      - "pedigrees/**/*.py"
      - "core/**/*.py"
      - "config/**/*.py"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"

permissions:
  contents: read

concurrency:
  group: django-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - name: Production deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-production-check-secret-key
          DJANGO_ALLOWED_HOSTS: testserver,localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver
          SITE_URL: https://testserver
          DATABASE_URL: sqlite:///production-check.sqlite3
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: python manage.py check --deploy
      - name: Northflank deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.northflank
          DJANGO_SECRET_KEY: ci-only-northflank-check-secret-key
          DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1,.code.run
          DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver,https://example.code.run
          SITE_URL: https://testserver
          DATABASE_URL: sqlite:///northflank-check.sqlite3
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          R2_GATEWAY_URL: https://edge.example.workers.dev
          MEDIA_EDGE_BASE_URL: https://edge.example.workers.dev
        run: |
          python manage.py check --deploy
          python - <<'PY'
          import os
          import django

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.northflank")
          django.setup()
          from django.contrib.staticfiles.storage import staticfiles_storage

          url = staticfiles_storage.url("core/site.css")
          if url != "/static/core/site.css":
              raise SystemExit(f"Unexpected Northflank static URL: {url}")
          print(f"Northflank static URL: {url}")
          PY
      - run: python manage.py migrate --noinput
      - name: Validate and audit canonical seed
        run: |
          python manage.py validate_pedigree_dataset data/seeds/bellissimo-dogs.json
          python manage.py import_bellissimo
          python manage.py import_bellissimo_puppies
          python manage.py audit_pedigree_data --fail-on-critical
      - name: Run change-scoped tests
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^ HEAD)"
          else
            changed="$(git show --pretty='' --name-only HEAD)"
          fi
          targets=()
          grep -q '^pedigrees/' <<<"$changed" && targets+=("pedigrees.tests")
          grep -q '^registry/' <<<"$changed" && targets+=("registry")
          grep -q '^accounts/' <<<"$changed" && targets+=("accounts")
          grep -q '^core/.*\.py
 <<<"$changed" && targets+=("core")
          if [ ${#targets[@]} -eq 0 ]; then
            echo "No changed Python app requires tests."
            exit 0
          fi
          printf 'Running scoped tests: %s\n' "${targets[*]}"
          python manage.py test "${targets[@]}" --verbosity 1
