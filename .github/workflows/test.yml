name: Django tests

on:
  push:
    branches: [main]
    paths:
      - "accounts/**/*.py"
      - "registry/**/*.py"
      - "pedigrees/**/*.py"
      - "core/**/*.py"
      - "config/**/*.py"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
  pull_request:
    paths:
      - "accounts/**/*.py"
      - "registry/**/*.py"
      - "pedigrees/**/*.py"
      - "core/**/*.py"
      - "config/**/*.py"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"

permissions:
  contents: read

concurrency:
  group: django-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run change-scoped checks
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          else
            changed="$(git diff --name-only HEAD^ HEAD)"
          fi
          echo "$changed"

          if grep -Eq '(^|/)(models\.py|migrations/)' <<<"$changed"; then
            python manage.py makemigrations --check --dry-run
          fi

          python manage.py check

          targets=()
          grep -q '^pedigrees/' <<<"$changed" && targets+=("pedigrees.tests.PedigreeServiceTests")

          if grep -Eq '^registry/(management/commands/(import_canecorso_archive|refresh_canecorso_latest)\.py|tests_canecorso_(import|latest)\.py)
            echo "No changed Python app requires tests."
            exit 0
          fi

          printf 'Running scoped tests: %s\n' "${targets[*]}"
          python manage.py test "${targets[@]}" --verbosity 1
 <<<"$changed"; then
            targets+=("registry.tests_canecorso_import" "registry.tests_canecorso_latest")
          elif grep -q '^registry/' <<<"$changed"; then
            targets+=("registry.tests.DogModelTests")
          fi

          if grep -Eq '^(accounts/(views|forms|urls|admin)\.py|accounts/tests_verification\.py|accounts/tests_payments\.py|accounts/templates/accounts/(moderation_queue|moderation_submission_detail|submission_list|verification_dashboard)\.html|registry/(verification|services|permissions|models|admin)\.py|registry/migrations/.*|core/media_views\.py)
            echo "No changed Python app requires tests."
            exit 0
          fi

          printf 'Running scoped tests: %s\n' "${targets[*]}"
          python manage.py test "${targets[@]}" --verbosity 1
 <<<"$changed"; then
            targets+=("accounts.tests_verification.VerificationGovernanceTests")
            targets+=("accounts.tests_payments.PaidSubmissionTests")
          elif grep -q '^accounts/' <<<"$changed"; then
            targets+=("accounts")
          fi

          if grep -q '^core/media_views\.py
            echo "No changed Python app requires tests."
            exit 0
          fi

          printf 'Running scoped tests: %s\n' "${targets[*]}"
          python manage.py test "${targets[@]}" --verbosity 1
 <<<"$changed"; then
            targets+=("core.tests_cloudflare_media")
          elif grep -Eq '^core/.*\.py
            echo "No changed Python app requires tests."
            exit 0
          fi

          printf 'Running scoped tests: %s\n' "${targets[*]}"
          python manage.py test "${targets[@]}" --verbosity 1
 <<<"$changed"; then
            targets+=("core")
          fi

          if [ ${#targets[@]} -eq 0 ]; then
            echo "No changed Python app requires tests."
            exit 0
          fi

          printf 'Running scoped tests: %s\n' "${targets[*]}"
          python manage.py test "${targets[@]}" --verbosity 1
