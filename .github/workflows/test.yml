name: Django tests

on:
  push:
    branches: [main]
    paths:
      - "accounts/**/*.py"
      - "registry/**/*.py"
      - "pedigrees/**/*.py"
      - "core/**/*.py"
      - "config/**/*.py"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
  pull_request:
    paths:
      - "accounts/**/*.py"
      - "registry/**/*.py"
      - "pedigrees/**/*.py"
      - "core/**/*.py"
      - "config/**/*.py"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"

permissions:
  contents: read

concurrency:
  group: django-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run change-scoped checks
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD)"
          echo "$changed"

          if grep -Eq '(^|/)(models\.py|migrations/)' <<<"$changed"; then
            python manage.py makemigrations --check --dry-run
          fi

          python manage.py check

          targets=()
          grep -q '^pedigrees/' <<<"$changed" && targets+=("pedigrees.tests.PedigreeServiceTests")
          grep -q '^registry/' <<<"$changed" && targets+=("registry.tests.DogModelTests")
          grep -q '^accounts/' <<<"$changed" && targets+=("accounts")
          grep -Eq '^core/.*\.py$' <<<"$changed" && targets+=("core")

          if [ ${#targets[@]} -eq 0 ]; then
            echo "No changed Python app requires tests."
            exit 0
          fi

          printf 'Running scoped tests: %s\n' "${targets[*]}"
          python manage.py test "${targets[@]}" --verbosity 1
