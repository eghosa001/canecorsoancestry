name: Django tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: django-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - name: Production deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-production-check-secret-key
          DJANGO_ALLOWED_HOSTS: testserver,localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver
          SITE_URL: https://testserver
          DATABASE_URL: sqlite:///production-check.sqlite3
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: python manage.py check --deploy
      - name: Render deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.render
          DJANGO_SECRET_KEY: ci-only-render-check-secret-key
          DJANGO_ALLOWED_HOSTS: testserver,localhost,.onrender.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver
          SITE_URL: https://testserver
          DATABASE_URL: sqlite:///render-check.sqlite3
          DJANGO_DB_EXTRA_SCHEMAS: public
          R2_GATEWAY_URL: https://edge.example.workers.dev
          MEDIA_EDGE_BASE_URL: https://edge.example.workers.dev
        run: python manage.py check --deploy
      - run: python manage.py migrate --noinput
      - name: Validate and audit canonical seed
        run: |
          python manage.py validate_pedigree_dataset data/seeds/bellissimo-dogs.json
          python manage.py import_bellissimo
          python manage.py audit_pedigree_data --fail-on-critical
      - run: python manage.py test --verbosity 1
