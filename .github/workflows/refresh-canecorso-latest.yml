name: Refresh CaneCorso latest additions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-canecorso-latest.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: canecorso-latest-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DB_SCHEMA: django_app
      DJANGO_DB_SSLMODE: require
      DJANGO_DB_EXTRA_SCHEMAS: public
      DJANGO_ALLOWED_HOSTS: canecorsoancestry.onrender.com
      DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry.onrender.com
      DJANGO_REQUIRE_OBJECT_STORAGE: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Missing AIVEN_DATABASE_URL"; exit 1; }
          test -n "$DJANGO_SECRET_KEY" || { echo "::error::Missing DJANGO_SECRET_KEY"; exit 1; }

      - run: pip install -r requirements.txt

      - name: Verify migrations
        run: python manage.py migrate --check

      - name: Refresh latest public pedigree records
        run: python manage.py refresh_canecorso_latest --limit 250 --delay 0.2

      - name: Audit pedigree integrity
        run: python manage.py audit_pedigree_data --fail-on-critical
