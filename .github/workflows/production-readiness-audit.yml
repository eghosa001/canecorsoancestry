name: Production readiness audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-tests-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py test accounts registry pedigrees core --verbosity 1

  full-tests-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cca
      DJANGO_DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test accounts registry pedigrees core --verbosity 1

  ui-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py migrate --noinput
      - run: python manage.py import_bellissimo
      - name: Seed UI review account and representative moderation data
        run: |
          python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          from registry.models import DisputeCase, Dog, DogDocument, Kennel, KennelMembership, Litter, ModerationAudit, Submission
          U = get_user_model()
          u, _ = U.objects.get_or_create(username="ui-reviewer", defaults={"is_staff": True, "email": "ui-reviewer@example.com"})
          u.is_staff = True
          u.email = "ui-reviewer@example.com"
          u.set_password("ui-reviewer-password")
          u.save()
          k = Kennel.objects.filter(dogs__isnull=False).distinct().first() or Kennel.objects.create(name="UI Kennel", slug="ui-kennel")
          KennelMembership.objects.update_or_create(user=u, kennel=k, defaults={"role": KennelMembership.Role.OWNER})
          Kennel.objects.get_or_create(slug="claimable-kennel", defaults={"name": "Claimable Kennel", "country": "Nigeria"})
          sire = Dog.objects.filter(kennel=k, sex=Dog.Sex.MALE).first()
          dam = Dog.objects.filter(kennel=k, sex=Dog.Sex.FEMALE).first()
          Litter.objects.get_or_create(code="UI-LITTER-2026", defaults={"kennel": k, "sire": sire, "dam": dam, "is_public": False})
          dog = Dog.objects.filter(kennel=k).first()
          if dog:
              DogDocument.objects.get_or_create(dog=dog, title="UI pedigree evidence", defaults={"document_type": DogDocument.DocumentType.PEDIGREE, "file": "documents/ui-pedigree.pdf", "submitted_by": u})
              if not Submission.objects.filter(submitted_by=u, dog=dog, kind=Submission.Kind.CORRECTION, status=Submission.Status.PENDING).exists():
                  Submission.objects.create(kind=Submission.Kind.CORRECTION, submitted_by=u, dog=dog, kennel=dog.kennel, priority=Submission.Priority.HIGH, payload={"name": dog.name, "colour": "Brindle" if dog.colour != "Brindle" else "Black"}, notes="Production-readiness UI review.")
              dispute, _ = DisputeCase.objects.get_or_create(dog=dog, opened_by=u, reason=DisputeCase.Reason.PEDIGREE, status=DisputeCase.Status.OPEN, defaults={"details": "Production-readiness dispute example."})
              ModerationAudit.objects.get_or_create(action=ModerationAudit.Action.DISPUTE_OPENED, dispute=dispute, defaults={"actor": u, "dog": dog, "kennel": dog.kennel, "summary": {"reason": dispute.reason, "audit_seed": True}})
          PY
      - name: Start Django
        run: |
          python manage.py runserver 127.0.0.1:8000 > /tmp/cca-django.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cca-django.log
          exit 1
      - run: python scripts/ui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readiness-ui
          path: artifacts/ui
          if-no-files-found: warn

  security-production-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: audit-security-check-secret-key-with-sufficient-entropy
      DATABASE_URL: sqlite:///security-check.sqlite3
      DJANGO_ALLOWED_HOSTS: testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver
      SITE_URL: https://testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt --strict
      - run: python manage.py check --deploy
      - run: python scripts/fast_path_guard.py

  production-data-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DB_SCHEMA: django_app
      DJANGO_DB_SSLMODE: require
      DJANGO_DB_EXTRA_SCHEMAS: extensions,public
      DJANGO_ALLOWED_HOSTS: testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver
      SITE_URL: https://testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover production database pooler
        shell: bash
        run: |
          test -n "$SUPABASE_DATABASE_URL"
          test -n "$DJANGO_SECRET_KEY"
          target_url="$(python scripts/discover_supabase_session_pooler.py)"
          echo "::add-mask::$target_url"
          echo "DATABASE_URL=$target_url" >> "$GITHUB_ENV"
      - run: python manage.py migrate --check
      - name: Check canonical production dataset
        run: |
          python manage.py shell -c "
          from registry.models import Dog, Kennel, Litter
          dogs=Dog.objects.count(); public=Dog.objects.filter(is_public=True).count()
          kennels=Kennel.objects.count(); litters=Litter.objects.count()
          assert dogs >= 33000, dogs
          assert public > 0 and kennels > 0
          print(f'dogs={dogs} public={public} kennels={kennels} litters={litters}')
          "
      - run: python manage.py audit_pedigree_data --fail-on-critical

  live-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_BASE_URL: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/production_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readiness-live
          path: artifacts/production-smoke
          if-no-files-found: warn
