name: Cloud Run deploy

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "config/settings/cloudrun.py"
      - "core/cloudrun_storage.py"
      - "core/cloudflare_media.py"
      - "core/media_views.py"
      - "src/cloudrun-edge.js"
      - "wrangler.edge.*.toml"
      - "package.json"
      - ".github/workflows/cloudrun-deploy.yml"
      - "requirements.txt"
      - "core/static/**"
      - "templates/**"
      - "accounts/templates/**"
      - "registry/templates/**"
      - "pedigrees/templates/**"
  workflow_dispatch:
    inputs:
      target:
        description: Edge target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      SERVICE_NAME: canecorsoancestry
      ARTIFACT_REPOSITORY: canecorsoancestry
      DB_SECRET_NAME: canecorsoancestry-database-url
      DJANGO_SECRET_NAME: canecorsoancestry-django-secret
      EDGE_WORKER_URL: https://canecorsoancestry-edge.aighewieghosa111.workers.dev

    steps:
      - uses: actions/checkout@v4

      - name: Apply deployment defaults
        shell: bash
        run: |
          if [ -z "$GCP_REGION" ]; then
            echo "GCP_REGION=europe-north1" >> "$GITHUB_ENV"
          fi

      - name: Validate configuration
        shell: bash
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT CLOUDFLARE_API_TOKEN SUPABASE_DATABASE_URL DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deployment value: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r requirements.txt
      - run: npm install

      - name: Discover Cloudflare account
        shell: bash
        run: |
          response="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          account_id="$(
            printf '%s' "$response" |
              python scripts/find_cloudflare_account.py
          )"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Validate Supabase Direct connection
        run: python scripts/validate_supabase_direct_url.py

      - name: Discover Supabase session pooler
        shell: bash
        run: |
          session_url="$(python scripts/discover_supabase_session_pooler.py)"
          echo "::add-mask::$session_url"
          echo "SUPABASE_MIGRATION_URL=$session_url" >> "$GITHUB_ENV"

      - name: Apply Django migrations to Supabase
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_ALLOWED_HOSTS: canecorsoancestry.com,www.canecorsoancestry.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry.com,https://www.canecorsoancestry.com
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: DATABASE_URL="$SUPABASE_MIGRATION_URL" python manage.py migrate --noinput

      - name: Build Cloudflare static assets
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          python manage.py collectstatic --noinput
          python scripts/build_cloudflare_assets.py

      - name: Configure Artifact Registry authentication
        shell: bash
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build and push Cloud Run image
        shell: bash
        run: |
          image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/web:$GITHUB_SHA"
          docker build -t "$image" .
          docker push "$image"
          echo "CLOUD_RUN_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Add encrypted Cloud Run secret versions
        shell: bash
        run: |
          db_path="$(
            printf '%s' "$SUPABASE_MIGRATION_URL" |
              gcloud secrets versions add "$DB_SECRET_NAME" --data-file=- --format='value(name)'
          )"
          django_path="$(
            printf '%s' "$DJANGO_SECRET_KEY" |
              gcloud secrets versions add "$DJANGO_SECRET_NAME" --data-file=- --format='value(name)'
          )"
          echo "DB_SECRET_VERSION=${db_path##*/}" >> "$GITHUB_ENV"
          echo "DJANGO_SECRET_VERSION=${django_path##*/}" >> "$GITHUB_ENV"

      - name: Write Cloud Run environment file
        shell: bash
        run: |
          cat > /tmp/cloudrun-env.yaml <<EOF
          DJANGO_SETTINGS_MODULE: "config.settings.cloudrun"
          DJANGO_DB_SCHEMA: "django_app"
          DJANGO_DB_SSLMODE: "require"
          DJANGO_ALLOWED_HOSTS: "canecorsoancestry.com,www.canecorsoancestry.com,.run.app,.workers.dev"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://canecorsoancestry.com,https://www.canecorsoancestry.com,https://canecorsoancestry-edge.aighewieghosa111.workers.dev,https://*.run.app"
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
          SITE_URL: "https://canecorsoancestry.com"
          R2_GATEWAY_URL: "$EDGE_WORKER_URL"
          MEDIA_EDGE_BASE_URL: "$EDGE_WORKER_URL"
          MEDIA_EDGE_URL_TTL: "300"
          GUNICORN_WORKERS: "2"
          GUNICORN_THREADS: "2"
          GUNICORN_TIMEOUT: "60"
          ANCESTRY_EMAIL_NOTIFICATIONS: "0"
          EOF

      - name: Deploy Django to Cloud Run
        shell: bash
        run: |
          runtime_sa="canecorsoancestry-runtime@$GCP_PROJECT_ID.iam.gserviceaccount.com"
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$CLOUD_RUN_IMAGE" \
            --service-account="$runtime_sa" \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min=0 \
            --max=3 \
            --concurrency=40 \
            --timeout=60 \
            --env-vars-file=/tmp/cloudrun-env.yaml \
            --set-secrets="DATABASE_URL=$DB_SECRET_NAME:$DB_SECRET_VERSION,DJANGO_SECRET_KEY=$DJANGO_SECRET_NAME:$DJANGO_SECRET_VERSION" \
            --quiet

          service_url="$(
            gcloud run services describe "$SERVICE_NAME" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --format='value(status.url)'
          )"
          echo "CLOUD_RUN_ORIGIN=$service_url" >> "$GITHUB_ENV"
          echo "Cloud Run origin: $service_url"

      - name: Verify Cloud Run directly
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/cloudrun-health.json -w '%{http_code}' "$CLOUD_RUN_ORIGIN/healthz/" || true)"
            if [ "$status" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/cloudrun-health.json; then
              cat /tmp/cloudrun-health.json
              exit 0
            fi
            echo "Cloud Run health attempt $attempt returned HTTP $status."
            cat /tmp/cloudrun-health.json 2>/dev/null || true
            sleep 5
          done
          echo "::error::Cloud Run health check failed."
          exit 1

      - name: Ensure Cloudflare R2 bucket exists
        shell: bash
        run: |
          npx wrangler r2 bucket info canecorsoancestry-media >/dev/null 2>&1 || \
            npx wrangler r2 bucket create canecorsoancestry-media

      - name: Select Cloudflare edge target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target }}" = "production" ]; then
            echo "EDGE_CONFIG=wrangler.edge.production.toml" >> "$GITHUB_ENV"
            echo "EDGE_HEALTH_URL=https://canecorsoancestry.com/healthz/" >> "$GITHUB_ENV"
          else
            echo "EDGE_CONFIG=wrangler.edge.preview.toml" >> "$GITHUB_ENV"
            echo "EDGE_HEALTH_URL=$EDGE_WORKER_URL/healthz/" >> "$GITHUB_ENV"
          fi

      - name: Build encrypted Cloudflare edge secret file
        run: |
          python -c 'import json, os; open("/tmp/edge-secrets.json", "w", encoding="utf-8").write(json.dumps({"DJANGO_SECRET_KEY": os.environ["DJANGO_SECRET_KEY"]}))'

      - name: Deploy Cloudflare edge
        shell: bash
        run: |
          npx wrangler deploy \
            --config "$EDGE_CONFIG" \
            --var "CLOUD_RUN_ORIGIN:$CLOUD_RUN_ORIGIN" \
            --secrets-file /tmp/edge-secrets.json

      - name: Verify Cloudflare edge
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/edge-health.json -w '%{http_code}' "$EDGE_HEALTH_URL" || true)"
            if [ "$status" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/edge-health.json; then
              echo "Cloudflare edge health check passed."
              cat /tmp/edge-health.json
              exit 0
            fi
            echo "Edge health attempt $attempt returned HTTP $status."
            cat /tmp/edge-health.json 2>/dev/null || true
            sleep 5
          done
          echo "::error::Cloudflare edge health check failed."
          exit 1

      - name: Keep Secret Manager free-tier footprint small
        if: success()
        shell: bash
        run: |
          for secret in "$DB_SECRET_NAME" "$DJANGO_SECRET_NAME"; do
            mapfile -t versions < <(
              gcloud secrets versions list "$secret" \
                --filter='state=ENABLED' \
                --sort-by='~createTime' \
                --format='value(name)'
            )
            if [ "${#versions[@]}" -gt 3 ]; then
              for version in "${versions[@]:3}"; do
                gcloud secrets versions destroy "$version" --secret="$secret" --quiet || true
              done
            fi
          done

      - name: Remove temporary secret files
        if: always()
        run: rm -f /tmp/edge-secrets.json /tmp/cloudrun-health.json /tmp/edge-health.json /tmp/cloudrun-env.yaml
