name: Fast Policy Guard

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
      - '.agents/**'
      - 'AGENTS.md'
      - 'SKILL.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.github/copilot-instructions.md'
      - 'scripts/fast_path_guard.py'
      - 'scripts/verify_active_services.py'
      - 'infra/active-services.json'
      - 'wrangler.site.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
      - '.agents/**'
      - 'AGENTS.md'
      - 'SKILL.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.github/copilot-instructions.md'
      - 'scripts/fast_path_guard.py'
      - 'scripts/verify_active_services.py'
      - 'infra/active-services.json'
      - 'scripts/oracle_runner/stage_django.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python3 scripts/fast_path_guard.py
      - run: python3 scripts/verify_active_services.py
