name: Oracle capacity tuning rollout

on:
  pull_request:
    paths:
      - "scripts/oracle_runner/apply_oracle_capacity_tune.sh"
      - "scripts/oracle_runner/stage_django.sh"
      - ".github/workflows/oracle-capacity-rollout.yml"
  push:
    branches: [main]
    paths:
      - "scripts/oracle_runner/apply_oracle_capacity_tune.sh"

permissions:
  contents: read

concurrency:
  group: oracle-django-stage-refs/heads/main
  cancel-in-progress: false

jobs:
  focused-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check guarded upgrade and rollback shell syntax
        run: |
          bash -n scripts/oracle_runner/apply_oracle_capacity_tune.sh
          bash -n scripts/oracle_runner/stage_django.sh
          python3 scripts/fast_path_guard.py

  apply:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'eghosa001/canecorsoancestry'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 40
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply CPU headroom and current Django release
        shell: bash
        run: bash scripts/oracle_runner/apply_oracle_capacity_tune.sh
