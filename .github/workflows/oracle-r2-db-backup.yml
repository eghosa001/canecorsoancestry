name: Oracle encrypted PostgreSQL R2 backup proof
on:
  pull_request:
    paths:
      - "scripts/oracle_runner/seal_postgres_backup.py"
      - "scripts/oracle_runner/r2_postgres_backup.py"
      - "scripts/oracle_runner/prove_r2_postgres_backup.sh"
      - ".github/workflows/oracle-r2-db-backup.yml"
  push:
    branches: [main]
    paths:
      - "scripts/oracle_runner/prove_r2_postgres_backup.sh"
permissions:
  contents: read
concurrency:
  group: oracle-pg-offsite-backup-proof
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate only backup safety and syntax
        run: |
          bash -n scripts/oracle_runner/prove_r2_postgres_backup.sh
          python3 -m py_compile scripts/oracle_runner/seal_postgres_backup.py scripts/oracle_runner/r2_postgres_backup.py
          python3 scripts/fast_path_guard.py
  backup-proof:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'eghosa001/canecorsoancestry' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Upload and independently verify encrypted off-VM database backup
        shell: bash
        run: bash scripts/oracle_runner/prove_r2_postgres_backup.sh
