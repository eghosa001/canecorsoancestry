name: Cloudflare WWW DNS audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-www-dns-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-www:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read the Cloudflare zone ID
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          response="$(curl --fail --silent --show-error --get \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-urlencode "name=canecorsoancestry.com" \
            https://api.cloudflare.com/client/v4/zones)"
          zone_id="$(printf '%s' "$response" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p.get("success") and len(p.get("result", [])) == 1, p.get("errors"); print(p["result"][0]["id"])')"
          echo "CLOUDFLARE_ZONE_ID=$zone_id" >> "$GITHUB_ENV"

      - name: List the exact www DNS records without changing them
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --get \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-urlencode "name=www.canecorsoancestry.com" \
            --data-urlencode "per_page=100" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records")"
          printf '%s' "$response" | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          if not payload.get("success"):
              raise SystemExit(json.dumps(payload.get("errors", [])))
          records = payload.get("result", [])
          print(json.dumps([
              {key: record.get(key) for key in ("id", "type", "name", "content", "proxied", "ttl", "comment")}
              for record in records
          ], indent=2))
          if not records:
              print("No DNS records found for www.canecorsoancestry.com.")
          '
