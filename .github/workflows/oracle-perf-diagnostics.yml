name: Oracle read-only latency diagnosis

on:
  schedule:
    - cron: "39 3 * * 2"  # Weekly low-volume, read-only Oracle latency diagnosis
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/oracle_runner/oracle_perf_diagnostics.sh"
      - "scripts/oracle_runner/profile_dog_browse.py"
      - "scripts/tests/test_oracle_perf_contract.py"
      - ".github/workflows/oracle-perf-diagnostics.yml"
  pull_request:
    paths:
      - "scripts/oracle_runner/oracle_perf_diagnostics.sh"
      - "scripts/oracle_runner/profile_dog_browse.py"
      - ".github/workflows/oracle-perf-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: oracle-read-only-diagnosis
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and policy
        run: |
          bash -n scripts/oracle_runner/oracle_perf_diagnostics.sh
          python3 -m unittest scripts.tests.test_oracle_perf_contract -v
          python3 scripts/fast_path_guard.py

  diagnostics:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'eghosa001/canecorsoancestry'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare CPU, Django, Oracle-local PostgreSQL and Cloudflare timings
        shell: bash
        run: |
          bash scripts/oracle_runner/oracle_perf_diagnostics.sh
          sudo -n podman exec -i cca-oracle-staging python - < scripts/oracle_runner/profile_dog_browse.py
