name: Bootstrap Django foundation

on:
  push:
    paths:
      - "manage.py"
      - "accounts/**"
      - "registry/**"
      - ".github/workflows/bootstrap-django.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate initial migrations and verify
        run: |
          python manage.py makemigrations accounts registry
          python manage.py check
          python manage.py test --verbosity 1
      - name: Commit generated migrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accounts/migrations registry/migrations
          if git diff --cached --quiet; then
            echo "Migrations already committed."
            exit 0
          fi
          git commit -m "Generate initial Django migrations"
          git push
