name: Oracle local PostgreSQL shadow (no cutover)
on:
  pull_request:
    paths:
      - "scripts/oracle_runner/stage_local_postgres_shadow.sh"
      - ".github/workflows/oracle-local-postgres-shadow.yml"
  push:
    branches: [main]
    paths:
      - "scripts/oracle_runner/stage_local_postgres_shadow.sh"
permissions:
  contents: read
concurrency:
  group: oracle-django-stage-refs/heads/main
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check security boundaries and shell syntax
        run: |
          bash -n scripts/oracle_runner/stage_local_postgres_shadow.sh
          python3 scripts/fast_path_guard.py
  stage:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'eghosa001/canecorsoancestry' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create isolated Postgres copy and compare SQL latency
        shell: bash
        run: bash scripts/oracle_runner/stage_local_postgres_shadow.sh
