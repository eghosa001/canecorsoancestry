name: Provision Northflank origin
# Redeploy marker: customer-whatsapp-owner-v34

on:
  push:
    branches: [main]
    paths:
      - "accounts/**"
      - "registry/**"
      - "pedigrees/**"
      - "core/**"
      - "templates/**"
      - "config/**"
      - "requirements.txt"
      - "manage.py"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision-northflank-origin
  cancel-in-progress: true

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      NF_API: https://api.northflank.com/v1
      NF_PROJECT_NAME: CaneCorsoAncestry
      NF_SERVICE_NAME: canecorsoancestry
      PUBLIC_SITE: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev
      MEDIA_EDGE: https://canecorsoancestry-edge.aighewieghosa111.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in NORTHFLANK_API_TOKEN SUPABASE_DATABASE_URL DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            else
              echo "::add-mask::${!name}"
            fi
          done
          exit "$missing"

      - name: Discover reachable Supabase session pooler
        shell: bash
        run: |
          python -m pip install --quiet "psycopg[binary]>=3.2,<4"
          target_url="$(python scripts/discover_supabase_session_pooler.py)"
          echo "::add-mask::$target_url"
          echo "DATABASE_URL=$target_url" >> "$GITHUB_ENV"

      - name: Create or locate Northflank project
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $NORTHFLANK_API_TOKEN" -H "Content-Type: application/json")
          projects="$(curl -fsS "${auth[@]}" "$NF_API/projects")"
          project_id="$(printf '%s' "$projects" | jq -r --arg name "$NF_PROJECT_NAME" '.data.projects[]? | select(.name == $name) | .id' | head -n1)"

          # Developer Sandbox allows one project. Reuse an existing project
          # rather than trying to create a second project under a different name.
          if [ -z "$project_id" ]; then
            project_id="$(printf '%s' "$projects" | jq -r '.data.projects[0].id // empty')"
            if [ -n "$project_id" ]; then
              existing_name="$(printf '%s' "$projects" | jq -r '.data.projects[0].name // "existing project"')"
              echo "Reusing existing Northflank Sandbox project: $existing_name ($project_id)"
            fi
          fi

          if [ -z "$project_id" ]; then
            payload="$(jq -n --arg name "$NF_PROJECT_NAME" '{name:$name,description:"Cane Corso Ancestry Django origin",color:"#EF233C",region:"europe-west"}')"
            http_code="$(curl -sS -o /tmp/nf-project.json -w '%{http_code}' "${auth[@]}" -X POST --data "$payload" "$NF_API/projects")"
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::Northflank project creation failed with HTTP $http_code"
              cat /tmp/nf-project.json
              exit 1
            fi
            project_id="$(jq -r '.data.id // empty' /tmp/nf-project.json)"
          fi

          test -n "$project_id"
          echo "NORTHFLANK_PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          echo "Northflank project: $project_id"

      - name: Create or update always-on Django service
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $NORTHFLANK_API_TOKEN" -H "Content-Type: application/json")

          services="$(curl -fsS "${auth[@]}" "$NF_API/projects/$NORTHFLANK_PROJECT_ID/services")"
          service_id="$(printf '%s' "$services" | jq -r --arg name "$NF_SERVICE_NAME" '.data.services[]? | select(.name == $name) | .id' | head -n1)"

          payload="$(jq -n             --arg name "$NF_SERVICE_NAME"             --arg db "$DATABASE_URL"             --arg secret "$DJANGO_SECRET_KEY"             --arg site "$PUBLIC_SITE"             --arg media "$MEDIA_EDGE"             '{
              name:$name,
              description:"Always-on Django origin for Cane Corso Ancestry",
              billing:{
                deploymentPlan:"nf-compute-10",
                buildPlan:"nf-compute-400-16"
              },
              deployment:{
                instances:1,
                docker:{configType:"default"},
                storage:{ephemeralStorage:{storageSize:1024}}
              },
              ports:[{
                name:"web",
                internalPort:8080,
                public:true,
                vpcAccessible:false,
                protocol:"HTTP"
              }],
              disabledCI:true,
              buildSource:"git",
              vcsData:{
                projectUrl:"https://github.com/eghosa001/canecorsoancestry",
                projectType:"github",
                projectBranch:"main"
              },
              buildSettings:{
                storage:{ephemeralStorage:{storageSize:16384}},
                dockerfile:{
                  buildEngine:"buildkit",
                  dockerFilePath:"/Dockerfile",
                  dockerWorkDir:"/"
                }
              },
              runtimeEnvironment:{
                DATABASE_URL:$db,
                DJANGO_SECRET_KEY:$secret,
                DJANGO_SETTINGS_MODULE:"config.settings.northflank",
                DJANGO_DB_SCHEMA:"django_app",
                DJANGO_DB_SSLMODE:"require",
                DJANGO_DB_EXTRA_SCHEMAS:"extensions,public",
                DJANGO_DB_CONN_MAX_AGE:"300",
                DJANGO_ALLOWED_HOSTS:"canecorsoancestry-site-edge.aighewieghosa111.workers.dev,.code.run,127.0.0.1,localhost",
                DJANGO_CSRF_TRUSTED_ORIGINS:"https://*.code.run,https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev",
                SITE_URL:$site,
                R2_GATEWAY_URL:$media,
                MEDIA_EDGE_BASE_URL:$media,
                MEDIA_EDGE_URL_TTL:"300",
                DJANGO_HSTS_SECONDS:"3600",
                DJANGO_HSTS_INCLUDE_SUBDOMAINS:"1",
                DJANGO_HSTS_PRELOAD:"0",
                DJANGO_LOG_LEVEL:"INFO",
                ANCESTRY_EMAIL_NOTIFICATIONS:"0",
                GUNICORN_WORKERS:"1",
                GUNICORN_THREADS:"8",
                GUNICORN_TIMEOUT:"60",
                GUNICORN_KEEPALIVE:"5",
                GUNICORN_MAX_REQUESTS:"1000",
                GUNICORN_MAX_REQUESTS_JITTER:"100"
              },
              healthChecks:[{
                protocol:"HTTP",
                type:"readinessProbe",
                path:"/healthz/",
                port:8080,
                initialDelaySeconds:15,
                periodSeconds:30,
                timeoutSeconds:5,
                failureThreshold:5,
                successThreshold:1
              }]
            }')"

          if [ -z "$service_id" ]; then
            response="$(curl -sS --fail-with-body "${auth[@]}" -X POST --data "$payload" "$NF_API/projects/$NORTHFLANK_PROJECT_ID/services/combined")"
            service_id="$(printf '%s' "$response" | jq -r '.data.id')"
            echo "Created Northflank service: $service_id"
          else
            echo "Reusing existing Northflank service: $service_id"
            patch="$(jq -n --arg site "$PUBLIC_SITE" --arg media "$MEDIA_EDGE" --arg db "$DATABASE_URL" --arg secret "$DJANGO_SECRET_KEY" '{runtimeEnvironment:{DATABASE_URL:$db,DJANGO_SECRET_KEY:$secret,DJANGO_SETTINGS_MODULE:"config.settings.northflank",DJANGO_DB_SCHEMA:"django_app",DJANGO_DB_SSLMODE:"require",DJANGO_DB_EXTRA_SCHEMAS:"extensions,public",DJANGO_DB_CONN_MAX_AGE:"300",DJANGO_ALLOWED_HOSTS:"canecorsoancestry-site-edge.aighewieghosa111.workers.dev,.code.run,127.0.0.1,localhost",DJANGO_CSRF_TRUSTED_ORIGINS:"https://*.code.run,https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev",SITE_URL:$site,R2_GATEWAY_URL:$media,MEDIA_EDGE_BASE_URL:$media,MEDIA_EDGE_URL_TTL:"300",DJANGO_HSTS_SECONDS:"3600",DJANGO_HSTS_INCLUDE_SUBDOMAINS:"1",DJANGO_HSTS_PRELOAD:"0",DJANGO_LOG_LEVEL:"INFO",ANCESTRY_EMAIL_NOTIFICATIONS:"0",GUNICORN_WORKERS:"1",GUNICORN_THREADS:"8",GUNICORN_TIMEOUT:"60",GUNICORN_KEEPALIVE:"5",GUNICORN_MAX_REQUESTS:"1000",GUNICORN_MAX_REQUESTS_JITTER:"100"}}')"
            curl -sS --fail-with-body "${auth[@]}" -X PATCH --data "$patch" "$NF_API/projects/$NORTHFLANK_PROJECT_ID/services/combined/$service_id" >/tmp/nf-service-patch.json
            echo "Synced Northflank runtime environment to the workers.dev public site."
          fi

          test -n "$service_id"
          echo "NORTHFLANK_SERVICE_ID=$service_id" >> "$GITHUB_ENV"

      - name: Build exact GitHub commit
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $NORTHFLANK_API_TOKEN" -H "Content-Type: application/json")
          payload="$(jq -n --arg sha "$GITHUB_SHA" '{sha:$sha}')"
          response=""
          http_code=""
          for attempt in $(seq 1 36); do
            http_code="$(curl -sS -o /tmp/nf-build-start.json -w '%{http_code}' "${auth[@]}" -X POST --data "$payload" "$NF_API/projects/$NORTHFLANK_PROJECT_ID/services/$NORTHFLANK_SERVICE_ID/build")"
            if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
              response="$(cat /tmp/nf-build-start.json)"
              break
            fi
            if [ "$http_code" = "409" ]; then
              echo "Northflank already has a build in progress; retrying exact SHA in 5s."
              sleep 5
              continue
            fi
            echo "::error::Northflank build start failed with HTTP $http_code"
            cat /tmp/nf-build-start.json
            exit 1
          done
          test -n "$response"
          build_id="$(printf '%s' "$response" | jq -r '.data.id // empty')"
          build_sha="$(printf '%s' "$response" | jq -r '.data.sha // empty')"
          test -n "$build_id"
          test "$build_sha" = "$GITHUB_SHA"
          echo "NORTHFLANK_BUILD_ID=$build_id" >> "$GITHUB_ENV"
          echo "Northflank build started: $build_id @ $build_sha"

      - name: Wait for exact build
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $NORTHFLANK_API_TOKEN")
          for attempt in $(seq 1 120); do
            response="$(curl -fsS "${auth[@]}" "$NF_API/projects/$NORTHFLANK_PROJECT_ID/services/$NORTHFLANK_SERVICE_ID/build/$NORTHFLANK_BUILD_ID")"
            status="$(printf '%s' "$response" | jq -r '.data.status // "PENDING"')"
            sha="$(printf '%s' "$response" | jq -r '.data.sha // empty')"
            echo "Northflank build=$status sha=$sha"
            case "$status" in
              FAILURE|CRASHED|ABORTED|SUBMISSION_FAILURE|UNSCHEDULABLE)
                printf '%s' "$response" | jq .
                exit 1
                ;;
              SUCCESS)
                test "$sha" = "$GITHUB_SHA"
                break
                ;;
            esac
            sleep 10
          done
          test "$status" = "SUCCESS"

      - name: Wait for exact deployment
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $NORTHFLANK_API_TOKEN")
          deployed_sha=""
          deploy=""
          for attempt in $(seq 1 60); do
            service="$(curl -fsS "${auth[@]}" "$NF_API/projects/$NORTHFLANK_PROJECT_ID/services/$NORTHFLANK_SERVICE_ID")"
            deploy="$(printf '%s' "$service" | jq -r '.data.status.deployment.status // "PENDING"')"
            if [ "$deploy" = "FAILED" ]; then
              printf '%s' "$service" | jq .
              exit 1
            fi

            deployment="$(curl -fsS "${auth[@]}" "$NF_API/projects/$NORTHFLANK_PROJECT_ID/services/$NORTHFLANK_SERVICE_ID/deployment")"
            deployed_sha="$(printf '%s' "$deployment" | jq -r '.data.internal.deployedSHA // .data.internal.buildSHA // empty')"
            echo "Northflank deployment=$deploy deployed_sha=$deployed_sha"

            if [ "$deploy" = "COMPLETED" ] && [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              break
            fi
            sleep 10
          done
          test "$deploy" = "COMPLETED"
          test "$deployed_sha" = "$GITHUB_SHA"

      - name: Discover Northflank origin and smoke test it
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $NORTHFLANK_API_TOKEN")
          dns=""
          for attempt in $(seq 1 30); do
            response="$(curl -fsS "${auth[@]}" "$NF_API/projects/$NORTHFLANK_PROJECT_ID/services/$NORTHFLANK_SERVICE_ID/ports")"
            dns="$(printf '%s' "$response" | jq -r '.data.ports[]? | select(.name == "web") | .dns // empty' | head -n1)"
            [ -n "$dns" ] && break
            sleep 5
          done
          test -n "$dns"

          origin="https://$dns"
          echo "NORTHFLANK_ORIGIN=$origin" >> "$GITHUB_ENV"
          echo "Northflank origin: $origin"

          for path in "/healthz/" "/dogs/?q=Branco+Custodi+Nos" "/statistics/"; do
            status=""
            for attempt in $(seq 1 18); do
              status="$(curl --connect-timeout 10 --max-time 30 -sS -H 'X-CCA-Edge: 1' -o /tmp/nf-response -w '%{http_code}' "$origin$path" || true)"
              [ "$status" = "200" ] && break
              sleep 5
            done
            echo "$path -> HTTP $status"
            if [ "$status" != "200" ]; then
              cat /tmp/nf-response 2>/dev/null || true
              exit 1
            fi
          done

          {
            echo "## Northflank origin ready"
            echo ""
            printf '%s\n' "- Project: $NORTHFLANK_PROJECT_ID"
            printf '%s\n' "- Service: $NORTHFLANK_SERVICE_ID"
            printf '%s\n' "- Origin: $origin"
            printf '%s\n' "- Plan: nf-compute-10 (0.1 vCPU, 256 MB)"
            printf '%s\n' "- Deployed SHA: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
