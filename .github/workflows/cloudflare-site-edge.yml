name: Cloudflare site edge

on:
  pull_request:
    paths:
      - "src/site-edge.js"
      - "wrangler.site.toml"
      - ".github/workflows/cloudflare-site-edge.yml"
  push:
    branches: [main]
    paths:
      - "src/site-edge.js"
      - "wrangler.site.toml"
      - ".github/workflows/cloudflare-site-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-site-edge
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Worker JavaScript
        run: node --check src/site-edge.js

      - name: Test public edge cache policy
        run: node scripts/test_site_edge_cache.mjs

      - name: Verify Northflank origin before cutover
        shell: bash
        run: |
          origin="https://web--canecorsoancestry--4w9gl8jxj4yr.code.run"
          for path in "/healthz/" "/dogs/?q=Branco+Custodi+Nos" "/statistics/"; do
            status="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/northflank-origin.html -w '%{http_code}' "$origin$path" || true)"
            echo "$path -> HTTP $status"
            test "$status" = "200"
          done

      - name: Validate Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.site.toml

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 19a03bec57c0277e01e1e70e241576af

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Deploy site edge
        run: npx --yes wrangler@4 deploy --config wrangler.site.toml

      - name: Verify edge and fast warm-up response
        shell: bash
        run: |
          base="https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev"

          for attempt in $(seq 1 12); do
            status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/edge-health.json -w '%{http_code}' "$base/__edge/health" || true)"
            if [ "$status" = "200" ] && grep -q '"service":"site-edge"' /tmp/edge-health.json; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              cat /tmp/edge-health.json 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          page_status="$(curl --connect-timeout 4 --max-time 8 -sS -H 'Accept: text/html' -o /tmp/edge-page.html -w '%{http_code}' "$base/" || true)"
          if [ "$page_status" != "200" ]; then
            echo "::error::Site edge did not return a usable page quickly; HTTP $page_status"
            cat /tmp/edge-page.html 2>/dev/null || true
            exit 1
          fi

          auth_status="$(curl --connect-timeout 4 --max-time 8 -sS -D /tmp/auth-headers.txt -H 'Accept: text/html' -o /tmp/auth-page.html -w '%{http_code}' "$base/accounts/login/" || true)"
          if [ "$auth_status" != "200" ]; then
            echo "::error::Auth-first edge did not return a login UI quickly; HTTP $auth_status"
            cat /tmp/auth-page.html 2>/dev/null || true
            exit 1
          fi
          grep -q 'name="username"' /tmp/auth-page.html
          grep -q 'name="password"' /tmp/auth-page.html
          grep -q 'name="csrfmiddlewaretoken"' /tmp/auth-page.html

          ready_status=""
          for attempt in $(seq 1 12); do
            ready_status="$(curl --connect-timeout 4 --max-time 10 -sS -o /tmp/auth-ready.json -w '%{http_code}' "$base/__edge/auth-ready" || true)"
            if [ "$ready_status" = "200" ] || [ "$ready_status" = "202" ]; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::Auth readiness endpoint returned HTTP $ready_status after deployment propagation retries"
              cat /tmp/auth-ready.json 2>/dev/null || true
              exit 1
            fi
            sleep 3
          done

          echo "Site edge, auth-first login UI, and readiness checks are healthy."

      - name: Clean temporary files
        if: always()
        run: rm -f /tmp/edge-health.json /tmp/edge-page.html /tmp/auth-headers.txt /tmp/auth-page.html /tmp/auth-ready.json
