name: Cloudflare site edge

on:
  pull_request:
    paths:
      - "src/site-edge.js"
      - "wrangler.site.toml"
      - "scripts/test_site_edge_cache.mjs"
      - ".github/workflows/cloudflare-site-edge.yml"
  push:
    branches: [main]
    paths:
      - "src/site-edge.js"
      - "wrangler.site.toml"
      - "scripts/test_site_edge_cache.mjs"
      - ".github/workflows/cloudflare-site-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-site-edge
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Worker JavaScript
        run: node --check src/site-edge.js

      - name: Test public edge cache policy
        run: node scripts/test_site_edge_cache.mjs

      - name: Warm Northflank origin before cutover
        shell: bash
        run: |
          origin="https://web--canecorsoancestry--4w9gl8jxj4yr.code.run"
          status="$(curl --connect-timeout 5 --max-time 12 -sS -H 'X-CCA-Edge: 1' -o /tmp/northflank-origin.html -w '%{http_code}' "$origin/healthz/" || true)"
          echo "/healthz/ -> HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Origin is cold or still waking; deploying the edge keep-warm anyway."
          fi

      - name: Validate Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.site.toml

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 19a03bec57c0277e01e1e70e241576af

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Deploy site edge
        run: npx --yes wrangler@4 deploy --config wrangler.site.toml

      - name: Verify public workers.dev edge and fast warm-up response
        shell: bash
        run: |
          base="https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev"

          for attempt in $(seq 1 12); do
            status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/edge-health.json -w '%{http_code}' "$base/__edge/health" || true)"
            if [ "$status" = "200" ] && grep -q '"service":"site-edge"' /tmp/edge-health.json; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              cat /tmp/edge-health.json 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          page_status="$(curl --connect-timeout 4 --max-time 8 -sS -H 'Accept: text/html' -o /tmp/edge-page.html -w '%{http_code}' "$base/" || true)"
          if [ "$page_status" != "200" ]; then
            echo "::error::Site edge did not return a usable page quickly; HTTP $page_status"
            cat /tmp/edge-page.html 2>/dev/null || true
            exit 1
          fi
          grep -q 'data-ui-version="customer-v49"' /tmp/edge-page.html
          grep -q 'cane-corso-head-logo-right.webp' /tmp/edge-page.html
          grep -q '20261004-headlogo-v64' /tmp/edge-page.html
          grep -q 'premium-polish.css?v=20261004-interaction-v49' /tmp/edge-page.html
          logo_status="$(curl --connect-timeout 4 --max-time 8 -sS -o /tmp/live-logo.webp -w '%{http_code}' "$base/static/core/cane-corso-head-logo-right.webp?v=20261004-headlogo-v64" || true)"
          if [ "$logo_status" != "200" ] || [ ! -s /tmp/live-logo.webp ]; then
            echo "::error::New live logo asset is not being served; HTTP $logo_status"
            exit 1
          fi
          python -c 'from pathlib import Path; data=Path("/tmp/live-logo.webp").read_bytes(); assert len(data)>=5000 and data[:4]==b"RIFF" and data[8:12]==b"WEBP", "Live logo is not a valid non-empty WebP asset"'
          kennel_status="$(curl --connect-timeout 4 --max-time 12 -sS -o /tmp/kennels-page.html -w '%{http_code}' "$base/kennels/" || true)"
          if [ "$kennel_status" != "200" ]; then
            echo "::error::Live kennel page failed; HTTP $kennel_status"
            exit 1
          fi
          kennel_cards="$(grep -o 'class="kennel-card"' /tmp/kennels-page.html | wc -l | tr -d ' ')"
          if [ "$kennel_cards" -le 5 ]; then
            echo "::error::Live kennel directory still exposes only $kennel_cards kennel cards"
            exit 1
          fi
          if grep -Eqi 'imported source kennel|sourced from|breeder metadata|source kennel' /tmp/kennels-page.html; then
            echo "::error::Source/provenance wording is still visible on the live kennel page"
            exit 1
          fi
          vm_status="$(curl --connect-timeout 4 --max-time 12 -sS -o /tmp/virtual-mating.html -w '%{http_code}' "$base/pedigrees/virtual-mating/" || true)"
          if [ "$vm_status" != "200" ]; then
            echo "::error::Live virtual mating page failed; HTTP $vm_status"
            exit 1
          fi
          grep -q 'type="search" id="sire_q"' /tmp/virtual-mating.html
          grep -q 'type="search" id="dam_q"' /tmp/virtual-mating.html
          grep -q 'role="combobox"' /tmp/virtual-mating.html

          male_status="$(curl --connect-timeout 4 --max-time 10 -sS -o /tmp/male-suggestions.json -w '%{http_code}' "$base/dogs/suggestions/?q=&browse=1&sex=male" || true)"
          female_status="$(curl --connect-timeout 4 --max-time 10 -sS -o /tmp/female-suggestions.json -w '%{http_code}' "$base/dogs/suggestions/?q=&browse=1&sex=female" || true)"
          if [ "$male_status" != "200" ] || [ "$female_status" != "200" ]; then
            echo "::error::Live virtual mating suggestion endpoint failed; male=$male_status female=$female_status"
            exit 1
          fi
          python -c 'import json; assert json.load(open("/tmp/male-suggestions.json"))["results"], "No male mating suggestions returned"; assert json.load(open("/tmp/female-suggestions.json"))["results"], "No female mating suggestions returned"'

          grep -q 'Pedigree · Bloodline · Heritage' /tmp/edge-page.html
          if grep -Eqi 'canonical dog records|pedigree provenance|<h2>Record status</h2>|No canonical record|Published pedigree record' /tmp/edge-page.html; then
            echo "::error::Public source/record wording is still present on the live homepage"
            exit 1
          fi

          auth_status="$(curl --connect-timeout 4 --max-time 8 -sS -D /tmp/auth-headers.txt -H 'Accept: text/html' -o /tmp/auth-page.html -w '%{http_code}' "$base/accounts/login/" || true)"
          if [ "$auth_status" != "200" ]; then
            echo "::error::Auth-first edge did not return a login UI quickly; HTTP $auth_status"
            cat /tmp/auth-page.html 2>/dev/null || true
            exit 1
          fi
          grep -q 'name="username"' /tmp/auth-page.html
          grep -q 'name="password"' /tmp/auth-page.html
          grep -q 'name="csrfmiddlewaretoken"' /tmp/auth-page.html

          ready_status=""
          for attempt in $(seq 1 12); do
            ready_status="$(curl --connect-timeout 4 --max-time 10 -sS -o /tmp/auth-ready.json -w '%{http_code}' "$base/__edge/auth-ready" || true)"
            if [ "$ready_status" = "200" ] || [ "$ready_status" = "202" ]; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::Auth readiness endpoint returned HTTP $ready_status after deployment propagation retries"
              cat /tmp/auth-ready.json 2>/dev/null || true
              exit 1
            fi
            sleep 3
          done

          echo "Site edge, auth-first login UI, and readiness checks are healthy."


      - name: Virtual mating concurrency probe
        if: contains(github.event.head_commit.message, '[vm-load]')
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import statistics
          import time
          import urllib.parse
          import urllib.request

          base = "https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev"
          males = [
              "0d1dcc5b-d146-48a9-a9fb-97e46692f358",
              "67fb5587-6abd-454e-8aaf-acd2dba66b66",
              "e896e1c8-1df5-4153-8135-bacde5d9efbe",
              "844b3ef1-b541-4bde-b298-e27bac4be2b8",
              "1beedd00-efac-432f-ab78-4497a3ab8fd7",
          ]
          females = [
              "38622420-f217-49ef-bb52-1687f5282df4",
              "d94dc164-cfd6-44b7-a7e6-9d2a19269337",
              "245dffc3-885c-4225-bb89-ca89c888f1a4",
              "bfdecd1c-db09-4b1c-8d0a-004a225157d1",
              "6c4e2e2f-ab50-4ea1-a4ed-0800347fbba1",
          ]

          def request(url, marker=None, timeout=12):
              started = time.perf_counter()
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "cca-vm-load-probe/2.0"},
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  body = response.read()
                  status = response.status
              elapsed = time.perf_counter() - started
              if status != 200:
                  raise RuntimeError(f"HTTP {status} for {url}")
              if marker and marker not in body:
                  raise RuntimeError(f"Expected marker missing for {url}")
              if b'class="notice error"' in body:
                  raise RuntimeError(f"Virtual mating returned an application error for {url}")
              return elapsed

          def metrics(label, timings):
              ordered = sorted(timings)
              p50 = statistics.median(ordered)
              p95 = ordered[max(0, int((len(ordered) - 1) * 0.95))]
              maximum = max(ordered)
              print(json.dumps({
                  "label": label,
                  "requests": len(ordered),
                  "concurrency": 8,
                  "p50_seconds": round(p50, 3),
                  "p95_seconds": round(p95, 3),
                  "max_seconds": round(maximum, 3),
              }))
              return p50, p95, maximum

          # Cold capacity: 16 distinct pairings that are not pre-warmed.
          cold_pairs = [
              (males[0], females[1]), (males[0], females[2]),
              (males[0], females[3]), (males[0], females[4]),
              (males[1], females[0]), (males[1], females[2]),
              (males[1], females[3]), (males[1], females[4]),
              (males[2], females[0]), (males[2], females[1]),
              (males[2], females[3]), (males[2], females[4]),
              (males[3], females[0]), (males[3], females[1]),
              (males[4], females[2]), (males[4], females[4]),
          ]
          cold_urls = []
          for index, (sire, dam) in enumerate(cold_pairs):
              query = urllib.parse.urlencode({
                  "sire": sire,
                  "dam": dam,
                  "probe": f"cold-{index}-{time.time_ns()}",
              })
              cold_urls.append(f"{base}/pedigrees/virtual-mating/?{query}")

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              cold_timings = list(
                  pool.map(lambda url: request(url, b"Projected COI"), cold_urls)
              )
          _, cold_p95, cold_max = metrics("virtual_mating_cold_distinct", cold_timings)
          if cold_p95 > 3.5 or cold_max > 6.0:
              raise SystemExit(
                  f"Cold virtual mating latency too high: p95={cold_p95:.3f}s max={cold_max:.3f}s"
              )

          # Warm/repeated capacity: same popular pairing under concurrent requests.
          warm_pair = (males[0], females[0])
          warm_query = urllib.parse.urlencode({
              "sire": warm_pair[0],
              "dam": warm_pair[1],
              "probe": "warm-prime",
          })
          request(f"{base}/pedigrees/virtual-mating/?{warm_query}", b"Projected COI")

          warm_urls = []
          for index in range(24):
              query = urllib.parse.urlencode({
                  "sire": warm_pair[0],
                  "dam": warm_pair[1],
                  "probe": f"warm-{index}-{time.time_ns()}",
              })
              warm_urls.append(f"{base}/pedigrees/virtual-mating/?{query}")

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              warm_timings = list(
                  pool.map(lambda url: request(url, b"Projected COI"), warm_urls)
              )
          _, warm_p95, warm_max = metrics("virtual_mating_repeated_pair", warm_timings)
          if warm_p95 > 3.0 or warm_max > 5.0:
              raise SystemExit(
                  f"Repeated virtual mating latency too high: p95={warm_p95:.3f}s max={warm_max:.3f}s"
              )

          # Autocomplete capacity: real 3-character mating searches, no edge-cache reuse.
          terms = [("gar", "male"), ("kar", "female"), ("bra", "male"), ("ant", "female")]
          suggestion_urls = []
          for index in range(24):
              term, sex = terms[index % len(terms)]
              query = urllib.parse.urlencode({
                  "q": term,
                  "sex": sex,
                  "probe": f"suggest-{index}-{time.time_ns()}",
              })
              suggestion_urls.append(f"{base}/dogs/suggestions/?{query}")

          def suggestion_request(url):
              started = time.perf_counter()
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "cca-vm-load-probe/2.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=8) as response:
                  payload = json.loads(response.read())
                  status = response.status
              elapsed = time.perf_counter() - started
              if status != 200 or not payload.get("results"):
                  raise RuntimeError(f"Invalid suggestion response for {url}")
              return elapsed

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              suggestion_timings = list(pool.map(suggestion_request, suggestion_urls))
          _, suggestion_p95, suggestion_max = metrics(
              "virtual_mating_suggestions",
              suggestion_timings,
          )
          if suggestion_p95 > 1.8 or suggestion_max > 3.0:
              raise SystemExit(
                  f"Suggestion latency too high: p95={suggestion_p95:.3f}s max={suggestion_max:.3f}s"
              )
          PY

      - name: Clean temporary files
        if: always()
        run: rm -f /tmp/edge-health.json /tmp/edge-page.html /tmp/auth-headers.txt /tmp/auth-page.html /tmp/auth-ready.json /tmp/live-logo.webp /tmp/kennels-page.html /tmp/virtual-mating.html /tmp/male-suggestions.json /tmp/female-suggestions.json
