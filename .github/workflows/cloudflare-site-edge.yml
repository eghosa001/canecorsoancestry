name: Cloudflare site edge

on:
  pull_request:
    paths:
      - "src/site-edge.js"
      - "wrangler.site.toml"
      - "scripts/test_site_edge_cache.mjs"
      - ".github/workflows/cloudflare-site-edge.yml"
  push:
    branches: [main]
    paths:
      - "src/site-edge.js"
      - "wrangler.site.toml"
      - "scripts/test_site_edge_cache.mjs"
      - ".github/workflows/cloudflare-site-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-site-edge
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Worker JavaScript
        run: node --check src/site-edge.js

      - name: Test public edge cache policy
        run: node scripts/test_site_edge_cache.mjs

      - name: Warm Northflank origin before cutover
        shell: bash
        run: |
          origin="https://web--canecorsoancestry--4w9gl8jxj4yr.code.run"
          status="$(curl --connect-timeout 5 --max-time 12 -sS -H 'X-CCA-Edge: 1' -o /tmp/northflank-origin.html -w '%{http_code}' "$origin/healthz/" || true)"
          echo "/healthz/ -> HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Origin is cold or still waking; deploying the edge keep-warm anyway."
          fi

      - name: Validate Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.site.toml

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 19a03bec57c0277e01e1e70e241576af

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Deploy site edge
        run: npx --yes wrangler@4 deploy --config wrangler.site.toml

      - name: Diagnose custom-domain DNS
        shell: bash
        run: |
          set +e
          zone_json="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=canecorsoancestry.com")"
          zone_id="$(printf '%s' "$zone_json" | jq -r '.result[0].id // empty' 2>/dev/null)"
          zone_status="$(printf '%s' "$zone_json" | jq -r '.result[0].status // empty' 2>/dev/null)"
          nameservers="$(printf '%s' "$zone_json" | jq -r '.result[0].name_servers // [] | join(",")' 2>/dev/null)"
          if [ -z "$zone_id" ]; then
            echo "::warning::Cloudflare token cannot see an active zone for canecorsoancestry.com. Custom-domain DNS cannot resolve until the domain is attached to this Cloudflare account and its authoritative nameservers are active."
          else
            echo "Cloudflare zone status: $zone_status"
            echo "Cloudflare nameservers: $nameservers"
            dns_json="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=canecorsoancestry.com")"
            dns_count="$(printf '%s' "$dns_json" | jq -r '.result | length' 2>/dev/null)"
            echo "Apex DNS record count visible to token: ${dns_count:-unknown}"
          fi
          exit 0

      - name: Verify edge and fast warm-up response
        shell: bash
        run: |
          base="https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev"

          for attempt in $(seq 1 12); do
            status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/edge-health.json -w '%{http_code}' "$base/__edge/health" || true)"
            if [ "$status" = "200" ] && grep -q '"service":"site-edge"' /tmp/edge-health.json; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              cat /tmp/edge-health.json 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          page_status="$(curl --connect-timeout 4 --max-time 8 -sS -H 'Accept: text/html' -o /tmp/edge-page.html -w '%{http_code}' "$base/" || true)"
          if [ "$page_status" != "200" ]; then
            echo "::error::Site edge did not return a usable page quickly; HTTP $page_status"
            cat /tmp/edge-page.html 2>/dev/null || true
            exit 1
          fi

          auth_status="$(curl --connect-timeout 4 --max-time 8 -sS -D /tmp/auth-headers.txt -H 'Accept: text/html' -o /tmp/auth-page.html -w '%{http_code}' "$base/accounts/login/" || true)"
          if [ "$auth_status" != "200" ]; then
            echo "::error::Auth-first edge did not return a login UI quickly; HTTP $auth_status"
            cat /tmp/auth-page.html 2>/dev/null || true
            exit 1
          fi
          grep -q 'name="username"' /tmp/auth-page.html
          grep -q 'name="password"' /tmp/auth-page.html
          grep -q 'name="csrfmiddlewaretoken"' /tmp/auth-page.html

          ready_status=""
          for attempt in $(seq 1 12); do
            ready_status="$(curl --connect-timeout 4 --max-time 10 -sS -o /tmp/auth-ready.json -w '%{http_code}' "$base/__edge/auth-ready" || true)"
            if [ "$ready_status" = "200" ] || [ "$ready_status" = "202" ]; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::Auth readiness endpoint returned HTTP $ready_status after deployment propagation retries"
              cat /tmp/auth-ready.json 2>/dev/null || true
              exit 1
            fi
            sleep 3
          done

          echo "Site edge, auth-first login UI, and readiness checks are healthy."

          custom="https://canecorsoancestry.com"
          custom_status="$(curl --connect-timeout 6 --max-time 12 -sS -D /tmp/custom-headers.txt -H 'Accept: text/html' -o /tmp/custom-page.html -w '%{http_code}' "$custom/" || true)"
          if [ "$custom_status" = "200" ] && grep -qi 'Cane Corso Ancestry' /tmp/custom-page.html; then
            echo "Custom domain is resolving and serving the live site."
          else
            echo "::warning::Custom domain is not active yet (HTTP ${custom_status:-000}). The workers.dev production endpoint is healthy; activate the Cloudflare zone/nameserver delegation before treating the custom domain as required."
          fi

      - name: Clean temporary files
        if: always()
        run: rm -f /tmp/edge-health.json /tmp/edge-page.html /tmp/auth-headers.txt /tmp/auth-page.html /tmp/auth-ready.json /tmp/custom-headers.txt /tmp/custom-page.html
