name: Real public dog photo paint timing

on:
  pull_request:
    paths:
      - "src/r2-media.js"
      - "scripts/benchmark_public_dog_photo.py"
      - ".github/workflows/public-dog-photo-performance.yml"
  push:
    branches: [main]
    paths:
      - "src/r2-media.js"
      - "scripts/benchmark_public_dog_photo.py"
      - ".github/workflows/public-dog-photo-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-profile-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install headless Chromium (CI runner only)
        run: |
          python -m pip install 'playwright==1.64.1'
          python -m playwright install --with-deps chromium
      - name: Measure browser HTML and first dog photo visible time
        run: python scripts/benchmark_public_dog_photo.py
