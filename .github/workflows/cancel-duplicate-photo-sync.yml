name: Cancel duplicate CaneCorso photo sync

on:
  push:
    paths:
      - ".github/workflows/cancel-duplicate-photo-sync.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate sync run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/36855338058/cancel"
