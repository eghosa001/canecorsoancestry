name: Seed production Bellissimo data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_DATABASE_URL DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - run: pip install -r requirements.txt

      - name: Discover reachable Supabase session pooler
        shell: bash
        run: |
          target_url="$(python scripts/discover_supabase_session_pooler.py)"
          echo "::add-mask::$target_url"
          echo "DATABASE_URL=$target_url" >> "$GITHUB_ENV"


      - name: Verify Django migrations are current
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          DJANGO_ALLOWED_HOSTS: canecorsoancestry-site-edge.aighewieghosa111.workers.dev,.code.run,127.0.0.1,localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev,https://*.code.run
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: python manage.py migrate --check

      - name: Validate Bellissimo source file
        run: python manage.py validate_pedigree_dataset data/seeds/bellissimo-dogs.json

      - name: Validate Bellissimo import
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          DJANGO_ALLOWED_HOSTS: canecorsoancestry-site-edge.aighewieghosa111.workers.dev,.code.run,127.0.0.1,localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev,https://*.code.run
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: python manage.py import_bellissimo --dry-run

      - name: Import canonical Bellissimo records
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          DJANGO_ALLOWED_HOSTS: canecorsoancestry-site-edge.aighewieghosa111.workers.dev,.code.run,127.0.0.1,localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev,https://*.code.run
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: python manage.py import_bellissimo

      - name: Validate Bellissimo puppy import
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          DJANGO_ALLOWED_HOSTS: canecorsoancestry-site-edge.aighewieghosa111.workers.dev,.code.run,127.0.0.1,localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev,https://*.code.run
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: python manage.py import_bellissimo_puppies --dry-run

      - name: Import verified Bellissimo puppy records
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          DJANGO_ALLOWED_HOSTS: canecorsoancestry-site-edge.aighewieghosa111.workers.dev,.code.run,127.0.0.1,localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev,https://*.code.run
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: python manage.py import_bellissimo_puppies

      - name: Verify imported records
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          DJANGO_ALLOWED_HOSTS: canecorsoancestry-site-edge.aighewieghosa111.workers.dev,.code.run,127.0.0.1,localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev,https://*.code.run
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        shell: bash
        run: |
          python manage.py shell -c "
          from registry.models import Dog, DogExternalKey
          external = DogExternalKey.objects.filter(namespace='bellissimo-geni')
          puppies = DogExternalKey.objects.filter(namespace='bellissimo-geni-puppies')
          public = Dog.objects.filter(external_keys__namespace='bellissimo-geni', is_public=True).distinct()
          private = Dog.objects.filter(external_keys__namespace='bellissimo-geni', is_public=False).distinct()
          puppy_public = Dog.objects.filter(external_keys__namespace='bellissimo-geni-puppies', is_public=True).distinct()
          assert external.count() == 117, f'Expected 117 Bellissimo external keys, got {external.count()}'
          assert public.count() == 101, f'Expected 101 public dogs, got {public.count()}'
          assert private.count() == 16, f'Expected 16 draft dogs, got {private.count()}'
          assert puppies.count() == 2, f'Expected 2 verified puppy external keys, got {puppies.count()}'
          assert puppy_public.count() == 2, f'Expected 2 public verified puppies, got {puppy_public.count()}'
          print(f'Verified: 117 canonical seed keys + {puppies.count()} puppy keys; {public.count() + puppy_public.count()} public source-linked records; {private.count()} draft')
          "

      - name: Audit production pedigree integrity
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          DJANGO_ALLOWED_HOSTS: canecorsoancestry-site-edge.aighewieghosa111.workers.dev,.code.run,127.0.0.1,localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev,https://*.code.run
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: python manage.py audit_pedigree_data --fail-on-critical
