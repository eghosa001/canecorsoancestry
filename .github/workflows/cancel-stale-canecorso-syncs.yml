name: Cancel stale CaneCorso syncs

on:
  push:
    paths:
      - ".github/workflows/cancel-stale-canecorso-syncs.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale sync runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 36855269541 36863146505; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
