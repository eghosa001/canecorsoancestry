name: Production data health

on:
  workflow_run:
    workflows: ["Cloudflare site edge", "Oracle Django production release (CI-gated)"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-data-health.yml"
  schedule:
    - cron: "43 5 * * 4"

permissions:
  contents: read

concurrency:
  group: production-data-health
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 15
    env:
      PUBLIC_SITE: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm audited database is the Oracle-local production primary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "eghosa001/canecorsoancestry"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(uname -m)" = aarch64
          test "$(sudo -n cat /etc/cca/oracle-db-mode)" = local
          sudo -n systemctl is-active --quiet cca-oracle-staging.service
          sudo -n systemctl is-active --quiet cca-pg-shadow.service
          curl --fail --silent --show-error --connect-timeout 3 --max-time 12             http://127.0.0.1:18080/healthz/ > /tmp/cca-live-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path("/tmp/cca-live-health.json").read_text())
          assert health["status"] == "ok", "Oracle application is unhealthy"
          assert health["database_backend"] == "oracle-local", "Refusing to audit historical database"
          print("PASS: audited backend is Oracle-local PostgreSQL")
          PY
      - name: Check running production migrations (no schema changes)
        run: sudo -n podman exec cca-oracle-staging python manage.py migrate --check
      - name: Verify production size in the live primary
        run: |
          sudo -n podman exec cca-oracle-staging python manage.py shell -c "
          from registry.models import Dog
          count = Dog.objects.count()
          assert count >= 33000, count
          print(f'Oracle-local production dogs: {count}')
          "
      - name: Audit live pedigree integrity
        run: sudo -n podman exec cca-oracle-staging python manage.py audit_pedigree_data --fail-on-critical
      - name: Audit live owner production invariants
        run: sudo -n podman exec cca-oracle-staging python manage.py audit_production_invariants --fail-on-critical
      - name: Check COI computation using published live pedigree links
        run: |
          sudo -n podman exec cca-oracle-staging python manage.py shell -c "
          from registry.models import Dog
          from pedigrees.services import inbreeding_coefficient
          dogs = list(Dog.objects.filter(is_public=True, sire__is_public=True, dam__is_public=True).only('pk', 'sire_id', 'dam_id').order_by('pk')[:3])
          assert dogs, 'No public records with published sire and dam'
          for dog in dogs:
              value = inbreeding_coefficient(dog, public_only=True)
              assert 0 <= value <= 1, 'COI calculation returned an invalid value'
          print(f'PASS: COI computed on {len(dogs)} actual published pedigrees')
          # Diagnose representative live published dogs without modifying ancestry.
          from django.db.models import Q
          sample = list(
              Dog.objects.filter(is_public=True, sire__is_public=True, dam__is_public=True)
              .only('id', 'sire_id', 'dam_id').order_by('-date_of_birth', 'pk')[:24]
          )
          positives = sum(inbreeding_coefficient(dog, public_only=True) > 0 for dog in sample)
          print(f'COI sample: {positives} positive, {len(sample)-positives} zero among {len(sample)} known-parent profiles')
          # The reported mobile profile shows a male born 25 May 2021,
          # bloodline/kennel Custodi Nos. Report matching *public* record
          # links so a genuine zero can be distinguished from missing ancestry.
          matched = list(
              Dog.objects.filter(is_public=True, date_of_birth='2021-05-25', sex='male')
              .filter(Q(bloodline__icontains='Custodi Nos') | Q(kennel__name__icontains='Custodi Nos'))
              .select_related('sire', 'dam').order_by('name')[:20]
          )
          print(f'Custodi Nos 25-May-2021 public candidates: {len(matched)}')
          for dog in matched:
              sire_ok = bool(dog.sire and dog.sire.is_public)
              dam_ok = bool(dog.dam and dog.dam.is_public)
              percent = round(inbreeding_coefficient(dog, public_only=True) * 100, 6) if sire_ok and dam_ok else None
              print(f'COI record: name={dog.name!r} slug={dog.slug} sire_public={sire_ok} dam_public={dam_ok} coi_percent={percent}')
              if sire_ok and dam_ok:
                  from pedigrees.services import _pedigree_links
                  links = _pedigree_links(dog, public_only=True)
                  def connected(root):
                      found = set()
                      stack = [root]
                      while stack:
                          current = stack.pop()
                          if current not in links or current in found:
                              continue
                          found.add(current)
                          stack.extend(p for p in links[current] if p in links and p not in found)
                      return found
                  sire_links = connected(dog.sire_id)
                  dam_links = connected(dog.dam_id)
                  shared = sire_links & dam_links
                  print(f'COI trace: sire={dog.sire.name!r} dam={dog.dam.name!r} sire_nodes={len(sire_links)} dam_nodes={len(dam_links)} shared_canonical_ids={len(shared)}')
                  nodes = list(Dog.objects.filter(pk__in=sire_links | dam_links).values('id', 'name', 'normalized_name'))
                  sire_names = {p['normalized_name'] for p in nodes if p['id'] in sire_links and p['normalized_name']}
                  dam_names = {p['normalized_name'] for p in nodes if p['id'] in dam_links and p['normalized_name']}
                  same_names = sorted(sire_names & dam_names)
                  print(f'COI trace possible separate-ID name matches: {same_names[:12]} (total={len(same_names)})')
                  for parent in (dog.sire, dog.dam):
                      known = sum(bool(p) for p in links.get(parent.pk, ()))
                      print(f'COI parent status: {parent.name!r} known_parent_links={known}')
                  # Inspect every incomplete paternal branch for an existing,
                  # source-ID-backed canonical parent; no automatic relinking.
                  from registry.models import DogSource, DogExternalKey
                  from registry.management.commands.import_canecorso_archive import DEFAULT_NAMESPACE
                  paternal_nodes = Dog.objects.filter(pk__in=sire_links).order_by('name')
                  for node in paternal_nodes:
                      if node.sire_id and node.dam_id:
                          continue
                      provenance = [
                          payload for payload in DogSource.objects.filter(dog=node)
                          .values_list('raw_payload', flat=True) if payload
                      ]
                      for field, key in (('sire', 'father_id'), ('dam', 'mother_id')):
                          if getattr(node, field + '_id'):
                              continue
                          source_parent = next((str(p.get(key) or '') for p in provenance if p.get(key)), '')
                          candidate = DogExternalKey.objects.filter(
                              namespace=DEFAULT_NAMESPACE, key=source_parent
                          ).select_related('dog').first() if source_parent else None
                          candidate_slug = candidate.dog.slug if candidate else '-'
                          print(f'COI paternal gap: child={node.name!r} missing={field} source_parent_id={source_parent or "-"} existing_canonical={candidate_slug}')
          "
      - name: Verify one production dog image end to end
        shell: bash
        run: |
          set -euo pipefail
          media_path="$(sudo -n podman exec cca-oracle-staging python manage.py shell -c "
          from registry.models import DogImage
          value = DogImage.objects.filter(dog__is_public=True).order_by('pk').values_list('image', flat=True).first()
          assert value, 'No public DogImage rows found'
          print('/media/' + str(value).lstrip('/'))
          " | tail -n 1)"
          echo "Testing $media_path"
          first_status="$(curl --connect-timeout 10 --max-time 30 -sS -D /tmp/media-first.headers -o /dev/null -w '%{http_code}' "$PUBLIC_SITE$media_path" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/media-first.headers)"
          echo "Public media entry -> HTTP $first_status"
          echo "Redirect target host: $(printf '%s' "$location" | sed -E 's#https?://([^/]+).*#\\1#')"
          test "$first_status" = "302"
          test -n "$location"
          final_status="$(curl -L --connect-timeout 10 --max-time 30 -sS -D /tmp/media-final.headers -o /tmp/media-probe.bin -w '%{http_code}' "$PUBLIC_SITE$media_path" || true)"
          echo "Public media final -> HTTP $final_status"
          test "$final_status" = "200"
          test -s /tmp/media-probe.bin
          grep -qi '^content-type: image/' /tmp/media-final.headers
      - name: Verify critical static assets
        shell: bash
        run: |
          set -euo pipefail
          browser_ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36'
          for asset in             "/static/core/cane-corso-logo.webp"             "/static/core/cane-corso-header-mark.webp"             "/static/core/site.css"             "/static/core/dog-photo-safari.css"             "/static/core/site.js"; do
            result="$(curl -L --connect-timeout 10 --max-time 30 -sS -A "$browser_ua" -o /tmp/static-probe -w '%{http_code}|%{content_type}|%{size_download}' "$PUBLIC_SITE$asset" || true)"
            echo "$asset -> $result"
            status="${result%%|*}"
            rest="${result#*|}"
            content_type="${rest%%|*}"
            size="${rest##*|}"
            test "$status" = "200"
            test "$size" -gt 100
            case "$asset" in
              *.webp) [[ "$content_type" == image/* ]] ;;
              *.css) [[ "$content_type" == text/css* ]] ;;
              *.js) [[ "$content_type" == *javascript* ]] ;;
            esac
          done
      - name: Verify rendered dog images end to end
        shell: bash
        run: |
          set -euo pipefail
          browser_ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36'
          checked=0
          failures=0
          for page in "/" "/dogs/"; do
            file="/tmp/page-$(printf '%s' "$page" | tr '/?' '__').html"
            status="$(curl --connect-timeout 10 --max-time 30 -sS -A "$browser_ua" -o "$file" -w '%{http_code}' "$PUBLIC_SITE$page" || true)"
            echo "$page -> HTTP $status"
            test "$status" = "200"
            mapfile -t media < <(grep -o '/media/[^" ]*' "$file" | sort -u || true)
            echo "$page managed image references: ${#media[@]}"
            for src in "${media[@]}"; do
              [ -n "$src" ] || continue
              result="$(curl -L --connect-timeout 10 --max-time 30 -sS -A "$browser_ua" -o /dev/null -w '%{http_code}|%{content_type}' "$PUBLIC_SITE$src" || true)"
              status="${result%%|*}"
              content_type="${result#*|}"
              echo "$src -> HTTP $status $content_type"
              checked=$((checked + 1))
              if [ "$status" != "200" ] || [[ "$content_type" != image/* ]]; then
                failures=$((failures + 1))
              fi
            done
          done
          echo "Verified rendered images: $checked; failures: $failures"
          test "$checked" -ge 1
          test "$failures" -eq 0
      - name: Verify public production routes
        shell: bash
        run: |
          for path in "/healthz/" "/dogs/?q=Branco+Custodi+Nos" "/statistics/"; do
            status="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/cca.html -w '%{http_code}' "$PUBLIC_SITE$path" || true)"
            echo "$path -> HTTP $status"
            test "$status" = "200"
          done
      - name: Verify live account recovery is enabled
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/password-reset.html -w '%{http_code}' "$PUBLIC_SITE/accounts/password_reset/" || true)"
          echo "/accounts/password_reset/ -> HTTP $status"
          test "$status" = "200"
          if grep -qi "temporarily unavailable" /tmp/password-reset.html; then
            echo "::error::Production password recovery is disabled. Configure EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD and DEFAULT_FROM_EMAIL."
            exit 1
          fi
          grep -qi "Send reset link" /tmp/password-reset.html
