name: Production data health

on:
  workflow_run:
    workflows: ["Cloudflare site edge", "Oracle Django production release (CI-gated)"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-data-health.yml"
  schedule:
    - cron: "43 5 * * 4"

permissions:
  contents: read

concurrency:
  group: production-data-health
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 15
    env:
      PUBLIC_SITE: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One-time read-only Pet Palace dog and kennel association audit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "eghosa001/canecorsoancestry"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(sudo -n cat /etc/cca/oracle-db-mode)" = local
          sudo -n podman exec cca-oracle-staging python manage.py shell -c '
          import json
          from django.db.models import Q
          from registry.models import Dog, Kennel
          matches = Kennel.objects.filter(
              Q(name__icontains="pet palace") |
              Q(name__icontains="petpalace") |
              Q(slug__icontains="pet-palace")
          ).order_by("name")
          rows = []
          for kennel in matches[:10]:
              linked = Dog.objects.filter(kennel_id=kennel.pk)
              public = linked.filter(is_public=True, hidden_by_moderation=False)
              rows.append({
                  "name": kennel.name,
                  "slug": kennel.slug,
                  "published_profile": bool(kennel.is_public),
                  "dogs_suppressed": bool(kennel.hide_dogs),
                  "linked_dogs": linked.count(),
                  "approved_not_individually_hidden": public.count(),
                  "photo_eligible_public_names": list(public.values_list("name", flat=True)[:8]),
                  "member_count": kennel.memberships.count(),
                  "verified_kennel": bool(kennel.verified_at),
              })
          print("PET_PALACE_LINK_AUDIT="+json.dumps({
              "matches": matches.count(),
              "kennels": rows,
              "truncated": matches.count()>10,
          }, sort_keys=True))
          '
      - name: Diagnose real public moderation-route HTTP status and maintenance marker
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "eghosa001/canecorsoancestry"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(sudo -n cat /etc/cca/oracle-db-mode)" = local
          echo "Checking availability of the user-reported HTTP 503 paths (unauthenticated)."
          echo "systemd origin=$(systemctl is-active cca-oracle-staging.service || true)"
          echo "systemd postgres=$(systemctl is-active cca-pg-shadow.service || true)"
          echo "systemd cloudflare-vpc=$(systemctl is-active cca-cloudflared-vpc.service || true)"
          if sudo -n test -e /var/lib/cca/control/maintenance.flag; then
            echo "::warning::Production maintenance.flag EXISTS; non-health requests return HTTP 503."
            sudo -n stat -c 'maintenance_flag_last_changed=%y' /var/lib/cca/control/maintenance.flag
          else
            echo "Production maintenance.flag: absent"
          fi
          failures=0
          for path in /healthz/ /accounts/login/ /member/moderation/ /member/moderation/kennels/; do
            status="$(curl --silent --show-error --connect-timeout 6 --max-time 25 --path-as-is \
              -o /tmp/cca-mod-route.out -D /tmp/cca-mod-route.headers \
              -w '%{http_code}' "$PUBLIC_SITE$path" || true)"
            echo "PUBLIC $path: HTTP ${status:-unavailable}"
            if [ "$status" = "503" ]; then
              grep -iE '^(retry-after|server|cf-ray|content-type):' /tmp/cca-mod-route.headers || true
              echo "::error::Public HTTP 503 for $path; do not claim moderator site is healthy."
              failures=$((failures+1))
            elif [ "$path" = /healthz/ ] || [ "$path" = /accounts/login/ ]; then
              [ "$status" = "200" ] || failures=$((failures+1))
            else
              # Authentication-required moderator pages normally redirect to login.
              [[ "$status" == 302 || "$status" == 301 || "$status" == 200 ]] || failures=$((failures+1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures moderator-route health failures detected."
            exit 1
          fi
          echo "PASS: Public moderator routes do not return 503."
      - name: Confirm audited database is the Oracle-local production primary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "eghosa001/canecorsoancestry"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(uname -m)" = aarch64
          test "$(sudo -n cat /etc/cca/oracle-db-mode)" = local
          sudo -n systemctl is-active --quiet cca-oracle-staging.service
          sudo -n systemctl is-active --quiet cca-pg-shadow.service
          curl --fail --silent --show-error --connect-timeout 3 --max-time 12             http://127.0.0.1:18080/healthz/ > /tmp/cca-live-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path("/tmp/cca-live-health.json").read_text())
          assert health["status"] == "ok", "Oracle application is unhealthy"
          assert health["database_backend"] == "oracle-local", "Refusing to audit historical database"
          print("PASS: audited backend is Oracle-local PostgreSQL")
          PY
      - name: Check running production migrations (no schema changes)
        run: sudo -n podman exec cca-oracle-staging python manage.py migrate --check
      - name: Verify production size in the live primary
        run: |
          sudo -n podman exec cca-oracle-staging python manage.py shell -c "
          from registry.models import Dog
          count = Dog.objects.count()
          assert count >= 33000, count
          print(f'Oracle-local production dogs: {count}')
          "
      - name: Audit live pedigree integrity
        run: sudo -n podman exec cca-oracle-staging python manage.py audit_pedigree_data --fail-on-critical
      - name: Audit live owner production invariants
        run: sudo -n podman exec cca-oracle-staging python manage.py audit_production_invariants --fail-on-critical
      - name: Verify previously reconciled ancestors (read-only)
        run: sudo -n podman exec cca-oracle-staging python manage.py reconcile_known_ancestors
      - name: Detect registration-backed duplicate ancestors for staff review
        # A direct main push can trigger before the updated container is staged.
        # Audit the new command only after its Oracle release, or on scheduled/manual runs.
        if: github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.name == 'Oracle Django production release (CI-gated)')
        run: sudo -n podman exec cca-oracle-staging python manage.py audit_coi_duplicate_candidates --limit 15
      - name: Preview ten registration-verified candidate reconciliations (read-only)
        # Only after the new command has been deployed to the Oracle container.
        if: github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.name == 'Oracle Django production release (CI-gated)')
        run: sudo -n podman exec cca-oracle-staging python manage.py reconcile_verified_coi_candidates
      - name: Check published live COI
        run: |
          sudo -n podman exec cca-oracle-staging python manage.py shell -c "
          from registry.models import Dog
          from pedigrees.services import inbreeding_coefficient
          dogs = list(Dog.objects.filter(is_public=True, sire__is_public=True, dam__is_public=True).only('pk', 'sire_id', 'dam_id').order_by('pk')[:6])
          assert dogs, 'No public records with published sire and dam'
          for dog in dogs:
              value = inbreeding_coefficient(dog, public_only=True)
              assert 0 <= value <= 1, 'COI computation returned an invalid value'
          target = Dog.objects.filter(slug='explosion-custodi-nos').first()
          if target:
              assert target.sire_id and target.dam_id
              print('Explosion Custodi Nos COI:', round(inbreeding_coefficient(target, public_only=True) * 100, 6))
          print(f'PASS: Wright COI computed on {len(dogs)} live pedigrees')
          "
      - name: Confirm COI appears on the actual public dog and pedigree pages
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sudo -n podman exec cca-oracle-staging python manage.py shell -c "
          from registry.models import Dog
          from pedigrees.services import inbreeding_coefficient
          dog = Dog.objects.get(slug='explosion-custodi-nos')
          print(f'{inbreeding_coefficient(dog, public_only=True)*100:.2f}%')
          " | tail -n 1)"
          echo "Expected published COI: $expected"
          test "$expected" != "0.00%"
          for path in "/dogs/explosion-custodi-nos/" "/pedigrees/explosion-custodi-nos/?generations=4"; do
            status="$(curl --connect-timeout 5 --max-time 25 -sS -H 'Accept: text/html' -o /tmp/cca-coi-render.html -w '%{http_code}' "$PUBLIC_SITE$path" || true)"
            test "$status" = 200 || { echo "::error::COI public route $path -> HTTP $status"; exit 1; }
            python3 - /tmp/cca-coi-render.html "$expected" <<'PY'
          import re
          import sys
          from pathlib import Path
          html = Path(sys.argv[1]).read_text(encoding='utf-8')
          expected = sys.argv[2]
          assert re.search(r'<strong[^>]*>\s*' + re.escape(expected) + r'\s*</strong>', html), (
              f'Public HTML did not display the current published COI: {expected}'
          )
          PY
            echo "PASS: $path renders $expected"
          done
      - name: Verify one production dog image end to end
        shell: bash
        run: |
          set -euo pipefail
          media_path="$(sudo -n podman exec cca-oracle-staging python manage.py shell -c "
          from registry.models import DogImage
          value = DogImage.objects.filter(dog__is_public=True).order_by('pk').values_list('image', flat=True).first()
          assert value, 'No public DogImage rows found'
          print('/media/' + str(value).lstrip('/'))
          " | tail -n 1)"
          echo "Testing $media_path"
          first_status="$(curl --connect-timeout 10 --max-time 30 -sS -D /tmp/media-first.headers -o /dev/null -w '%{http_code}' "$PUBLIC_SITE$media_path" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/media-first.headers)"
          echo "Public media entry -> HTTP $first_status"
          echo "Redirect target host: $(printf '%s' "$location" | sed -E 's#https?://([^/]+).*#\\1#')"
          test "$first_status" = "302"
          test -n "$location"
          final_status="$(curl -L --connect-timeout 10 --max-time 30 -sS -D /tmp/media-final.headers -o /tmp/media-probe.bin -w '%{http_code}' "$PUBLIC_SITE$media_path" || true)"
          echo "Public media final -> HTTP $final_status"
          test "$final_status" = "200"
          test -s /tmp/media-probe.bin
          grep -qi '^content-type: image/' /tmp/media-final.headers
      - name: Verify critical static assets
        shell: bash
        run: |
          set -euo pipefail
          browser_ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36'
          for asset in             "/static/core/cane-corso-logo.webp"             "/static/core/cane-corso-header-mark.webp"             "/static/core/site.css"             "/static/core/dog-photo-safari.css"             "/static/core/site.js"; do
            result="$(curl -L --connect-timeout 10 --max-time 30 -sS -A "$browser_ua" -o /tmp/static-probe -w '%{http_code}|%{content_type}|%{size_download}' "$PUBLIC_SITE$asset" || true)"
            echo "$asset -> $result"
            status="${result%%|*}"
            rest="${result#*|}"
            content_type="${rest%%|*}"
            size="${rest##*|}"
            test "$status" = "200"
            test "$size" -gt 100
            case "$asset" in
              *.webp) [[ "$content_type" == image/* ]] ;;
              *.css) [[ "$content_type" == text/css* ]] ;;
              *.js) [[ "$content_type" == *javascript* ]] ;;
            esac
          done
      - name: Verify rendered dog images end to end
        shell: bash
        run: |
          set -euo pipefail
          browser_ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36'
          checked=0
          failures=0
          for page in "/" "/dogs/"; do
            file="/tmp/page-$(printf '%s' "$page" | tr '/?' '__').html"
            status="$(curl --connect-timeout 10 --max-time 30 -sS -A "$browser_ua" -o "$file" -w '%{http_code}' "$PUBLIC_SITE$page" || true)"
            echo "$page -> HTTP $status"
            test "$status" = "200"
            mapfile -t media < <(grep -o '/media/[^" ]*' "$file" | sort -u || true)
            echo "$page managed image references: ${#media[@]}"
            for src in "${media[@]}"; do
              [ -n "$src" ] || continue
              result="$(curl -L --connect-timeout 10 --max-time 30 -sS -A "$browser_ua" -o /dev/null -w '%{http_code}|%{content_type}' "$PUBLIC_SITE$src" || true)"
              status="${result%%|*}"
              content_type="${result#*|}"
              echo "$src -> HTTP $status $content_type"
              checked=$((checked + 1))
              if [ "$status" != "200" ] || [[ "$content_type" != image/* ]]; then
                failures=$((failures + 1))
              fi
            done
          done
          echo "Verified rendered images: $checked; failures: $failures"
          test "$checked" -ge 1
          test "$failures" -eq 0
      - name: Verify public production routes
        shell: bash
        run: |
          for path in "/healthz/" "/dogs/?q=Branco+Custodi+Nos" "/statistics/"; do
            status="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/cca.html -w '%{http_code}' "$PUBLIC_SITE$path" || true)"
            echo "$path -> HTTP $status"
            test "$status" = "200"
          done
      - name: Verify live account recovery is enabled
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/password-reset.html -w '%{http_code}' "$PUBLIC_SITE/accounts/password_reset/" || true)"
          echo "/accounts/password_reset/ -> HTTP $status"
          test "$status" = "200"
          if grep -qi "temporarily unavailable" /tmp/password-reset.html; then
            echo "::error::Production password recovery is disabled. Configure EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD and DEFAULT_FROM_EMAIL."
            exit 1
          fi
          grep -qi "Send reset link" /tmp/password-reset.html
