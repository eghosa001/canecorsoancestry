name: Production data health

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-data-health.yml"
      - "scripts/discover_supabase_session_pooler.py"
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 4"

permissions:
  contents: read

concurrency:
  group: production-data-health
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DB_SCHEMA: django_app
      DJANGO_DB_SSLMODE: require
      DJANGO_DB_EXTRA_SCHEMAS: extensions,public
      DJANGO_ALLOWED_HOSTS: .code.run,127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://web--canecorsoancestry--4w9gl8jxj4yr.code.run,https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev
      DJANGO_REQUIRE_OBJECT_STORAGE: "0"
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
      PUBLIC_SITE: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify database audit secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_DATABASE_URL DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required production database secret is missing: $name"
              missing=1
            else
              echo "::add-mask::${!name}"
            fi
          done
          test "$missing" -eq 0
      - run: pip install -r requirements.txt
      - name: Discover reachable Supabase session pooler
        shell: bash
        run: |
          target_url="$(python scripts/discover_supabase_session_pooler.py)"
          echo "::add-mask::$target_url"
          echo "DATABASE_URL=$target_url" >> "$GITHUB_ENV"
      - name: Check deployed schema expectation
        run: python manage.py migrate --check
      - name: Verify canonical production size
        run: |
          python manage.py shell -c "
          from registry.models import Dog
          count = Dog.objects.count()
          assert count >= 33000, count
          print(f'Production dogs: {count}')
          "
      - name: Audit pedigree integrity
        run: python manage.py audit_pedigree_data --fail-on-critical
      - name: Audit owner production invariants
        run: python manage.py audit_production_invariants --fail-on-critical
      - name: Verify one production dog image end to end
        shell: bash
        run: |
          set -euo pipefail
          media_path="$(python manage.py shell -c "
          from registry.models import DogImage
          value = DogImage.objects.filter(dog__is_public=True).order_by('pk').values_list('image', flat=True).first()
          assert value, 'No public DogImage rows found'
          print('/media/' + str(value).lstrip('/'))
          " | tail -n 1)"
          echo "Testing $media_path"
          first_status="$(curl --connect-timeout 10 --max-time 30 -sS -D /tmp/media-first.headers -o /dev/null -w '%{http_code}' "$PUBLIC_SITE$media_path" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/media-first.headers)"
          echo "Public media entry -> HTTP $first_status"
          echo "Redirect target host: $(printf '%s' "$location" | sed -E 's#https?://([^/]+).*#\\1#')"
          test "$first_status" = "302"
          test -n "$location"
          final_status="$(curl -L --connect-timeout 10 --max-time 30 -sS -D /tmp/media-final.headers -o /tmp/media-probe.bin -w '%{http_code}' "$PUBLIC_SITE$media_path" || true)"
          echo "Public media final -> HTTP $final_status"
          test "$final_status" = "200"
          test -s /tmp/media-probe.bin
          grep -qi '^content-type: image/' /tmp/media-final.headers
      - name: Verify critical static assets
        shell: bash
        run: |
          set -euo pipefail
          browser_ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36'
          for asset in             "/static/core/cane-corso-logo.webp"             "/static/core/cane-corso-header-mark.webp"             "/static/core/site.css"; do
            result="$(curl -L --connect-timeout 10 --max-time 30 -sS -A "$browser_ua" -o /tmp/static-probe -w '%{http_code}|%{content_type}|%{size_download}' "$PUBLIC_SITE$asset" || true)"
            echo "$asset -> $result"
            status="${result%%|*}"
            rest="${result#*|}"
            content_type="${rest%%|*}"
            size="${rest##*|}"
            test "$status" = "200"
            test "$size" -gt 100
            case "$asset" in
              *.webp) [[ "$content_type" == image/* ]] ;;
              *.css) [[ "$content_type" == text/css* ]] ;;
            esac
          done
      - name: Verify rendered dog images end to end
        shell: bash
        run: |
          set -euo pipefail
          browser_ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36'
          checked=0
          failures=0
          for page in "/" "/dogs/"; do
            file="/tmp/page-$(printf '%s' "$page" | tr '/?' '__').html"
            status="$(curl --connect-timeout 10 --max-time 30 -sS -A "$browser_ua" -o "$file" -w '%{http_code}' "$PUBLIC_SITE$page" || true)"
            echo "$page -> HTTP $status"
            test "$status" = "200"
            mapfile -t media < <(grep -o '/media/[^" ]*' "$file" | sort -u || true)
            echo "$page managed image references: ${#media[@]}"
            for src in "${media[@]}"; do
              [ -n "$src" ] || continue
              result="$(curl -L --connect-timeout 10 --max-time 30 -sS -A "$browser_ua" -o /dev/null -w '%{http_code}|%{content_type}' "$PUBLIC_SITE$src" || true)"
              status="${result%%|*}"
              content_type="${result#*|}"
              echo "$src -> HTTP $status $content_type"
              checked=$((checked + 1))
              if [ "$status" != "200" ] || [[ "$content_type" != image/* ]]; then
                failures=$((failures + 1))
              fi
            done
          done
          echo "Verified rendered images: $checked; failures: $failures"
          test "$checked" -ge 1
          test "$failures" -eq 0
      - name: Verify public production routes
        shell: bash
        run: |
          for path in "/healthz/" "/dogs/?q=Branco+Custodi+Nos" "/statistics/"; do
            status="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/cca.html -w '%{http_code}' "$PUBLIC_SITE$path" || true)"
            echo "$path -> HTTP $status"
            test "$status" = "200"
          done
      - name: Verify live account recovery is enabled
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/password-reset.html -w '%{http_code}' "$PUBLIC_SITE/accounts/password_reset/" || true)"
          echo "/accounts/password_reset/ -> HTTP $status"
          test "$status" = "200"
          if grep -qi "temporarily unavailable" /tmp/password-reset.html; then
            echo "::error::Production password recovery is disabled. Configure EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD and DEFAULT_FROM_EMAIL."
            exit 1
          fi
          grep -qi "Send reset link" /tmp/password-reset.html
