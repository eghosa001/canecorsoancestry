name: Fix Northflank health probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/northflank-fix-health.yml"

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NF_API: https://api.northflank.com/v1
    steps:
      - name: Update Northflank runtime environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NORTHFLANK_API_TOKEN"
          auth=(-H "Authorization: Bearer $NORTHFLANK_API_TOKEN" -H "Content-Type: application/json")

          projects="$(curl -fsS "${auth[@]}" "$NF_API/projects")"
          project_id="$(printf '%s' "$projects" | jq -r '.data.projects[0].id // empty')"
          test -n "$project_id"

          services="$(curl -fsS "${auth[@]}" "$NF_API/projects/$project_id/services")"
          service_id="$(printf '%s' "$services" | jq -r '.data.services[] | select(.name=="canecorsoancestry") | .id' | head -n1)"
          test -n "$service_id"

          curl -fsS "${auth[@]}" "$NF_API/projects/$project_id/services/$service_id/runtime-environment?show=this" > /tmp/env.json
          jq '.data.runtimeEnvironment.DJANGO_ALLOWED_HOSTS=".code.run,127.0.0.1,localhost" | {runtimeEnvironment:.data.runtimeEnvironment,runtimeFiles:(.data.runtimeFiles // {})}' /tmp/env.json > /tmp/payload.json

          response="$(curl -fsS "${auth[@]}" -X POST --data-binary @/tmp/payload.json "$NF_API/projects/$project_id/services/$service_id/runtime-environment")"
          printf '%s' "$response" | jq '{success:.data.success,restartSuccessful:.data.restartSuccessful}'

          ports="$(curl -fsS "${auth[@]}" "$NF_API/projects/$project_id/services/$service_id/ports")"
          dns="$(printf '%s' "$ports" | jq -r '.data.ports[] | select(.name=="web") | .dns // empty' | head -n1)"
          test -n "$dns"

          echo "Origin: https://$dns"
          for attempt in $(seq 1 36); do
            status="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/health -w '%{http_code}' "https://$dns/healthz/" || true)"
            if [ "$status" = "200" ]; then
              cat /tmp/health
              exit 0
            fi
            echo "Health attempt $attempt -> HTTP $status"
            sleep 5
          done
          cat /tmp/health 2>/dev/null || true
          exit 1
