name: Configure and deploy Render

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CONFIGURE_RENDER to sync GitHub secrets into Render and deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: configure-render-production
  cancel-in-progress: false

jobs:
  configure:
    if: ${{ inputs.confirm == 'CONFIGURE_RENDER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      RENDER_SERVICE_ID: srv-dauluqnlk1mc73ddgo40
      RENDER_ORIGIN: https://canecorsoancestry.onrender.com

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in RENDER_API_KEY AIVEN_DATABASE_URL DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            else
              echo "::add-mask::${!name}"
            fi
          done
          exit "$missing"

      - name: Validate Aiven URL
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          parsed = urlparse(os.environ["AIVEN_DATABASE_URL"])
          if parsed.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("AIVEN_DATABASE_URL must be a PostgreSQL URI.")
          if not parsed.hostname or not parsed.hostname.endswith(".aivencloud.com"):
              raise SystemExit("AIVEN_DATABASE_URL must point to Aiven.")
          if not parsed.username or not parsed.password or not parsed.path.strip("/"):
              raise SystemExit("AIVEN_DATABASE_URL is incomplete.")
          print("Aiven database URL validated.")
          PY

      - name: Sync private environment variables to Render
        shell: bash
        run: |
          set -euo pipefail

          put_env() {
            key="$1"
            value="$2"
            body="$(jq -n --arg value "$value" '{value:$value}')"
            curl --silent --show-error --fail-with-body               --request PUT               --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key"               --header "Authorization: Bearer $RENDER_API_KEY"               --header "Accept: application/json"               --header "Content-Type: application/json"               --data "$body"               --output /dev/null
            echo "Updated Render environment variable: $key"
          }

          put_env DATABASE_URL "$AIVEN_DATABASE_URL"
          put_env DJANGO_SECRET_KEY "$DJANGO_SECRET_KEY"

      - name: Enable deploy-after-CI on Render
        shell: bash
        run: |
          curl --silent --show-error --fail-with-body             --request PATCH             --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID"             --header "Authorization: Bearer $RENDER_API_KEY"             --header "Accept: application/json"             --header "Content-Type: application/json"             --data '{"autoDeployTrigger":"checksPass"}'             --output /dev/null
          echo "Render auto-deploy is now checksPass."

      - name: Trigger Render deployment
        shell: bash
        run: |
          response="$(curl --silent --show-error --fail-with-body             --request POST             --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"             --header "Authorization: Bearer $RENDER_API_KEY"             --header "Accept: application/json"             --header "Content-Type: application/json"             --data '{"clearCache":"do_not_clear","deployMode":"build_and_deploy"}')"
          deploy_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          if [ -z "$deploy_id" ]; then
            echo "::error::Render did not return a deploy ID."
            exit 1
          fi
          echo "RENDER_DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
          echo "Triggered Render deploy $deploy_id."

      - name: Wait for Render deployment
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            response="$(curl --silent --show-error --fail-with-body               --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID"               --header "Authorization: Bearer $RENDER_API_KEY"               --header "Accept: application/json")"
            status="$(printf '%s' "$response" | jq -r '.status')"
            echo "Render deploy status: $status"

            case "$status" in
              live)
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deployment ended with status: $status"
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "::error::Render deployment did not reach a terminal state within the workflow limit."
          exit 1

      - name: Verify Render health endpoint
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/render-health.json -w '%{http_code}' "$RENDER_ORIGIN/healthz/" || true)"
            if [ "$status" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/render-health.json; then
              echo "Render health check passed."
              exit 0
            fi
            echo "Health attempt $attempt returned HTTP $status."
            sleep 5
          done

          cat /tmp/render-health.json 2>/dev/null || true
          exit 1

      - name: Verify direct Render origin is gated
        shell: bash
        run: |
          status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/render-origin.txt -w '%{http_code}' "$RENDER_ORIGIN/" || true)"
          if [ "$status" != "403" ]; then
            echo "::error::Expected direct Render root to return 403, received HTTP $status."
            cat /tmp/render-origin.txt 2>/dev/null || true
            exit 1
          fi
          echo "Direct Render application traffic is correctly protected by the Cloudflare edge gate."

      - name: Clean temporary files
        if: always()
        run: rm -f /tmp/render-health.json /tmp/render-origin.txt
