name: Import CaneCorsoPedigree archive

on:
  push:
    branches: [main]
    paths:
      - .github/import-canecorso-now
  workflow_dispatch:
    inputs:
      publish:
        description: Publish imported source-linked pedigree records
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: canecorso-archive-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      SOURCE_FILE: /tmp/dogs_v4.csv
      SOURCE_FILE_ID: 1WFeLJjAi728rhzF4z9PJ36QNFFp2qnxs
      SOURCE_SHA256: 4acfb0e046ada9818719cafa360829a8aba96f3fcb16c630d675dffe3c76669b

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_DATABASE_URL" || { echo "::error::Missing SUPABASE_DATABASE_URL"; exit 1; }
          test -n "$DJANGO_SECRET_KEY" || { echo "::error::Missing DJANGO_SECRET_KEY"; exit 1; }

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "gdown>=5.2,<6"

      - name: Discover reachable Supabase session pooler
        shell: bash
        run: |
          target_url="$(python scripts/discover_supabase_session_pooler.py)"
          echo "::add-mask::$target_url"
          echo "DATABASE_URL=$target_url" >> "$GITHUB_ENV"

      - name: Download immutable source snapshot
        run: |
          gdown --id "$SOURCE_FILE_ID" --output "$SOURCE_FILE"
          echo "$SOURCE_SHA256  $SOURCE_FILE" | sha256sum --check -

      - name: Verify migrations
        env: &django_env
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          DJANGO_ALLOWED_HOSTS: canecorsoancestry.onrender.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry.onrender.com
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: python manage.py migrate --check

      - name: Resolve publish mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            echo "PUBLISH_FLAG=--publish" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_FLAG=" >> "$GITHUB_ENV"
          fi

      - name: Dry-run archive import
        env: *django_env
        run: |
          python manage.py import_canecorso_archive "$SOURCE_FILE" \
            --start-year 2020 --end-year 2026 --dry-run \
            $PUBLISH_FLAG

      - name: Import 2020-present dogs and required ancestors
        env: *django_env
        run: |
          python manage.py import_canecorso_archive "$SOURCE_FILE" \
            --start-year 2020 --end-year 2026 \
            $PUBLISH_FLAG

      - name: Verify archive links
        env: *django_env
        run: |
          python manage.py shell -c "
          from registry.models import DogExternalKey
          count = DogExternalKey.objects.filter(namespace='canecorsopedigree.com').count()
          assert count == 33137, f'Expected 33137 archive external keys, got {count}'
          print(f'Verified {count} source-linked CaneCorsoPedigree records')
          "

      - name: Audit production pedigree integrity
        env: *django_env
        run: python manage.py audit_pedigree_data --fail-on-critical
