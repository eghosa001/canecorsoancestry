name: Oracle isolated edge credential watch

on:
  schedule:
    - cron: "11 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/oracle_runner/check_edge_credential_isolation.sh"
      - ".github/workflows/origin-credential-health.yml"
  pull_request:
    paths:
      - "scripts/oracle_runner/check_edge_credential_isolation.sh"
      - ".github/workflows/origin-credential-health.yml"

permissions:
  contents: read

concurrency:
  group: oracle-origin-credential-watch
  cancel-in-progress: false

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/oracle_runner/check_edge_credential_isolation.sh
  live:
    if: github.event_name != 'pull_request' && github.repository == 'eghosa001/canecorsoancestry' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 5
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/oracle_runner/check_edge_credential_isolation.sh
