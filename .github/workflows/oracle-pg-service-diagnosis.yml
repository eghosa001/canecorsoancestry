name: Oracle PostgreSQL service lifecycle diagnosis
on:
  pull_request:
    paths:
      - "scripts/oracle_runner/diagnose_pg_service.sh"
      - ".github/workflows/oracle-pg-service-diagnosis.yml"
  push:
    branches: [main]
    paths:
      - "scripts/oracle_runner/diagnose_pg_service.sh"
permissions:
  contents: read
concurrency:
  group: oracle-pg-service-diagnosis
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n scripts/oracle_runner/diagnose_pg_service.sh
          python3 scripts/fast_path_guard.py
  diagnose:
    if: github.event_name == 'push' && github.repository == 'eghosa001/canecorsoancestry' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/oracle_runner/diagnose_pg_service.sh
