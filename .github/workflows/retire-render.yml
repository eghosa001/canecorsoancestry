name: Retire Render fallback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-render.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retire-render-fallback
  cancel-in-progress: false

jobs:
  suspend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-dauluqnlk1mc73ddgo40
      PUBLIC_SITE: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev

    steps:
      - name: Verify Northflank-backed public site before Render suspension
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo "::error::Missing RENDER_API_KEY"; exit 1; }
          echo "::add-mask::$RENDER_API_KEY"

          for path in "/healthz/" "/dogs/?q=Branco+Custodi+Nos" "/statistics/"; do
            status="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/pre-suspend.html -w '%{http_code}' "$PUBLIC_SITE$path" || true)"
            echo "$path -> HTTP $status"
            test "$status" = "200"
          done

      - name: Suspend obsolete Render service
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error             --output /tmp/render-suspend.txt             --write-out '%{http_code}'             --request POST             --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/suspend"             --header "Authorization: Bearer $RENDER_API_KEY"             --header "Accept: application/json")"
          echo "Render suspend -> HTTP $status"
          if [ "$status" != "202" ]; then
            cat /tmp/render-suspend.txt 2>/dev/null || true
            exit 1
          fi

      - name: Prove public site no longer depends on Render
        shell: bash
        run: |
          set -euo pipefail

          rollback() {
            echo "::warning::Public verification failed after Render suspension; resuming Render fallback."
            curl --silent --show-error --fail-with-body               --request POST               --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/resume"               --header "Authorization: Bearer $RENDER_API_KEY"               --header "Accept: application/json"               --output /dev/null || true
          }

          for path in "/healthz/" "/dogs/?q=Branco+Custodi+Nos" "/statistics/" "/accounts/login/"; do
            ok=0
            for attempt in $(seq 1 12); do
              status="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/post-suspend.html -w '%{http_code}' "$PUBLIC_SITE$path" || true)"
              echo "$path attempt $attempt -> HTTP $status"
              if [ "$status" = "200" ]; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              rollback
              exit 1
            fi
          done

          echo "Render is suspended and production remains healthy on Cloudflare -> Northflank -> Supabase."
