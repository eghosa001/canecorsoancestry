name: Backfill CaneCorso metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-canecorso-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canecorso-metadata-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DB_SCHEMA: django_app
      DJANGO_DB_SSLMODE: require
      DJANGO_DB_EXTRA_SCHEMAS: extensions,public
      DJANGO_ALLOWED_HOSTS: .code.run,127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry.com
      DJANGO_REQUIRE_OBJECT_STORAGE: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover reachable Supabase session pooler
        shell: bash
        run: |
          target_url="$(python scripts/discover_supabase_session_pooler.py)"
          echo "::add-mask::$target_url"
          echo "DATABASE_URL=$target_url" >> "$GITHUB_ENV"
      - name: Verify migrations
        run: python manage.py migrate --check
      - name: Preview source-backed metadata enrichment
        run: python manage.py backfill_canecorso_metadata --dry-run --min-kennel-dogs 12

      - name: Apply source-backed metadata enrichment
        run: python manage.py backfill_canecorso_metadata --min-kennel-dogs 12

      - name: Verify production metadata
        run: |
          python manage.py shell -c "
          from registry.models import Dog, Kennel
          countries = list(
              Dog.objects.exclude(country='')
              .values_list('country', flat=True)
              .distinct()
              .order_by('country')
          )
          kennel_count = Kennel.objects.count()
          linked = Dog.objects.exclude(kennel=None).count()
          with_country = Dog.objects.exclude(country='').count()
          assert len(countries) >= 10, countries
          assert kennel_count >= 100, kennel_count
          assert linked >= 5000, linked
          assert with_country >= 15000, with_country
          print(f'Countries ({len(countries)}): {countries}')
          print(f'Kennels: {kennel_count}; linked dogs: {linked}; dogs with country: {with_country}')
          "
