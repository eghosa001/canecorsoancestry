name: Confirm restored Oracle photo coverage
on:
  push:
    branches: [main]
    paths: [".github/workflows/oracle-photo-coverage.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'eghosa001/canecorsoancestry' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Count actual public photos under active storage backend
        shell: bash
        run: |
          set -euo pipefail
          sudo -n podman exec cca-oracle-staging python manage.py shell -c '
          from collections import Counter
          from django.conf import settings
          from django.core.files.storage import default_storage
          from registry.models import DogImage
          from registry.querysets import published_dogs
          from pathlib import Path
          keys = list(DogImage.objects.filter(dog__in=published_dogs()).values_list("image", flat=True))
          seen=set()
          counts=Counter()
          for key in keys:
              if not key or key in seen: continue
              seen.add(key)
              group = "archive" if key.startswith("dogs/archive/") else ("bellissimo" if key.startswith("dogs/bellissimo/") else "other")
              counts[group+"_total"] += 1
              if default_storage.exists(key):
                  counts[group+"_available"] += 1
              else:
                  counts[group+"_missing"] += 1
          print("ACTIVE MEDIA:",getattr(settings,"CCA_MEDIA_BACKEND","unconfigured"))
          print("PUBLIC PHOTO COVERAGE:",dict(sorted(counts.items())))
          print("UNIQUE PUBLIC IMAGE KEYS:",len(seen))
          '
      - name: Verify signed-in-independent public archive JPEG via Django route
        shell: bash
        run: |
          set -euo pipefail
          for key in dogs/archive/111/111524.jpg dogs/archive/026/26098.jpg; do
            code="$(curl -L -sS --connect-timeout 6 --max-time 30 -D /tmp/cca-photo-head -o /tmp/cca-photo-out -w '%{http_code}' "https://canecorsoancestry.com/media/$key")"
            grep -qi '^content-type: image/jpeg' /tmp/cca-photo-head
            test "$code" = "200"
            python3 - <<'PY'
          from pathlib import Path
          data=Path("/tmp/cca-photo-out").read_bytes()
          assert len(data)>500 and data.startswith(bytes.fromhex("ffd8ff"))
          print(f"PASS: real JPEG through Oracle Django ({len(data)} bytes)")
          PY
          done
