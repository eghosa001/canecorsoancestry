name: Inspect CaneCorso source metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-canecorso-source.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "gdown>=5.2,<6" requests beautifulsoup4
      - name: Inspect archive header
        shell: bash
        run: |
          gdown --id 1WFeLJjAi728rhzF4z9PJ36QNFFp2qnxs --output /tmp/dogs.csv
          python - <<'PY'
          import csv
          with open("/tmp/dogs.csv", encoding="utf-8-sig", newline="") as f:
              r = csv.reader(f)
              print("CSV_HEADER=" + repr(next(r)))
          PY
      - name: Inspect current public profile metadata
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          for dog_id in ("32854","23100","44695","121431"):
              u=f"https://www.canecorsopedigree.com/view_dog?id={dog_id}"
              r=requests.get(u,timeout=20,headers={"User-Agent":"CaneCorsoAncestryResearch/1.0"})
              print("DOG",dog_id,"HTTP",r.status_code)
              s=BeautifulSoup(r.text,"html.parser")
              texts=[x.strip() for x in s.stripped_strings if x.strip()]
              wanted=("Owner","Breeder","Country","Kennel")
              for i,t in enumerate(texts):
                  if any(t.rstrip(":").casefold()==w.casefold() for w in wanted):
                      print("LABEL",repr(t),"NEXT",repr(texts[i+1:i+5]))
              for a in s.find_all("a",href=True):
                  href=a.get("href","")
                  if "owner" in href.lower() or "breeder" in href.lower():
                      print("LINK",a.get_text(" ",strip=True),urljoin(u,href))
          PY
