name: Cancel old CaneCorso photo sync

on:
  push:
    paths:
      - ".github/workflows/cancel-old-photo-sync.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded photo migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/36867096354/cancel"
