name: Oracle PostgreSQL route benchmark (read only)
on:
  pull_request:
    paths:
      - "scripts/oracle_runner/probe_db_routes.sh"
      - ".github/workflows/oracle-db-route-probe.yml"
  push:
    branches: [main]
    paths:
      - "scripts/oracle_runner/probe_db_routes.sh"
permissions:
  contents: read
concurrency:
  group: oracle-db-route-probe
  cancel-in-progress: true
jobs:
  focused-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n scripts/oracle_runner/probe_db_routes.sh
          python3 scripts/fast_path_guard.py
  benchmark:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'eghosa001/canecorsoancestry' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare direct IPv6 PostgreSQL to session pooler
        shell: bash
        run: bash scripts/oracle_runner/probe_db_routes.sh
