name: Cloudflare Container build check

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "src/container-worker.js"
      - "wrangler.container.*.jsonc"
      - "package.json"
      - "core/container_storage.py"
      - "config/settings/container.py"
      - ".github/workflows/cloudflare-container-*.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: pip install -r requirements.txt

      - name: Django configuration check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: python manage.py check

      - name: Build Django container image
        run: docker build -t canecorsoancestry-container:test .

      - name: Validate preview Wrangler config
        run: npx wrangler deploy --dry-run --config wrangler.container.preview.jsonc
