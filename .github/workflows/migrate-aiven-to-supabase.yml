name: Migrate Aiven database back to Supabase

on:
  pull_request:
    paths:
      - ".github/workflows/migrate-aiven-to-supabase.yml"
      - "scripts/discover_supabase_session_pooler.py"
      - "scripts/compare_postgres_counts.py"
      - "scripts/validate_supabase_direct_url.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-aiven-to-supabase.yml"
      - ".github/migrate-aiven-to-supabase-now"

permissions:
  contents: read

concurrency:
  group: migrate-aiven-to-supabase
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate migration secrets
        shell: bash
        run: |
          missing=0
          for name in AIVEN_DATABASE_URL SUPABASE_DATABASE_URL DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            else
              echo "::add-mask::${!name}"
            fi
          done
          exit "$missing"

      - name: Validate Supabase direct URL
        run: python scripts/validate_supabase_direct_url.py

      - name: Discover reachable Supabase session pooler
        shell: bash
        run: |
          target_url="$(python scripts/discover_supabase_session_pooler.py)"
          echo "::add-mask::$target_url"
          echo "TARGET_DATABASE_URL=$target_url" >> "$GITHUB_ENV"

      - name: Verify both databases are reachable
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg

          for label, url in (
              ("Aiven source", os.environ["AIVEN_DATABASE_URL"]),
              ("Supabase target", os.environ["TARGET_DATABASE_URL"]),
          ):
              with psycopg.connect(url, sslmode="require") as connection:
                  with connection.cursor() as cursor:
                      cursor.execute(
                          """
                          SELECT
                              current_database(),
                              EXISTS (
                                  SELECT 1 FROM pg_namespace
                                  WHERE nspname = 'django_app'
                              )
                          """
                      )
                      database, has_schema = cursor.fetchone()
                      dog_count = 0
                      if has_schema:
                          cursor.execute(
                              'SELECT count(*) FROM django_app.registry_dog'
                          )
                          dog_count = cursor.fetchone()[0]
                      print(
                          f"{label}: database={database}; "
                          f"django_app={has_schema}; dogs={dog_count}"
                      )
          PY

  migrate:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-dauluqnlk1mc73ddgo40
      PUBLIC_SITE: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev
      RENDER_ORIGIN: https://canecorsoancestry.onrender.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate cutover secrets
        shell: bash
        run: |
          missing=0
          for name in AIVEN_DATABASE_URL SUPABASE_DATABASE_URL DJANGO_SECRET_KEY RENDER_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            else
              echo "::add-mask::${!name}"
            fi
          done
          exit "$missing"

      - name: Discover Supabase session pooler
        shell: bash
        run: |
          target_url="$(python scripts/discover_supabase_session_pooler.py)"
          echo "::add-mask::$target_url"
          echo "TARGET_DATABASE_URL=$target_url" >> "$GITHUB_ENV"

      - name: Capture source database facts
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(
              os.environ["AIVEN_DATABASE_URL"], sslmode="require"
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT count(*) FROM django_app.registry_dog"
                  )
                  dogs = cursor.fetchone()[0]
                  cursor.execute("SELECT pg_database_size(current_database())")
                  size = cursor.fetchone()[0]
          print(f"Aiven source dogs: {dogs}")
          print(f"Aiven source database bytes: {size}")
          if dogs < 33000:
              raise SystemExit(
                  f"Refusing cutover: expected at least 33,000 dogs, found {dogs}."
              )
          PY

      - name: Dump current Aiven Django schema
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/supabase-cutover"
          docker run --rm             -e AIVEN_DATABASE_URL             -e PGSSLMODE=require             -v "$RUNNER_TEMP/supabase-cutover:/work"             postgres:17-alpine             sh -ec 'pg_dump "$AIVEN_DATABASE_URL" --format=custom --no-owner --no-acl --schema=django_app --file=/work/django_app.dump'
          test -s "$RUNNER_TEMP/supabase-cutover/django_app.sql"

      - name: Back up current Supabase Django schema
        shell: bash
        run: |
          docker run --rm             -e TARGET_DATABASE_URL             -e PGSSLMODE=require             -v "$RUNNER_TEMP/supabase-cutover:/work"             postgres:17-alpine             sh -ec 'pg_dump "$TARGET_DATABASE_URL" --format=custom --no-owner --no-acl --schema=django_app --file=/work/supabase-before.dump'
          test -s "$RUNNER_TEMP/supabase-cutover/supabase-before.dump"

      - name: Replace Supabase Django schema from Aiven
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             -e TARGET_DATABASE_URL             -e PGSSLMODE=require             postgres:17-alpine             sh -ec 'psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS django_app CASCADE;"'

          if ! docker run --rm             -e TARGET_DATABASE_URL             -e PGSSLMODE=require             -v "$RUNNER_TEMP/supabase-cutover:/work"             postgres:17-alpine             sh -ec 'pg_restore --dbname="$TARGET_DATABASE_URL" --no-owner --no-acl --exit-on-error /work/django_app.dump'; then
            echo "::error::Supabase restore failed; restoring its pre-cutover schema."
            docker run --rm               -e TARGET_DATABASE_URL               -e PGSSLMODE=require               postgres:17-alpine               sh -ec 'psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS django_app CASCADE;"'
            docker run --rm               -e TARGET_DATABASE_URL               -e PGSSLMODE=require               -v "$RUNNER_TEMP/supabase-cutover:/work"               postgres:17-alpine               sh -ec 'pg_restore --dbname="$TARGET_DATABASE_URL" --no-owner --no-acl --exit-on-error /work/supabase-before.dump'
            exit 1
          fi

      - name: Keep Django schema private from Supabase Data API roles
        shell: bash
        run: |
          docker run --rm             -e TARGET_DATABASE_URL             -e PGSSLMODE=require             postgres:17-alpine             sh -ec 'psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 <<'"'"'SQL'"'"'
          REVOKE ALL ON SCHEMA django_app FROM anon, authenticated;
          REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA django_app FROM anon, authenticated;
          REVOKE ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA django_app FROM anon, authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA django_app
            REVOKE ALL ON TABLES FROM anon, authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA django_app
            REVOKE ALL ON SEQUENCES FROM anon, authenticated;
          SQL'

      - name: Verify every Django table row count
        env:
          SOURCE_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
        run: python scripts/compare_postgres_counts.py

      - name: Validate Django against Supabase
        env:
          DATABASE_URL: ${{ env.TARGET_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          DJANGO_ALLOWED_HOSTS: testserver
          DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver
          SITE_URL: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev
          R2_GATEWAY_URL: https://canecorsoancestry-edge.aighewieghosa111.workers.dev
          MEDIA_EDGE_BASE_URL: https://canecorsoancestry-edge.aighewieghosa111.workers.dev
        run: |
          python manage.py migrate --check
          python manage.py check --deploy
          python manage.py audit_pedigree_data --fail-on-critical
          python manage.py shell -c "
          from registry.models import Dog
          count = Dog.objects.count()
          assert count >= 33000, count
          print(f'Verified Supabase Django dog count: {count}')
          "

      - name: Point temporary Render backend at Supabase
        shell: bash
        run: |
          set -euo pipefail

          put_env() {
            key="$1"
            value="$2"
            body="$(jq -n --arg value "$value" '{value:$value}')"
            curl --silent --show-error --fail-with-body               --request PUT               --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key"               --header "Authorization: Bearer $RENDER_API_KEY"               --header "Accept: application/json"               --header "Content-Type: application/json"               --data "$body"               --output /dev/null
            echo "Updated Render environment variable: $key"
          }

          put_env DATABASE_URL "$TARGET_DATABASE_URL"
          put_env DJANGO_DB_SCHEMA "django_app"
          put_env DJANGO_DB_SSLMODE "require"
          put_env DJANGO_DB_EXTRA_SCHEMAS "extensions,public"

      - name: Trigger temporary Render deploy on Supabase
        shell: bash
        run: |
          response="$(curl --silent --show-error --fail-with-body             --request POST             --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"             --header "Authorization: Bearer $RENDER_API_KEY"             --header "Accept: application/json"             --header "Content-Type: application/json"             --data '{"clearCache":"do_not_clear","deployMode":"build_and_deploy"}')"
          deploy_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          test -n "$deploy_id" || { echo "::error::Render did not return a deploy ID."; exit 1; }
          echo "RENDER_DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"

      - name: Wait for temporary Render deploy
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            response="$(curl --silent --show-error --fail-with-body               --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID"               --header "Authorization: Bearer $RENDER_API_KEY"               --header "Accept: application/json")"
            status="$(printf '%s' "$response" | jq -r '.status')"
            echo "Render deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy failed: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          exit 1

      - name: Verify public site after Supabase cutover
        shell: bash
        run: |
          for path in "/healthz/" "/dogs/?q=Branco+Custodi+Nos" "/statistics/"; do
            status="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/cca.html -w '%{http_code}' "$PUBLIC_SITE$path" || true)"
            echo "$path -> HTTP $status"
            test "$status" = "200"
          done

      - name: Clean temporary migration files
        if: always()
        run: rm -rf "$RUNNER_TEMP/supabase-cutover"
