name: UI smoke screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "core/templates/**"
      - "core/static/**"
      - "registry/templates/**"
      - "pedigrees/templates/**"
      - "accounts/templates/**"
      - "accounts/views.py"
      - "accounts/urls.py"
      - "registry/views.py"
      - "config/urls.py"
      - "scripts/ui_smoke.py"
      - ".github/workflows/ui-smoke.yml"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py migrate --noinput
      - run: python manage.py import_bellissimo
      - name: Create UI review member and workspace data
        run: |
          python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          from registry.models import (
              DisputeCase,
              Dog,
              DogDocument,
              Kennel,
              KennelMembership,
              Litter,
              ModerationAudit,
              Submission,
          )

          U = get_user_model()
          u, _ = U.objects.get_or_create(username="ui-reviewer", defaults={"is_staff": True})
          u.is_staff = True
          u.set_password("ui-reviewer-password")
          u.save()

          k = Kennel.objects.filter(dogs__isnull=False).distinct().first()
          if not k:
              k = Kennel.objects.create(name="UI Kennel", slug="ui-kennel")
          KennelMembership.objects.update_or_create(
              user=u,
              kennel=k,
              defaults={"role": KennelMembership.Role.OWNER},
          )

          Kennel.objects.get_or_create(
              slug="claimable-kennel",
              defaults={"name": "Claimable Kennel", "country": "Nigeria"},
          )

          sire = Dog.objects.filter(kennel=k, sex=Dog.Sex.MALE).first()
          dam = Dog.objects.filter(kennel=k, sex=Dog.Sex.FEMALE).first()
          Litter.objects.get_or_create(
              code="UI-LITTER-2026",
              defaults={"kennel": k, "sire": sire, "dam": dam, "is_public": False},
          )

          dog = Dog.objects.filter(kennel=k).first()
          if dog:
              DogDocument.objects.get_or_create(
                  dog=dog,
                  title="UI pedigree evidence",
                  defaults={
                      "document_type": DogDocument.DocumentType.PEDIGREE,
                      "file": "documents/ui-pedigree.pdf",
                      "submitted_by": u,
                  },
              )
              if not Submission.objects.filter(
                  submitted_by=u,
                  dog=dog,
                  kind=Submission.Kind.CORRECTION,
                  status=Submission.Status.PENDING,
              ).exists():
                  Submission.objects.create(
                      kind=Submission.Kind.CORRECTION,
                      submitted_by=u,
                      dog=dog,
                      kennel=dog.kennel,
                      priority=Submission.Priority.HIGH,
                      payload={
                          "name": dog.name,
                          "colour": "Brindle" if dog.colour != "Brindle" else "Black",
                      },
                      notes="UI review example with a visible before/after diff.",
                  )
              dispute, _ = DisputeCase.objects.get_or_create(
                  dog=dog,
                  opened_by=u,
                  reason=DisputeCase.Reason.PEDIGREE,
                  status=DisputeCase.Status.OPEN,
                  defaults={"details": "UI example: verify the listed sire against pedigree evidence."},
              )
              ModerationAudit.objects.get_or_create(
                  action=ModerationAudit.Action.DISPUTE_OPENED,
                  dispute=dispute,
                  defaults={
                      "actor": u,
                      "dog": dog,
                      "kennel": dog.kennel,
                      "summary": {"reason": dispute.reason, "ui_seed": True},
                  },
              )
          PY
      - name: Start Django
        run: |
          python manage.py runserver 127.0.0.1:8000 > /tmp/cca-django.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cca-django.log
          exit 1
      - run: python scripts/ui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-screenshots
          path: artifacts/ui
          if-no-files-found: error
