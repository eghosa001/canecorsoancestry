name: Cloudflare R2 media gateway

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "src/r2-media.js"
      - "src/drive-archive-map.js"
      - "src/bellissimo-source-map.js"
      - "scripts/build_drive_archive_map.py"
      - "data/canecorso_drive_manifest_v1/**"
      - "wrangler.r2.toml"
      - "scripts/test_r2_media_policy.mjs"
      - ".github/workflows/cloudflare-media.yml"
  push:
    branches: [main]
    paths:
      - "src/r2-media.js"
      - "src/drive-archive-map.js"
      - "src/bellissimo-source-map.js"
      - "scripts/build_drive_archive_map.py"
      - "data/canecorso_drive_manifest_v1/**"
      - "wrangler.r2.toml"
      - "scripts/test_r2_media_policy.mjs"
      - ".github/workflows/cloudflare-media.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-r2-media
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate public Drive archive fallback mapping
        run: python3 scripts/build_drive_archive_map.py
      - name: Validate Worker JavaScript
        run: node --check src/r2-media.js
      - name: Test R2 source URL policy
        run: node scripts/test_r2_media_policy.mjs
      - name: Validate Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.r2.toml

  deploy-r2:
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 19a03bec57c0277e01e1e70e241576af
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate public Drive archive fallback mapping
        run: python3 scripts/build_drive_archive_map.py

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Derive dedicated R2 signing key
        shell: bash
        run: |
          set -euo pipefail
          signing_key="$(printf '%s' "$DJANGO_SECRET_KEY" | base64 -w0)"
          test -n "$signing_key"
          echo "::add-mask::$signing_key"
          echo "R2_GATEWAY_SIGNING_KEY=$signing_key" >> "$GITHUB_ENV"

      - name: Reuse existing media binding without creating a paid R2 bucket
        run: echo "Deploying read-only public archive photo fallback; no new bucket created."

      - name: Build Worker secret file
        run: |
          python -c 'import json, os; open("/tmp/r2-secrets.json", "w", encoding="utf-8").write(json.dumps({"R2_GATEWAY_SIGNING_KEY": os.environ["R2_GATEWAY_SIGNING_KEY"]}))'

      - name: Deploy R2 media gateway
        run: |
          npx --yes wrangler@4 deploy             --config wrangler.r2.toml             --secrets-file /tmp/r2-secrets.json

      - name: Verify R2 media gateway
        shell: bash
        run: |
          base="https://media.canecorsoancestry.com"

          for attempt in $(seq 1 12); do
            status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/r2-health.json -w '%{http_code}' "$base/healthz/" || true)"
            if [ "$status" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/r2-health.json; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              cat /tmp/r2-health.json 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          unsigned_status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/r2-denied.txt -w '%{http_code}' "$base/_r2/unauthorized-check" || true)"
          if [ "$unsigned_status" != "403" ]; then
            echo "::error::Unsigned R2 gateway request was not rejected; HTTP $unsigned_status"
            exit 1
          fi

          echo "R2 media gateway is healthy and private."

      - name: Verify representative R2 dog images
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="https://media.canecorsoancestry.com"
          empty_digest="$(printf '' | sha256sum | awk '{print $1}')"
          for key in "dogs/bellissimo/karma-custodi-nos.webp" "dogs/archive/111/111524.jpg" "dogs/archive/026/26098.jpg" "dogs/archive/014/14125.jpg"; do
            timestamp="$(date +%s)"
            signature="$(R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$empty_digest" python -c 'import hashlib,hmac,os; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["R2_GATEWAY_SIGNING_KEY"].encode(), chr(10).join(["HEAD", k, t, d]).encode(), hashlib.sha256).hexdigest())')"
            status="$(curl --connect-timeout 8 --max-time 20 -sS -o /dev/null -D /tmp/r2-verify-headers.txt -w '%{http_code}' -I \
              -H "x-r2-timestamp: $timestamp" \
              -H "x-r2-content-sha256: $empty_digest" \
              -H "x-r2-signature: $signature" \
              "$base/_r2/$key" || true)"
            echo "$key -> HTTP $status"
            if [ "$status" != "200" ]; then
              echo "::error::Representative R2 object is unavailable: $key (HTTP $status)"
              echo "R2 signed HEAD response (no credentials shown):"
              grep -iE '^(x-r2-auth-reason|x-r2-auth-method|cache-control|cf-ray|server):' /tmp/r2-verify-headers.txt || true
              exit 1
            fi
          done

      - name: Check live signed dog thumbnail format
        shell: bash
        run: |
          set -euo pipefail
          key="dogs/archive/111/111524.jpg"
          variant="thumb"
          expires="$(( ($(date +%s) + 359) / 60 * 60 ))"
          signature="$(CCA_PHOTO_KEY="$key" CCA_PHOTO_VARIANT="$variant" CCA_PHOTO_EXPIRY="$expires" python -c 'import hashlib,hmac,os; m=chr(10).join(("GET",os.environ["CCA_PHOTO_KEY"],os.environ["CCA_PHOTO_VARIANT"],os.environ["CCA_PHOTO_EXPIRY"])); print(hmac.new(os.environ["R2_GATEWAY_SIGNING_KEY"].encode(),m.encode(),hashlib.sha256).hexdigest())')"
          url="https://media.canecorsoancestry.com/_thumb/$key?variant=$variant&expires=$expires&signature=$signature"
          status="$(curl -L --connect-timeout 8 --max-time 35 -sS -D /tmp/cca-photo-headers.txt -o /tmp/cca-photo-body.webp -w '%{http_code}' "$url")"
          test "$status" = 200 || { echo "::error::Signed photo HTTP $status"; exit 1; }
          echo "Photo bytes: $(wc -c </tmp/cca-photo-body.webp)"
          grep -iE '^(content-type|x-cca-image-cache|x-cca-image-variant):' /tmp/cca-photo-headers.txt || true
          # Signed first/second-load timings from an actual public dog photo.
          # Do not print tokens or infer results from a local fake R2 mock.
          for pass in 1 2; do
            curl -L --connect-timeout 8 --max-time 35 -sS \
              -o /dev/null -D /tmp/cca-photo-timing-headers.txt \
              -w "Photo CDN pass $pass: status=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}\\n" \
              "$url"
            grep -iE '^(x-cca-image-cache|x-cca-image-variant):' /tmp/cca-photo-timing-headers.txt || true
          done
          if ! grep -qi '^content-type: image/webp' /tmp/cca-photo-headers.txt; then
            echo "::warning::Cloudflare image transform returned an original, not a WebP. Check Images quota/binding."
          fi
          # Never print signed URL or any secret.

      - name: Verify R2 upload round trip
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="https://media.canecorsoancestry.com"
          key="smoke/uploads/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-missing-first.jpg"
          body="cca-r2-write-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          digest="$(printf '%s' "$body" | sha256sum | awk '{print $1}')"
          # Mirror Django's storage probe: an unauthorised/non-existent photo
          # is checked by signed HEAD BEFORE the object is created.
          empty_digest="$(printf '' | sha256sum | awk '{print $1}')"
          timestamp="$(date +%s)"
          signature="$(R2_METHOD="HEAD" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$empty_digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["R2_GATEWAY_SIGNING_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          absent_status="$(curl --connect-timeout 8 --max-time 20 -sS -o /dev/null -w '%{http_code}' -I \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $empty_digest" \
            -H "x-r2-signature: $signature" \
            "$base/_r2/$key" || true)"
          if [ "$absent_status" != "404" ]; then
            echo "::error::Missing object HEAD should be 404 before upload: HTTP $absent_status"
            exit 1
          fi
          timestamp="$(date +%s)"
          signature="$(R2_METHOD="PUT" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["R2_GATEWAY_SIGNING_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          put_status="$(curl --connect-timeout 8 --max-time 30 -sS -o /tmp/r2-put.json -w '%{http_code}' -X PUT \
            -H "content-type: text/plain" \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $digest" \
            -H "x-r2-signature: $signature" \
            --data-binary "$body" "$base/_r2/$key" || true)"
          if [ "$put_status" != "201" ] ||
             ! grep -q '"r2_verified"[[:space:]]*:[[:space:]]*true' /tmp/r2-put.json; then
            echo "::error::Signed R2 upload was not verified by the gateway; HTTP $put_status"
            cat /tmp/r2-put.json 2>/dev/null || true
            exit 1
          fi

          empty_digest="$(printf '' | sha256sum | awk '{print $1}')"
          timestamp="$(date +%s)"
          signature="$(R2_METHOD="HEAD" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$empty_digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["R2_GATEWAY_SIGNING_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          head_status="$(curl --connect-timeout 8 --max-time 20 -sS -o /dev/null -w '%{http_code}' -I \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $empty_digest" \
            -H "x-r2-signature: $signature" \
            "$base/_r2/$key" || true)"
          if [ "$head_status" != "200" ]; then
            echo "::error::Uploaded R2 object could not be read back; HTTP $head_status"
            exit 1
          fi

          timestamp="$(date +%s)"
          signature="$(R2_METHOD="GET" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$empty_digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["R2_GATEWAY_SIGNING_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          get_status="$(curl --connect-timeout 8 --max-time 20 -sS -o /tmp/r2-after-miss-body.txt -w '%{http_code}' \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $empty_digest" \
            -H "x-r2-signature: $signature" \
            "$base/_r2/$key" || true)"
          if [ "$get_status" != "200" ] || [ "$(cat /tmp/r2-after-miss-body.txt)" != "$body" ]; then
            echo "::error::Freshly uploaded R2 object cannot be read after prior 404 HEAD: HTTP $get_status"
            exit 1
          fi

          timestamp="$(date +%s)"
          signature="$(R2_METHOD="DELETE" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$empty_digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["R2_GATEWAY_SIGNING_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          delete_status="$(curl --connect-timeout 8 --max-time 20 -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $empty_digest" \
            -H "x-r2-signature: $signature" \
            "$base/_r2/$key" || true)"
          if [ "$delete_status" != "204" ]; then
            echo "::error::R2 smoke object cleanup failed; HTTP $delete_status"
            exit 1
          fi
          echo "Signed R2 upload, verification, and cleanup all succeeded."

      - name: Verify binary image upload round trip
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base="https://media.canecorsoancestry.com"
          key="smoke/uploads/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jpg"
          python - <<'PY'
          import base64
          from pathlib import Path
          payload = (
              "/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////"
              "2wBDAf//////////////////////////////////////////////////////////////////////////////////////"
              "wAARCAABAAEDASIAAhEBAxEB/8QAFQABAQAAAAAAAAAAAAAAAAAAAAX/xAAUEAEAAAAAAAAAAAAAAAAAAAAA/"
              "9oADAMBAAIQAxAAAAF//8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABBQJ//8QAFBEBAAAAAAAAAAAAA"
              "AAAAAAAAP/aAAgBAwEBPwF//8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAgBAgEBPwF//8QAFBABAAAAAAAAA"
              "AAAAAAAAAAAAP/aAAgBAQAGPwJ//8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPyF//9oADAMBAAIAA"
              "wAAABAf/8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAgBAwEBPxB//8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAA"
              "gBAgEBPxB//8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxB//9k="
          )
          Path("/tmp/r2-smoke.jpg").write_bytes(base64.b64decode(payload))
          PY
          digest="$(sha256sum /tmp/r2-smoke.jpg | awk '{print $1}')"
          timestamp="$(date +%s)"
          signature="$(R2_METHOD="PUT" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["R2_GATEWAY_SIGNING_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          put_status="$(curl --connect-timeout 8 --max-time 30 -sS -o /tmp/r2-image-put.json -w '%{http_code}' -X PUT \
            -H "content-type: image/jpeg" \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $digest" \
            -H "x-r2-signature: $signature" \
            --data-binary @/tmp/r2-smoke.jpg "$base/_r2/$key" || true)"
          test "$put_status" = "201"
          grep -q '"r2_verified"[[:space:]]*:[[:space:]]*true' /tmp/r2-image-put.json

          empty_digest="$(printf '' | sha256sum | awk '{print $1}')"
          timestamp="$(date +%s)"
          signature="$(R2_METHOD="GET" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$empty_digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["R2_GATEWAY_SIGNING_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          get_status="$(curl --connect-timeout 8 --max-time 20 -sS -o /tmp/r2-smoke-read.jpg -w '%{http_code}' \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $empty_digest" \
            -H "x-r2-signature: $signature" \
            "$base/_r2/$key" || true)"
          test "$get_status" = "200"
          test "$(sha256sum /tmp/r2-smoke-read.jpg | awk '{print $1}')" = "$digest"

          timestamp="$(date +%s)"
          signature="$(R2_METHOD="DELETE" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$empty_digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["R2_GATEWAY_SIGNING_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          delete_status="$(curl --connect-timeout 8 --max-time 20 -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $empty_digest" \
            -H "x-r2-signature: $signature" \
            "$base/_r2/$key" || true)"
          test "$delete_status" = "204"
          echo "Binary JPEG upload, read-back, hash verification, and cleanup succeeded."

      - name: Verify signed public Drive fallback and actual JPEG bytes
        shell: bash
        run: |
          set -euo pipefail
          key="dogs/archive/121/121373.jpg"
          variant="card"
          expires="$(( $(date +%s) + 300 ))"
          signature="$(CCA_PHOTO_KEY="$key" CCA_PHOTO_VARIANT="$variant" CCA_PHOTO_EXPIRY="$expires" python3 -c 'import hashlib,hmac,os; m=chr(10).join(("GET",os.environ["CCA_PHOTO_KEY"],os.environ["CCA_PHOTO_VARIANT"],os.environ["CCA_PHOTO_EXPIRY"])); print(hmac.new(os.environ["R2_GATEWAY_SIGNING_KEY"].encode(),m.encode(),hashlib.sha256).hexdigest())')"
          url="https://media.canecorsoancestry.com/_thumb/$key?variant=$variant&expires=$expires&signature=$signature"
          code="$(curl --connect-timeout 8 --max-time 30 -sS -D /tmp/cca-drive-redirect-headers -o /dev/null -w '%{http_code}' "$url")"
          test "$code" = "302" || { echo "::error::Signed archive fallback should redirect, got HTTP $code"; exit 1; }
          grep -qi '^location: https://drive.google.com/uc?export=download&id=' /tmp/cca-drive-redirect-headers
          code="$(curl -L --connect-timeout 8 --max-time 40 -sS -o /tmp/cca-drive-live-photo -w '%{http_code}' "$url")"
          test "$code" = "200"
          python3 - <<'PY'
          from pathlib import Path
          b=Path("/tmp/cca-drive-live-photo").read_bytes()
          assert len(b)>500 and b.startswith(bytes.fromhex("ffd8ff")), "Drive did not return a JPEG"
          print(f"PASS: signed archive photo visible on live CDN ({len(b)} real JPEG bytes)")
          PY
          bad="https://media.canecorsoancestry.com/_thumb/$key?variant=$variant&expires=$expires&signature=00000000"
          code="$(curl --connect-timeout 8 --max-time 25 -sS -o /dev/null -w '%{http_code}' "$bad")"
          test "$code" = "403" || { echo "::error::Unsigned photo access not blocked ($code)"; exit 1; }

      - name: Verify live signed Bellissimo fallback and original WebP bytes
        shell: bash
        run: |
          set -euo pipefail
          key="dogs/bellissimo/karma-custodi-nos.webp"
          variant="card"
          expires="$(( $(date +%s) + 300 ))"
          signature="$(CCA_PHOTO_KEY="$key" CCA_PHOTO_VARIANT="$variant" CCA_PHOTO_EXPIRY="$expires" python3 -c 'import hashlib,hmac,os; m=chr(10).join(("GET",os.environ["CCA_PHOTO_KEY"],os.environ["CCA_PHOTO_VARIANT"],os.environ["CCA_PHOTO_EXPIRY"])); print(hmac.new(os.environ["R2_GATEWAY_SIGNING_KEY"].encode(),m.encode(),hashlib.sha256).hexdigest())')"
          url="https://media.canecorsoancestry.com/_thumb/$key?variant=$variant&expires=$expires&signature=$signature"
          first="$(curl --connect-timeout 8 --max-time 25 -sS -D /tmp/cca-bellissimo-headers -o /dev/null -w '%{http_code}' "$url")"
          test "$first" = "302"
          grep -qi '^location: https://raw.githubusercontent.com/eghosa001/bellissimo-geni-cane-corso/' /tmp/cca-bellissimo-headers
          code="$(curl -L --connect-timeout 8 --max-time 35 -sS -o /tmp/cca-bellissimo-photo -w '%{http_code}' "$url")"
          test "$code" = "200"
          python3 - <<'PY'
          from pathlib import Path
          b=Path("/tmp/cca-bellissimo-photo").read_bytes()
          assert b[:4] == b"RIFF" and b[8:12] == b"WEBP" and len(b) > 1000
          print(f"PASS: live Bellissimo photo HTTP 200, original WebP ({len(b)} bytes)")
          PY

      - name: Clean temporary files
        if: always()
        run: rm -f /tmp/r2-secrets.json /tmp/r2-health.json /tmp/r2-denied.txt /tmp/r2-put.json /tmp/r2-image-put.json /tmp/r2-smoke.jpg /tmp/r2-smoke-read.jpg
