name: Cloudflare R2 media gateway

on:
  pull_request:
    paths:
      - "src/r2-media.js"
      - "wrangler.r2.toml"
      - "scripts/test_r2_media_policy.mjs"
      - ".github/workflows/cloudflare-media.yml"
  push:
    branches: [main]
    paths:
      - "src/r2-media.js"
      - "wrangler.r2.toml"
      - "scripts/test_r2_media_policy.mjs"
      - ".github/workflows/cloudflare-media.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-r2-media
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker JavaScript
        run: node --check src/r2-media.js
      - name: Test R2 source URL policy
        run: node scripts/test_r2_media_policy.mjs
      - name: Validate Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.r2.toml

  deploy-r2:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 19a03bec57c0277e01e1e70e241576af
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Ensure R2 bucket exists
        run: |
          npx --yes wrangler@4 r2 bucket info canecorsoancestry-media >/dev/null 2>&1 ||             npx --yes wrangler@4 r2 bucket create canecorsoancestry-media

      - name: Build Worker secret file
        run: |
          python -c 'import json, os; open("/tmp/r2-secrets.json", "w", encoding="utf-8").write(json.dumps({"DJANGO_SECRET_KEY": os.environ["DJANGO_SECRET_KEY"]}))'

      - name: Deploy R2 media gateway
        run: |
          npx --yes wrangler@4 deploy             --config wrangler.r2.toml             --secrets-file /tmp/r2-secrets.json

      - name: Verify R2 media gateway
        shell: bash
        run: |
          base="https://canecorsoancestry-edge.aighewieghosa111.workers.dev"

          for attempt in $(seq 1 12); do
            status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/r2-health.json -w '%{http_code}' "$base/healthz/" || true)"
            if [ "$status" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/r2-health.json; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              cat /tmp/r2-health.json 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          unsigned_status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/r2-denied.txt -w '%{http_code}' "$base/_r2/unauthorized-check" || true)"
          if [ "$unsigned_status" != "403" ]; then
            echo "::error::Unsigned R2 gateway request was not rejected; HTTP $unsigned_status"
            exit 1
          fi

          echo "R2 media gateway is healthy and private."

      - name: Verify representative R2 dog images
        shell: bash
        run: |
          set -euo pipefail
          base="https://canecorsoancestry-edge.aighewieghosa111.workers.dev"
          empty_digest="$(printf '' | sha256sum | awk '{print $1}')"
          for key in "dogs/bellissimo/karma-custodi-nos.webp" "dogs/archive/111/111524.jpg" "dogs/archive/026/26098.jpg" "dogs/archive/014/14125.jpg"; do
            timestamp="$(date +%s)"
            signature="$(R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$empty_digest" python -c 'import hashlib,hmac,os; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["DJANGO_SECRET_KEY"].encode(), chr(10).join(["HEAD", k, t, d]).encode(), hashlib.sha256).hexdigest())')"
            status="$(curl --connect-timeout 8 --max-time 20 -sS -o /dev/null -w '%{http_code}' -X HEAD \
              -H "x-r2-timestamp: $timestamp" \
              -H "x-r2-content-sha256: $empty_digest" \
              -H "x-r2-signature: $signature" \
              "$base/_r2/$key" || true)"
            echo "$key -> HTTP $status"
            if [ "$status" != "200" ]; then
              echo "::error::Representative R2 object is unavailable: $key (HTTP $status)"
              exit 1
            fi
          done

      - name: Verify R2 upload round trip
        shell: bash
        run: |
          set -euo pipefail
          base="https://canecorsoancestry-edge.aighewieghosa111.workers.dev"
          key="smoke/uploads/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          body="cca-r2-write-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          digest="$(printf '%s' "$body" | sha256sum | awk '{print $1}')"
          timestamp="$(date +%s)"
          signature="$(R2_METHOD="PUT" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["DJANGO_SECRET_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          put_status="$(curl --connect-timeout 8 --max-time 30 -sS -o /tmp/r2-put.json -w '%{http_code}' -X PUT \
            -H "content-type: text/plain" \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $digest" \
            -H "x-r2-signature: $signature" \
            --data-binary "$body" "$base/_r2/$key" || true)"
          if [ "$put_status" != "201" ] ||
             ! grep -q '"r2_verified"[[:space:]]*:[[:space:]]*true' /tmp/r2-put.json; then
            echo "::error::Signed R2 upload was not verified by the gateway; HTTP $put_status"
            cat /tmp/r2-put.json 2>/dev/null || true
            exit 1
          fi

          empty_digest="$(printf '' | sha256sum | awk '{print $1}')"
          timestamp="$(date +%s)"
          signature="$(R2_METHOD="HEAD" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$empty_digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["DJANGO_SECRET_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          head_status="$(curl --connect-timeout 8 --max-time 20 -sS -o /dev/null -w '%{http_code}' -X HEAD \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $empty_digest" \
            -H "x-r2-signature: $signature" \
            "$base/_r2/$key" || true)"
          if [ "$head_status" != "200" ]; then
            echo "::error::Uploaded R2 object could not be read back; HTTP $head_status"
            exit 1
          fi

          timestamp="$(date +%s)"
          signature="$(R2_METHOD="DELETE" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$empty_digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["DJANGO_SECRET_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          delete_status="$(curl --connect-timeout 8 --max-time 20 -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $empty_digest" \
            -H "x-r2-signature: $signature" \
            "$base/_r2/$key" || true)"
          if [ "$delete_status" != "204" ]; then
            echo "::error::R2 smoke object cleanup failed; HTTP $delete_status"
            exit 1
          fi
          echo "Signed R2 upload, verification, and cleanup all succeeded."

      - name: Verify binary image upload round trip
        shell: bash
        run: |
          set -euo pipefail
          base="https://canecorsoancestry-edge.aighewieghosa111.workers.dev"
          key="smoke/uploads/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jpg"
          python - <<'PY'
          import base64
          from pathlib import Path
          payload = (
              "/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////"
              "2wBDAf//////////////////////////////////////////////////////////////////////////////////////"
              "wAARCAABAAEDASIAAhEBAxEB/8QAFQABAQAAAAAAAAAAAAAAAAAAAAX/xAAUEAEAAAAAAAAAAAAAAAAAAAAA/"
              "9oADAMBAAIQAxAAAAF//8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABBQJ//8QAFBEBAAAAAAAAAAAAA"
              "AAAAAAAAP/aAAgBAwEBPwF//8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAgBAgEBPwF//8QAFBABAAAAAAAAA"
              "AAAAAAAAAAAAP/aAAgBAQAGPwJ//8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPyF//9oADAMBAAIAA"
              "wAAABAf/8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAAgBAwEBPxB//8QAFBEBAAAAAAAAAAAAAAAAAAAAAP/aAA"
              "gBAgEBPxB//8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxB//9k="
          )
          Path("/tmp/r2-smoke.jpg").write_bytes(base64.b64decode(payload))
          PY
          digest="$(sha256sum /tmp/r2-smoke.jpg | awk '{print $1}')"
          timestamp="$(date +%s)"
          signature="$(R2_METHOD="PUT" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["DJANGO_SECRET_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          put_status="$(curl --connect-timeout 8 --max-time 30 -sS -o /tmp/r2-image-put.json -w '%{http_code}' -X PUT \
            -H "content-type: image/jpeg" \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $digest" \
            -H "x-r2-signature: $signature" \
            --data-binary @/tmp/r2-smoke.jpg "$base/_r2/$key" || true)"
          test "$put_status" = "201"
          grep -q '"r2_verified"[[:space:]]*:[[:space:]]*true' /tmp/r2-image-put.json

          empty_digest="$(printf '' | sha256sum | awk '{print $1}')"
          timestamp="$(date +%s)"
          signature="$(R2_METHOD="GET" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$empty_digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["DJANGO_SECRET_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          get_status="$(curl --connect-timeout 8 --max-time 20 -sS -o /tmp/r2-smoke-read.jpg -w '%{http_code}' \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $empty_digest" \
            -H "x-r2-signature: $signature" \
            "$base/_r2/$key" || true)"
          test "$get_status" = "200"
          test "$(sha256sum /tmp/r2-smoke-read.jpg | awk '{print $1}')" = "$digest"

          timestamp="$(date +%s)"
          signature="$(R2_METHOD="DELETE" R2_KEY="$key" R2_TS="$timestamp" R2_DIGEST="$empty_digest" python -c 'import hashlib,hmac,os; m=os.environ["R2_METHOD"]; k=os.environ["R2_KEY"]; t=os.environ["R2_TS"]; d=os.environ["R2_DIGEST"]; print(hmac.new(os.environ["DJANGO_SECRET_KEY"].encode(), chr(10).join([m,k,t,d]).encode(), hashlib.sha256).hexdigest())')"
          delete_status="$(curl --connect-timeout 8 --max-time 20 -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "x-r2-timestamp: $timestamp" \
            -H "x-r2-content-sha256: $empty_digest" \
            -H "x-r2-signature: $signature" \
            "$base/_r2/$key" || true)"
          test "$delete_status" = "204"
          echo "Binary JPEG upload, read-back, hash verification, and cleanup succeeded."

      - name: Clean temporary files
        if: always()
        run: rm -f /tmp/r2-secrets.json /tmp/r2-health.json /tmp/r2-denied.txt /tmp/r2-put.json /tmp/r2-image-put.json /tmp/r2-smoke.jpg /tmp/r2-smoke-read.jpg
