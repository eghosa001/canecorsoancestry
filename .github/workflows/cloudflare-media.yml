name: Cloudflare edge and R2 gateway

on:
  push:
    branches: [main]
    paths:
      - "src/edge.js"
      - "wrangler.edge.preview.toml"
      - "scripts/build_cloudflare_assets.py"
      - "core/static/**"
      - "templates/**"
      - "package.json"
      - ".github/workflows/cloudflare-media.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Edge deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  deploy-edge:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      RENDER_ORIGIN: ${{ vars.RENDER_ORIGIN || 'https://canecorsoancestry.onrender.com' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r requirements.txt
      - run: npm install

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Choose deployment target
        shell: bash
        run: |
          production_requested=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target }}" = "production" ]; then
            production_requested=1
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ contains(github.event.head_commit.message, '[production-cutover]') }}" = "true" ]; then
            production_requested=1
          fi

          if [ "$production_requested" = "1" ]; then
            if [ -z "$RENDER_ORIGIN" ]; then
              echo "::error::A Render origin is required for production."
              exit 1
            fi
            case "$RENDER_ORIGIN" in
              https://*.onrender.com) ;;
              *)
                echo "::error::RENDER_ORIGIN must be the HTTPS Render origin, for example https://canecorsoancestry.onrender.com"
                exit 1
                ;;
            esac
            echo "EDGE_CONFIG=wrangler.edge.production.toml" >> "$GITHUB_ENV"
            echo "APP_ORIGIN=$RENDER_ORIGIN" >> "$GITHUB_ENV"
            echo "EDGE_VERIFY_URL=https://canecorsoancestry.com/healthz/" >> "$GITHUB_ENV"
            echo "EDGE_TARGET=production" >> "$GITHUB_ENV"
          else
            echo "EDGE_CONFIG=wrangler.edge.preview.toml" >> "$GITHUB_ENV"
            echo "APP_ORIGIN=${RENDER_ORIGIN:-https://example.invalid}" >> "$GITHUB_ENV"
            echo "EDGE_VERIFY_URL=https://canecorsoancestry-edge-preview.aighewieghosa111.workers.dev/" >> "$GITHUB_ENV"
            echo "EDGE_TARGET=preview" >> "$GITHUB_ENV"
          fi

      - name: Discover Cloudflare account
        shell: bash
        run: |
          response="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          account_id="$(
            printf '%s' "$response" |
              python scripts/find_cloudflare_account.py
          )"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Build static asset bundle
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          python manage.py collectstatic --noinput
          python scripts/build_cloudflare_assets.py

      - name: Ensure R2 bucket exists
        shell: bash
        run: |
          npx wrangler r2 bucket info canecorsoancestry-media >/dev/null 2>&1 || \
            npx wrangler r2 bucket create canecorsoancestry-media

      - name: Build Worker secret file
        run: |
          python -c 'import json, os; open("/tmp/edge-secrets.json", "w", encoding="utf-8").write(json.dumps({"DJANGO_SECRET_KEY": os.environ["DJANGO_SECRET_KEY"]}))'

      - name: Deploy Cloudflare edge
        shell: bash
        run: |
          npx wrangler deploy \
            --config "$EDGE_CONFIG" \
            --var "APP_ORIGIN:$APP_ORIGIN" \
            --secrets-file /tmp/edge-secrets.json

      - name: Attach production Worker domains
        shell: bash
        run: |
          if [ "$EDGE_TARGET" != "production" ]; then
            echo "Skipping production domain attachment for preview deployment."
            exit 0
          fi

          set -euo pipefail

          attach_domain() {
            hostname="$1"
            body="$(jq -n \
              --arg hostname "$hostname" \
              --arg service "canecorsoancestry-edge" \
              --arg zone_name "canecorsoancestry.com" \
              '{hostname:$hostname,service:$service,zone_name:$zone_name}')"

            response="$(curl --silent --show-error --fail-with-body \
              --request PUT \
              --url "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$body")"

            success="$(printf '%s' "$response" | jq -r '.success // false')"
            if [ "$success" != "true" ]; then
              printf '%s\n' "$response"
              echo "::error::Failed to attach Worker domain: $hostname"
              exit 1
            fi

            printf '%s' "$response" | jq -r '.result | "Attached \(.hostname) to \(.service) in zone \(.zone_name)"'
          }

          attach_domain canecorsoancestry.com
          attach_domain www.canecorsoancestry.com

      - name: Verify edge
        shell: bash
        run: |
          if [ "$EDGE_TARGET" = "production" ]; then
            for attempt in $(seq 1 12); do
              status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/edge-health.json -w '%{http_code}' "$EDGE_VERIFY_URL" || true)"
              if [ "$status" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/edge-health.json; then
                echo "Production Cloudflare edge health check passed."
                exit 0
              fi
              echo "Edge health attempt $attempt returned HTTP $status."
              sleep 5
            done
            cat /tmp/edge-health.json 2>/dev/null || true
            exit 1
          fi

          status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/edge-preview.txt -w '%{http_code}' "$EDGE_VERIFY_URL" || true)"
          if [ "$status" = "000" ]; then
            echo "::error::Cloudflare preview Worker was not reachable."
            exit 1
          fi
          echo "Cloudflare preview Worker reachable (HTTP $status)."

      - name: Verify Render origin gate
        shell: bash
        run: |
          if [ "$EDGE_TARGET" != "production" ]; then
            echo "Skipping Render origin-gate verification for preview deployment."
            exit 0
          fi
          status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/origin-gate.txt -w '%{http_code}' "$RENDER_ORIGIN/" || true)"
          if [ "$status" != "403" ]; then
            echo "::error::Direct Render application traffic was not blocked; received HTTP $status."
            cat /tmp/origin-gate.txt 2>/dev/null || true
            exit 1
          fi
          echo "Direct Render application traffic is correctly gated behind Cloudflare."

      - name: Clean temporary files
        if: always()
        run: rm -f /tmp/edge-secrets.json /tmp/edge-health.json /tmp/edge-preview.txt /tmp/origin-gate.txt
