name: Oracle prepare database migration freeze (safe)
on:
  pull_request:
    paths:
      - "scripts/oracle_runner/oracle_middleware.py"
      - "scripts/oracle_runner/oracle_settings.py"
      - "scripts/oracle_runner/stage_django.sh"
      - "scripts/tests/test_oracle_migration_freeze.py"
      - ".github/workflows/oracle-prepare-db-freeze.yml"
  push:
    branches: [main]
    paths:
      - "scripts/oracle_runner/oracle_middleware.py"
permissions:
  contents: read
concurrency:
  group: oracle-django-stage-refs/heads/main
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n scripts/oracle_runner/stage_django.sh
          python3 -m pip install -q -r requirements.txt
          python3 manage.py test scripts.tests.test_oracle_migration_freeze --noinput
          python3 scripts/fast_path_guard.py
  prepare:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'eghosa001/canecorsoancestry'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 40
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare maintenance flag mount without enabling it
        shell: bash
        run: |
          if sudo -n test -e /etc/cca/oracle-db-mode; then
            echo "::error::Already migrated local; refusing Supabase preparation"
            exit 1
          fi
          sudo -n test ! -e /var/lib/cca/control/maintenance.flag
          bash scripts/oracle_runner/apply_oracle_capacity_tune.sh
          sudo -n podman inspect cca-oracle-staging --format '{{json .Mounts}}' | grep -q '"/run/cca"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 \
            https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev/accounts/login/)" = 200
          echo "PASS: Updated Django has freeze support but production still uses Supabase."
