name: Oracle repo-only runner

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/oracle_runner/**"
      - ".github/workflows/oracle-repo-only-runner.yml"

permissions:
  contents: read

jobs:
  script-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check Oracle enrollment script syntax
        run: bash -n scripts/oracle_runner/transfer_repo_runner.sh

  cca-oracle:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'eghosa001/canecorsoancestry' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 4
    steps:
      - name: Verify authorized repository and VM
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "eghosa001/canecorsoancestry"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(uname -m)" = aarch64
          echo "PASS: runner executing exclusively from authorized CCA/main workflow."
          echo "CPU count: $(nproc)"
          free -h
          df -h /
          echo "This job is read-only. It does not deploy Django or change firewall rules."
