name: Full release audit

on:
  pull_request:
    paths:
      - "accounts/**"
      - "config/**"
      - "core/**"
      - "pedigrees/**"
      - "registry/**"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
      - "src/site-edge.js"
      - "scripts/test_site_edge_cache.mjs"
      - ".github/workflows/release-audit.yml"
  push:
    branches: [main]
    paths:
      - "accounts/**"
      - "config/**"
      - "core/**"
      - "pedigrees/**"
      - "registry/**"
      - "manage.py"
      - "requirements.txt"
      - "Dockerfile"
      - "src/site-edge.js"
      - "scripts/test_site_edge_cache.mjs"
      - ".github/workflows/release-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-sqlite:
    name: Full Django suite (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Framework and migration checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m compileall -q accounts config core pedigrees registry

      - name: Full test suite
        run: python manage.py test --verbosity 1

      - name: Static build check
        run: python manage.py collectstatic --noinput

      - name: Production settings check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-release-audit-secret-key-that-is-long-and-not-used-anywhere-real-2026
          DATABASE_URL: sqlite:////tmp/cca-release-audit.sqlite3
          DJANGO_ALLOWED_HOSTS: audit.invalid
          DJANGO_CSRF_TRUSTED_ORIGINS: https://audit.invalid
          ACCOUNT_EMAIL_ENABLED: "0"
          DJANGO_EMAIL_BACKEND: django.core.mail.backends.dummy.EmailBackend
        run: python manage.py check --deploy

  django-postgres:
    name: Full Django suite (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canecorso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d canecorso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/canecorso
      DJANGO_DB_CONN_MAX_AGE: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: PostgreSQL migration check
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Full PostgreSQL test suite
        run: python manage.py test --verbosity 1

  security-and-edge:
    name: Dependencies and Cloudflare edge
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pip-audit>=2.9,<3"
          pip-audit -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate site edge
        run: |
          node --check src/site-edge.js
          node scripts/test_site_edge_cache.mjs
