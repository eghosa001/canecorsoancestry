name: Oracle Django production release (CI-gated)

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Update Oracle Django container (live restart if Oracle serves production); no traffic cutover"
        required: true
        type: choice
        options: [stage-only]
  workflow_run:
    workflows: ["Full release audit"]
    types: [completed]
  pull_request:
    paths:
      - "scripts/oracle_runner/oracle_middleware.py"
      - "scripts/oracle_runner/oracle_settings.py"
      - "scripts/tests/test_oracle_origin.py"
      - "scripts/tests/test_oracle_migration_freeze.py"
      - "scripts/oracle_runner/stage_django.sh"
      - "scripts/oracle_runner/allowlisted_schema_migration.py"
      - "scripts/tests/test_oracle_schema_allowlist.py"
      - ".github/workflows/oracle-stage-django.yml"

permissions:
  contents: read

concurrency:
  group: oracle-django-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Focused Oracle script/security and owner CI policy checks
        run: |
          bash -n scripts/oracle_runner/stage_django.sh
          python3 scripts/fast_path_guard.py
          python3 -m pip install -q -r requirements.txt
          python3 manage.py test scripts.tests.test_oracle_origin scripts.tests.test_oracle_migration_freeze scripts.tests.test_oracle_schema_allowlist --noinput

  oracle-stage:
    if: >-
      github.repository == 'eghosa001/canecorsoancestry' &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deployment == 'stage-only') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push')
      )
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 40
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Only update the current protected main commit
        shell: bash
        run: |
          set -euo pipefail
          selected="$(git rev-parse HEAD)"
          current="$(git ls-remote https://github.com/eghosa001/canecorsoancestry.git refs/heads/main | cut -f1)"
          if [ -z "$current" ] || [ "$selected" != "$current" ]; then
            echo "::warning::A newer main commit exists. Skipping outdated Oracle release."
            echo "CCA_SKIP_RELEASE=1" >> "$GITHUB_ENV"
          else
            echo "Verified protected main release: $selected"
          fi
      - name: Update and verify Oracle Django container; do not change Cloudflare routing
        if: env.CCA_SKIP_RELEASE != '1'
        shell: bash
        run: bash scripts/oracle_runner/stage_django.sh
