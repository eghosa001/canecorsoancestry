name: Probe CaneCorso source image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-canecorso-source-image.yml"
      - "src/r2-media.js"
      - "src/bellissimo-source-map.js"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public source and owner Drive archive
        shell: bash
        run: |
          set -u
          for item in             "source|https://www.canecorsopedigree.com/static/images/animal/thumbnails/img4ba604e9286da.jpg_400.jpeg"             "drive|https://drive.google.com/uc?export=download&id=1Fx8EfP_JQj6SBAKMLnzK47IDp7daX6ci"             "r2health|https://media.canecorsoancestry.com/healthz/"             "site|https://canecorsoancestry.com/healthz/"; do
            kind="${item%%|*}"
            url="${item#*|}"
            code="$(curl -L -sS --connect-timeout 5 --max-time 20               -A 'Mozilla/5.0 CaneCorsoAncestry-Recovery/1.0'               -H 'Referer: https://www.canecorsopedigree.com/'               -o /tmp/cca-probe-body -D /tmp/cca-probe-headers               -w '%{http_code}' "$url" || true)"
            mime="$(grep -i '^content-type:' /tmp/cca-probe-headers 2>/dev/null | tail -1 | tr -d '\r' | cut -c 1-100)"
            size="$(wc -c </tmp/cca-probe-body 2>/dev/null || echo 0)"
            echo "$kind HTTP=$code $mime bytes=$size"
          done

      - name: Verify actual homepage and dog-directory photos after emergency repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import html
          import re
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          HEADERS = {"User-Agent": "Mozilla/5.0 (CCA-Real-Photo-Smoke/1.0)"}
          urls = {}
          for page in ("/", "/dogs/"):
              request=Request("https://canecorsoancestry.com" + page, headers=HEADERS)
              with urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise SystemExit(f"Page {page} HTTP {response.status}")
                  source = response.read().decode("utf-8")
              links = list(dict.fromkeys(html.unescape(x) for x in re.findall(
                  r'https://media\.canecorsoancestry\.com/_thumb/[^"<> ]+', source
              )))
              print(f"Signed public dog images on {page}: {len(links)}", flush=True)
              for link in links[:16]:
                  urls[link] = urlsplit(link).path

          if not urls:
              raise SystemExit("No dog-photo links found in public rendered HTML")

          def check(item):
              link, path = item
              try:
                  with urlopen(Request(link, headers=HEADERS), timeout=25) as response:
                      content_type = response.headers.get("content-type", "").split(";", 1)[0]
                      payload = response.read(512)
                      good = (response.status == 200 and content_type.startswith("image/") and
                              (payload.startswith(b"\xff\xd8\xff") or
                               payload.startswith(b"\x89PNG\r\n\x1a\n") or
                               payload[:4] == b"RIFF"))
                      return (path, response.status, content_type, good)
              except HTTPError as e:
                  return (path, e.code, "", False)
              except Exception as e:
                  return (path, type(e).__name__, "", False)

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results=list(pool.map(check, urls.items()))
          for path, status, ct, good in results:
              print(f"{'PASS' if good else 'FAIL'} {path} HTTP={status} {ct}", flush=True)
          print(f"VERIFIED {sum(x[3] for x in results)}/{len(results)} real public images", flush=True)
          if any(not x[3] for x in results):
              raise SystemExit("Some public dog photographs are still not accessible")
          PY

      - name: Check missing-upload dog cards for alternate photo of the same dog
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import re
          from urllib.request import urlopen, Request
          from urllib.parse import urlsplit
          failed=[
              "WhatsApp_Image_2026-10-15_at_8.08.53_PM.jpg",
              "IMG_1946.jpg",
              "IMG_0347.jpeg",
              "IMG_5093.jpg",
              "IMG_1956.jpg",
              "IMG_5235.jpg",
          ]
          url="https://canecorsoancestry.com/dogs/"
          with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=25) as r:
              content=html.unescape(r.read().decode())
          for name in failed:
              at=content.find(name)
              if at<0:
                  print(f"{name}: not on directory page",flush=True)
                  continue
              beg=max(content.rfind("<article",0,at),content.rfind("<li ",0,at),at-700)
              end=min(len(content),at+1300)
              excerpt=content[beg:end]
              images=re.findall(r'/_thumb/(dogs/[^?"<> ]+)',excerpt)
              links=re.findall(r'href="(/dogs/[^"#? ]+)',excerpt)
              alt=re.findall(r'alt="([^"]+)"',excerpt)
              print(f"{name}: public_page_links={list(dict.fromkeys(links))[:4]} "
                    f"image_keys={list(dict.fromkeys(images))[:5]} "
                    f"alt={alt[:3]}",flush=True)
          PY
