name: Probe CaneCorso source image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-canecorso-source-image.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public source and owner Drive archive
        shell: bash
        run: |
          set -u
          for item in             "source|https://www.canecorsopedigree.com/static/images/animal/thumbnails/img4ba604e9286da.jpg_400.jpeg"             "drive|https://drive.google.com/uc?export=download&id=1Fx8EfP_JQj6SBAKMLnzK47IDp7daX6ci"             "r2health|https://media.canecorsoancestry.com/healthz/"             "site|https://canecorsoancestry.com/healthz/"; do
            kind="${item%%|*}"
            url="${item#*|}"
            code="$(curl -L -sS --connect-timeout 5 --max-time 20               -A 'Mozilla/5.0 CaneCorsoAncestry-Recovery/1.0'               -H 'Referer: https://www.canecorsopedigree.com/'               -o /tmp/cca-probe-body -D /tmp/cca-probe-headers               -w '%{http_code}' "$url" || true)"
            mime="$(grep -i '^content-type:' /tmp/cca-probe-headers 2>/dev/null | tail -1 | tr -d '\r' | cut -c 1-100)"
            size="$(wc -c </tmp/cca-probe-body 2>/dev/null || echo 0)"
            echo "$kind HTTP=$code $mime bytes=$size"
          done

      - name: Diagnose first real public dog photo without revealing signed URL
        shell: bash
        run: |
          set -euo pipefail
          curl -L --connect-timeout 8 --max-time 30 -sS \
            https://canecorsoancestry.com/ -o /tmp/cca-home.html
          python3 - <<'PY'
          import re,html,urllib.request,urllib.error
          source=open("/tmp/cca-home.html",encoding="utf-8").read()
          matches=list(dict.fromkeys(html.unescape(x) for x in re.findall(
            r'https://media\.canecorsoancestry\.com/_thumb/[^"<> ]+',source
          )))
          print("Found signed gallery images:",len(matches))
          for link in matches[:3]:
              try:
                  req=urllib.request.Request(link,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      print("real-photo HTTP",r.status,"content-type",r.headers.get("content-type"),
                            "x-fallback",r.headers.get("x-cca-image-fallback-reason",""),
                            "content-bytes",len(r.read(200000)))
              except urllib.error.HTTPError as e:
                  print("real-photo HTTP",e.code,"x-fallback",
                        e.headers.get("x-cca-image-fallback-reason",""))
              except Exception as e:
                  print("real-photo failure",type(e).__name__)
          PY
