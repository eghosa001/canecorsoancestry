name: Sync Bellissimo media to R2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/seeds/bellissimo-media.json"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 19a03bec57c0277e01e1e70e241576af
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - name: Checkout ancestry app
        uses: actions/checkout@v4

      - name: Checkout pinned Bellissimo media source
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/eghosa001/bellissimo-geni-cane-corso.git source-bellissimo
          git -C source-bellissimo fetch --depth 1 origin 3addd1b186a62bf2040c02980ab0eaa0aad801a7
          git -C source-bellissimo checkout --detach FETCH_HEAD
          test "$(git -C source-bellissimo rev-parse HEAD)" = "3addd1b186a62bf2040c02980ab0eaa0aad801a7"

      - name: Reconstruct verified Himera photographs
        shell: bash
        run: |
          cat source-bellissimo/.github/assets/rocco-bellissimo-geni-avif.b64.part* | tr -d '\n\r' | base64 --decode > source-bellissimo/assets/dogs/himera-custodi-nos-main.avif
          cat source-bellissimo/.github/assets/diesel-bellissimo-geni-avif.b64.part* | tr -d '\n\r' | base64 --decode > source-bellissimo/assets/dogs/himera-custodi-nos-02.avif
          test "$(wc -c < source-bellissimo/assets/dogs/himera-custodi-nos-main.avif)" -eq 29114
          test "$(wc -c < source-bellissimo/assets/dogs/himera-custodi-nos-02.avif)" -eq 19520

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN SUPABASE_DATABASE_URL DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - run: pip install -r requirements.txt

      - name: Discover reachable Supabase session pooler
        shell: bash
        run: |
          target_url="$(python scripts/discover_supabase_session_pooler.py)"
          echo "::add-mask::$target_url"
          echo "DATABASE_URL=$target_url" >> "$GITHUB_ENV"


      - name: Ensure media bucket exists
        run: |
          npx --yes wrangler@latest r2 bucket info canecorsoancestry-media >/dev/null 2>&1 || \
            npx --yes wrangler@latest r2 bucket create canecorsoancestry-media

      - name: Build media upload list
        shell: bash
        run: |
          python - <<'PY' > /tmp/bellissimo-media.tsv
          import json
          import mimetypes
          from pathlib import Path

          manifest = json.loads(Path("data/seeds/bellissimo-media.json").read_text())
          for item in manifest["items"]:
              content_type = mimetypes.guess_type(item["source_path"])[0] or "application/octet-stream"
              print(
                  item["source_path"],
                  item["r2_key"],
                  content_type,
                  sep="\t",
              )
          PY

      - name: Upload and byte-verify R2 objects
        shell: bash
        run: |
          mkdir -p /tmp/r2-verify
          count=0
          while IFS=$'\t' read -r source_path r2_key content_type; do
            local_path="source-bellissimo/$source_path"
            if [ ! -f "$local_path" ]; then
              echo "::error::Pinned source file is missing: $source_path"
              exit 1
            fi

            npx --yes wrangler@latest r2 object put \
              "canecorsoancestry-media/$r2_key" \
              --file "$local_path" \
              --content-type "$content_type" \
              --remote \
              --force

            verify_path="/tmp/r2-verify/$count"
            npx --yes wrangler@latest r2 object get \
              "canecorsoancestry-media/$r2_key" \
              --file "$verify_path" \
              --remote

            cmp "$local_path" "$verify_path"
            count=$((count + 1))
          done < /tmp/bellissimo-media.tsv

          if [ "$count" -ne 22 ]; then
            echo "::error::Expected 22 verified media objects, uploaded $count."
            exit 1
          fi
          echo "Verified $count R2 media objects byte-for-byte."

      - name: Dry-run media database import
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          DJANGO_ALLOWED_HOSTS: canecorsoancestry.onrender.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry.onrender.com
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: DATABASE_URL="$DATABASE_URL" python manage.py import_bellissimo_media --dry-run

      - name: Attach R2 media to canonical dogs
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          DJANGO_ALLOWED_HOSTS: canecorsoancestry.onrender.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry.onrender.com
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: DATABASE_URL="$DATABASE_URL" python manage.py import_bellissimo_media

      - name: Verify DogImage rows
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_DB_EXTRA_SCHEMAS: extensions,public
          DJANGO_ALLOWED_HOSTS: canecorsoancestry.onrender.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry.onrender.com
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        shell: bash
        run: |
          DATABASE_URL="$DATABASE_URL" python manage.py shell -c "
          from registry.models import DogImage
          qs = DogImage.objects.filter(image__startswith='dogs/bellissimo/')
          primary = qs.filter(is_primary=True)
          assert qs.count() == 22, f'Expected 22 Bellissimo DogImage rows, got {qs.count()}'
          assert primary.count() == 14, f'Expected 14 Bellissimo primary images, got {primary.count()}'
          print(f'Verified: {qs.count()} Bellissimo images; {primary.count()} primary')
          "
