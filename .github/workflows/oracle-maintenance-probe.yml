name: Oracle maintenance probe read-only diagnostics
on:
  pull_request:
    paths:
      - "scripts/oracle_runner/probe_maintenance_500.sh"
      - ".github/workflows/oracle-maintenance-probe.yml"
  push:
    branches: [main]
    paths:
      - "scripts/oracle_runner/probe_maintenance_500.sh"
permissions:
  contents: read
concurrency:
  group: oracle-django-stage-refs/heads/main
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n scripts/oracle_runner/probe_maintenance_500.sh
          python3 scripts/fast_path_guard.py
  probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 5
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/oracle_runner/probe_maintenance_500.sh
