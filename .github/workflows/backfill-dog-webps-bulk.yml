name: Parallel one-time R2 dog photograph WebP backfill

on:
  pull_request:
    paths:
      - "scripts/backfill_r2_dog_webps.py"
      - ".github/workflows/backfill-dog-webps-bulk.yml"
  push:
    branches: [main]
    paths:
      - "scripts/backfill_r2_dog_webps.py"
      - ".github/workflows/backfill-dog-webps-bulk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify pure WebP tests and Python syntax
        run: |
          python -m pip install 'Pillow>=13.0,<14'
          python -m unittest scripts.tests.test_photo_webp_backfill -v
          python -m compileall -q scripts/backfill_r2_dog_webps.py

  repair-sharded:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'eghosa001/canecorsoancestry'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Precompute safe private WebP copies for one disjoint group
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'Pillow>=13.0,<14'
          if [ -z "$DJANGO_SECRET_KEY" ]; then
            echo "::error::Missing signing secret; refusing source access."
            exit 1
          fi
          python scripts/backfill_r2_dog_webps.py \
            --max-scan 8000 --limit 1200 \
            --shard-count 8 --shard-index ${{ matrix.shard }} --workers 3
