name: Render and Cloudflare build check

on:
  pull_request:
    paths:
      - "render.yaml"
      - "config/settings/render.py"
      - "config/settings/production.py"
      - "core/middleware.py"
      - "core/r2_gateway_storage.py"
      - "core/cloudflare_media.py"
      - "core/media_views.py"
      - "src/edge.js"
      - "wrangler.edge.*.toml"
      - "package.json"
      - "requirements.txt"
      - "scripts/build_cloudflare_assets.py"
      - ".github/workflows/cloudflare-media.yml"
      - ".github/workflows/render-edge-build.yml"
      - "core/static/**"
      - "templates/**"
      - "accounts/templates/**"
      - "registry/templates/**"
      - "pedigrees/templates/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r requirements.txt
      - run: npm install

      - name: Check Render Django settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.render
          DJANGO_SECRET_KEY: ci-render-secret
          DATABASE_URL: sqlite:///render-edge-check.sqlite3
          DJANGO_ALLOWED_HOSTS: testserver,localhost,.onrender.com,canecorsoancestry.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver,https://canecorsoancestry.com
          SITE_URL: https://canecorsoancestry.com
          REQUIRE_CLOUDFLARE_EDGE: "1"
          R2_GATEWAY_URL: https://edge.example.workers.dev
          MEDIA_EDGE_BASE_URL: https://edge.example.workers.dev
        run: python manage.py check --deploy

      - name: Build Cloudflare static assets
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          python manage.py collectstatic --noinput
          python scripts/build_cloudflare_assets.py

      - name: Validate edge Worker JavaScript
        run: node --check src/edge.js

      - name: Validate Cloudflare preview bundle
        run: npx wrangler deploy --dry-run --config wrangler.edge.preview.toml --var APP_ORIGIN:https://example.onrender.com

      - name: Validate Cloudflare production bundle
        run: npx wrangler deploy --dry-run --config wrangler.edge.production.toml --var APP_ORIGIN:https://example.onrender.com
