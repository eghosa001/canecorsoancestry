name: Oracle read-only public page exception diagnosis

on:
  pull_request:
    paths:
      - ".github/workflows/oracle-public-page-diagnosis.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.repository == 'eghosa001/canecorsoancestry' &&
      github.event.pull_request.head.repo.full_name == 'eghosa001/canecorsoancestry'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 5
    steps:
      - name: Verify public endpoints without credentials
        shell: bash
        run: |
          set -euo pipefail
          for path in "/__edge/health" "/__edge/ready" "/__edge/auth-ready" "/healthz/" "/" "/dogs/" "/accounts/login/"; do
            result="$(curl -sS --connect-timeout 3 --max-time 12 -D /tmp/cca-public-headers -o /tmp/cca-public-body -w '%{http_code}' "https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev$path" || true)"
            echo "public_route=$path status=$result"
            if [[ "$path" == /__edge/* ]]; then head -c 120 /tmp/cca-public-body; echo; fi
            if [ "$result" != "200" ]; then
              grep -Ei "^(server|cf-ray|content-type|x-request-id|cache-control):" /tmp/cca-public-headers | head -10 || true
              head -c 350 /tmp/cca-public-body | tr "\\n" " " || true
              echo
            fi
          done
      - name: Verify Oracle loopback HTTP health and routed page without logging secrets
        shell: bash
        run: |
          set -euo pipefail
          for path in "/healthz/" "/"; do
            code="$(curl -sS --connect-timeout 3 --max-time 12 -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$path" || true)"
            echo "oracle_loopback=$path status=$code"
          done
      - name: Restore production private Cloudflare tunnel and enable boot recovery
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "eghosa001/canecorsoancestry" ]] || exit 2
          [[ "$(uname -m)" == aarch64 ]] || exit 2
          test "$(sudo -n cat /etc/cca/oracle-db-mode)" = local
          sudo -n systemctl is-active --quiet cca-oracle-staging.service
          sudo -n systemctl cat cca-cloudflared-vpc.service >/dev/null
          echo "Before: $(sudo -n systemctl is-active cca-cloudflared-vpc.service || true)"
          echo "Boot enabled before: $(sudo -n systemctl is-enabled cca-cloudflared-vpc.service || true)"
          sudo -n systemctl enable --now cca-cloudflared-vpc.service
          sudo -n systemctl is-active --quiet cca-cloudflared-vpc.service
          sudo -n systemctl is-enabled --quiet cca-cloudflared-vpc.service
          echo "PASS: Production VPC tunnel started and enabled on boot."
          base="https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev"
          ok=0
          for attempt in $(seq 1 30); do
            status="$(curl --connect-timeout 3 --max-time 12 -sS -o /dev/null -w '%{http_code}' "$base/__edge/ready" || true)"
            page="$(curl --connect-timeout 3 --max-time 12 -sS -o /dev/null -w '%{http_code}' "$base/" || true)"
            echo "check=$attempt ready=$status homepage=$page"
            if [ "$status" = 200 ] && [ "$page" = 200 ]; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "::error::Private tunnel started but site still unavailable"; exit 1; }
          echo "PASS: Live Cloudflare homepage HTTP 200 via Oracle private VPC."
      - name: Diagnose Cloudflare Tunnel connector and private transport
        shell: bash
        run: |
          set -euo pipefail
          echo "Tunnel supervision state (no credentials):"
          sudo -n systemctl show cca-cloudflared-vpc.service --property=ActiveState,SubState,UnitFileState,Restart,RestartUSec,Result,ExecMainStatus,ExecMainStartTimestamp,InactiveEnterTimestamp --no-pager || true
          echo "Recent tunnel lifecycle messages (no unit command or environment):"
          sudo -n journalctl -u cca-cloudflared-vpc.service --since "-75 minutes" --no-pager -o cat 2>/dev/null | grep -Ei '(starting|stopping|stopped|exited|active|connected|error|registered|unregistered|disconnected)' | sed -E 's/(token|secret|password|credential|authorization)[=: ][^[:space:]]+/[redacted]/Ig' | tail -25 || true
          echo "Cloudflared process count:"
          pgrep -ca cloudflared || true
          echo "Cloudflare-related systemd unit states:"
          sudo -n systemctl list-units --all --type=service --no-pager --no-legend | grep -Ei '(cloudflared|tunnel|vpc|mesh)' | head -25 || true
          echo "Cloudflare connector versions:"
          command -v cloudflared >/dev/null && cloudflared --version || true
          echo "Tunnel errors from the past 25 minutes (filter credentials):"
          sudo -n journalctl --since "-25 min" --no-pager -o cat -p err --system 2>/dev/null | grep -Ei '(cloudflared|cloudflare tunnel|vpc.service)' | sed -E 's/(token|secret|password|credential|authorization)=?[^[:space:]]+/[redacted]/Ig' | tail -20 || true
      - name: Run read-only in-process Django homepage and directory render with traceback
        shell: bash
        run: |
          sudo -n podman exec -i cca-oracle-staging python - <<'PY'
          import os, traceback, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "scripts.oracle_runner.oracle_settings")
          django.setup()
          from django.test import RequestFactory
          from django.contrib.auth.models import AnonymousUser
          from core.views import home
          from registry.views import dog_search
          factory=RequestFactory()
          for path, view in [("/", home), ("/dogs/", dog_search)]:
              request=factory.get(path, secure=True, HTTP_HOST="canecorsoancestry-site-edge.aighewieghosa111.workers.dev")
              request.user = AnonymousUser()
              print("IN_PROCESS_ROUTE", path, flush=True)
              try:
                  response=view(request)
                  print("IN_PROCESS_STATUS", response.status_code, flush=True)
              except Exception as exc:
                  print("IN_PROCESS_EXCEPTION", type(exc).__name__, str(exc), flush=True)
                  traceback.print_exc()
          PY
          echo "Read-only error diagnosis complete. No application or DB writes."
