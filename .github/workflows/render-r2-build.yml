name: Render and R2 build check

on:
  pull_request:
    paths:
      - "render.yaml"
      - "config/settings/render.py"
      - "config/settings/production.py"
      - "config/settings/development.py"
      - "core/r2_gateway_storage.py"
      - "core/cloudflare_media.py"
      - "core/media_views.py"
      - "src/r2-media.js"
      - "wrangler.r2.toml"
      - "requirements.txt"
      - ".github/workflows/cloudflare-media.yml"
      - ".github/workflows/render-r2-build.yml"
      - "core/static/**"
      - "templates/**"
      - "accounts/templates/**"
      - "registry/templates/**"
      - "pedigrees/templates/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r requirements.txt

      - name: Check Render Django settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.render
          DJANGO_SECRET_KEY: ci-render-secret
          DATABASE_URL: sqlite:///render-check.sqlite3
          DJANGO_ALLOWED_HOSTS: testserver,localhost,.onrender.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver,https://canecorsoancestry.onrender.com
          SITE_URL: https://canecorsoancestry.onrender.com
          R2_GATEWAY_URL: https://edge.example.workers.dev
          MEDIA_EDGE_BASE_URL: https://edge.example.workers.dev
        run: python manage.py check --deploy

      - name: Verify live Render dashboard collectstatic command
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          rm -rf staticfiles
          python manage.py collectstatic --noinput
          test -f staticfiles/staticfiles.json

      - name: Verify Render static files
        env:
          DJANGO_SETTINGS_MODULE: config.settings.render
          DJANGO_SECRET_KEY: ci-render-secret
          DATABASE_URL: sqlite:///render-static-check.sqlite3
          DJANGO_ALLOWED_HOSTS: testserver,localhost,.onrender.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://testserver,https://canecorsoancestry.onrender.com
          SITE_URL: https://canecorsoancestry.onrender.com
          R2_GATEWAY_URL: https://edge.example.workers.dev
          MEDIA_EDGE_BASE_URL: https://edge.example.workers.dev
        run: |
          python manage.py collectstatic --noinput
          python - <<'PY'
          import os
          import django

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.render")
          django.setup()
          from django.contrib.staticfiles.storage import staticfiles_storage

          url = staticfiles_storage.url("core/site.css")
          if not url or "site" not in url:
              raise SystemExit("core/site.css did not resolve through Render static storage.")
          print(f"Resolved core/site.css -> {url}")
          PY

      - name: Validate R2 media Worker JavaScript
        run: node --check src/r2-media.js

      - name: Validate R2 Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.r2.toml
