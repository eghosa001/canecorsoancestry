name: Oracle production cutover / Northflank rollback (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: "Switch to tested Oracle or restore Northflank"
        options: [switch-to-oracle, rollback-to-northflank]
        required: true
  pull_request:
    paths:
      - "scripts/oracle_runner/edge_origin_mode.py"
      - "scripts/oracle_runner/production_cutover.py"
      - "scripts/tests/test_edge_origin_mode.py"
      - ".github/workflows/oracle-production-cutover.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-site-edge
  cancel-in-progress: false

jobs:
  focused-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test origin mode and cutover script syntax
        run: |
          python3 -m py_compile scripts/oracle_runner/production_cutover.py
          python3 -m scripts.oracle_runner.production_cutover --help
          python3 -m unittest scripts.tests.test_edge_origin_mode
          python3 scripts/fast_path_guard.py

  switch:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'eghosa001/canecorsoancestry' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 19a03bec57c0277e01e1e70e241576af
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      CACHE_VERSION: cutover-${{ github.run_id }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Switch origin or rollback, verify all critical routes
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in
            switch-to-oracle) target="oracle";;
            rollback-to-northflank) target="northflank";;
            *) echo "::error::Unsupported operation"; exit 1;;
          esac
          python3 -m scripts.oracle_runner.production_cutover \
            --mode "$target" --cache-version "$CACHE_VERSION"
