name: Cloudflare Worker deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Validate deployment secrets
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_DATABASE_URL DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - run: npm install --global wrangler@latest
      - run: uv sync --all-groups

      - name: Validate Supabase Direct connection
        run: uv run python scripts/validate_supabase_direct_url.py

      - name: Ensure cache-disabled Hyperdrive
        run: |
          name="canecorsoancestry-supabase"
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs?per_page=100"

          response="$(curl -fsS "$endpoint"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          hyperdrive_id="$(
            printf '%s' "$response" |             HD_NAME="$name" python -c '
import json, os, sys
payload = json.load(sys.stdin)
matches = [item["id"] for item in payload.get("result", []) if item.get("name") == os.environ["HD_NAME"]]
print(matches[0] if matches else "")
'
          )"

          if [ -z "$hyperdrive_id" ]; then
            npx wrangler hyperdrive create "$name"               --connection-string="$SUPABASE_DATABASE_URL"               --caching-disabled

            response="$(curl -fsS "$endpoint"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

            hyperdrive_id="$(
              printf '%s' "$response" |               HD_NAME="$name" python -c '
import json, os, sys
payload = json.load(sys.stdin)
matches = [item["id"] for item in payload.get("result", []) if item.get("name") == os.environ["HD_NAME"]]
print(matches[0] if matches else "")
'
            )"
          else
            npx wrangler hyperdrive update "$hyperdrive_id"               --connection-string="$SUPABASE_DATABASE_URL"               --caching-disabled
          fi

          if [ -z "$hyperdrive_id" ]; then
            echo "::error::Hyperdrive could not be created or discovered."
            exit 1
          fi

          echo "CLOUDFLARE_HYPERDRIVE_ID=$hyperdrive_id" >> "$GITHUB_ENV"

      - name: Build Django static assets
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          uv run python manage.py collectstatic --noinput
          uv run python scripts/build_cloudflare_assets.py

      - name: Render Wrangler config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target }}" = "production" ]; then
            template="wrangler.production.toml"
          else
            template="wrangler.preview.toml"
          fi
          uv run python scripts/render_wrangler.py "$template" wrangler.toml

      - name: Remove legacy Railway dependency manifest from Worker bundle
        run: rm requirements.txt

      - name: Ensure media bucket exists
        run: |
          uv run pywrangler r2 bucket create canecorsoancestry-media ||             uv run pywrangler r2 bucket list

      - name: Set Django Worker secret
        run: |
          printf '%s' "$DJANGO_SECRET_KEY" |             uv run pywrangler secret put DJANGO_SECRET_KEY

      - name: Deploy Django Worker
        run: uv run pywrangler deploy
