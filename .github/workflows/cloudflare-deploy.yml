name: Cloudflare Worker deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_HYPERDRIVE_ID }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Validate deployment secrets
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_HYPERDRIVE_ID DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - run: npm install --global wrangler@latest
      - run: uv sync --all-groups

      - name: Build Django static assets
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          uv run python manage.py collectstatic --noinput
          uv run python scripts/build_cloudflare_assets.py

      - name: Render Wrangler config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target }}" = "production" ]; then
            template="wrangler.production.toml"
          else
            template="wrangler.preview.toml"
          fi
          uv run python scripts/render_wrangler.py "$template" wrangler.toml

      - name: Remove legacy Railway dependency manifest from Worker bundle
        run: rm requirements.txt

      - name: Ensure media bucket exists
        run: |
          uv run pywrangler r2 bucket create canecorsoancestry-media ||             uv run pywrangler r2 bucket list

      - name: Set Django Worker secret
        run: |
          printf '%s' "$DJANGO_SECRET_KEY" |             uv run pywrangler secret put DJANGO_SECRET_KEY

      - name: Deploy Django Worker
        run: uv run pywrangler deploy
