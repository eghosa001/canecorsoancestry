name: Cloudflare Worker deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Validate deployment secrets
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN SUPABASE_DATABASE_URL DJANGO_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - run: npm install --global wrangler@latest
      - run: uv sync --all-groups

      - name: Discover Cloudflare account
        shell: bash
        run: |
          response="$(curl -fsS "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          account_id="$(
            printf '%s' "$response" |
              python scripts/find_cloudflare_account.py
          )"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Validate Supabase Direct connection
        run: uv run python scripts/validate_supabase_direct_url.py

      - name: Discover Supabase IPv4 session pooler
        shell: bash
        run: |
          session_url="$(uv run python scripts/discover_supabase_session_pooler.py)"
          echo "::add-mask::$session_url"
          echo "SUPABASE_MIGRATION_URL=$session_url" >> "$GITHUB_ENV"

      - name: Apply Django migrations to Supabase
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_DB_SCHEMA: django_app
          DJANGO_DB_SSLMODE: require
          DJANGO_ALLOWED_HOSTS: canecorsoancestry.com,www.canecorsoancestry.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://canecorsoancestry.com,https://www.canecorsoancestry.com
          DJANGO_REQUIRE_OBJECT_STORAGE: "0"
        run: DATABASE_URL="$SUPABASE_MIGRATION_URL" uv run python manage.py migrate --noinput

      - name: Ensure cache-disabled Hyperdrive
        shell: bash
        run: |
          name="canecorsoancestry-supabase"
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs?per_page=100"

          response="$(curl -fsS "$endpoint" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          hyperdrive_id="$(
            printf '%s' "$response" |
              uv run python scripts/find_hyperdrive_id.py "$name"
          )"

          if [ -z "$hyperdrive_id" ]; then
            npx wrangler hyperdrive create "$name" \
              --connection-string="$SUPABASE_DATABASE_URL" \
              --caching-disabled \
              --sslmode require

            response="$(curl -fsS "$endpoint" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
            hyperdrive_id="$(
              printf '%s' "$response" |
                uv run python scripts/find_hyperdrive_id.py "$name"
            )"
          else
            npx wrangler hyperdrive update "$hyperdrive_id" \
              --connection-string="$SUPABASE_DATABASE_URL" \
              --caching-disabled \
              --sslmode require
          fi

          if [ -z "$hyperdrive_id" ]; then
            echo "::error::Hyperdrive could not be created or discovered."
            exit 1
          fi

          echo "CLOUDFLARE_HYPERDRIVE_ID=$hyperdrive_id" >> "$GITHUB_ENV"

      - name: Build Django static assets
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          uv run python manage.py collectstatic --noinput
          uv run python scripts/build_cloudflare_assets.py

      - name: Render Wrangler config
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target }}" = "production" ]; then
            template="wrangler.production.toml"
          else
            template="wrangler.preview.toml"
          fi
          uv run python scripts/render_wrangler.py "$template" wrangler.toml

      - name: Remove legacy Railway dependency manifest from Worker bundle
        run: rm requirements.txt

      - name: Ensure media bucket exists
        shell: bash
        run: |
          npx wrangler r2 bucket info canecorsoancestry-media >/dev/null 2>&1 || \
            npx wrangler r2 bucket create canecorsoancestry-media

      - name: Build encrypted Worker secrets file
        run: |
          uv run python -c 'import json, os; open("/tmp/worker-secrets.json", "w", encoding="utf-8").write(json.dumps({"DJANGO_SECRET_KEY": os.environ["DJANGO_SECRET_KEY"]}))'

      - name: Vendor Python Worker dependencies
        run: uvx --from 'workers-py>=1.17.4,<2' --with workers-runtime-sdk pywrangler sync

      - name: Remove local build environments from Worker upload
        run: rm -rf .venv .venv-workers

      - name: Deploy Django Worker
        run: npx wrangler deploy --secrets-file /tmp/worker-secrets.json

      - name: Verify preview health
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'preview' }}
        shell: bash
        run: |
          url="https://canecorsoancestry.aighewieghosa111.workers.dev"
          : > /tmp/worker-tail.log

          timeout 45s npx wrangler tail canecorsoancestry --format=json > /tmp/worker-tail.log 2>&1 &
          tail_pid=$!
          sleep 4

          passed=0
          for attempt in 1 2 3; do
            status="$(curl --connect-timeout 10 --max-time 20 -sS -o /tmp/health.json -w '%{http_code}' "$url/healthz/" || true)"
            echo "Preview health attempt $attempt returned HTTP $status."
            cat /tmp/health.json 2>/dev/null || true
            if [ "$status" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json; then
              passed=1
              break
            fi
            sleep 4
          done

          sleep 3
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

          echo "----- Cloudflare Worker runtime tail -----"
          cat /tmp/worker-tail.log || true
          echo "----- End Worker runtime tail -----"

          if [ "$passed" = "1" ]; then
            echo "Cloudflare preview health check passed."
            exit 0
          fi

          echo "::error::Cloudflare preview health check failed."
          exit 1

      - name: Remove temporary Worker secrets file
        if: always()
        run: rm -f /tmp/worker-secrets.json /tmp/health.json /tmp/worker-tail.log
