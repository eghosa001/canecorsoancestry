name: Production smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/production_smoke.py"
      - "scripts/performance_math.py"
      - "scripts/tests/**"
      - "scripts/cross_browser_smoke.py"
      - ".github/workflows/production-smoke.yml"
  workflow_run:
    workflows: ["Cloudflare site edge"]
    types: [completed]

permissions:
  contents: read

jobs:
  script-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile production smoke scripts
        run: |
          python -m py_compile scripts/production_smoke.py scripts/cross_browser_smoke.py scripts/performance_math.py
          python -m unittest discover -s scripts/tests -p 'test_performance_math.py'

  live:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    concurrency:
      group: production-smoke-live-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PRODUCTION_BASE_URL: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev
      EXPECTED_EDGE_CACHE_VERSION: ${{ github.event_name == 'workflow_run' && format('edge-{0}', github.event.workflow_run.id) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt playwright
      - name: Validate smoke scripts
        run: |
          python -m py_compile scripts/production_smoke.py scripts/cross_browser_smoke.py scripts/performance_math.py
          python -m unittest discover -s scripts/tests -p 'test_performance_math.py'
      - name: Install production browser and accessibility engines
        run: |
          npm install --no-save axe-core@4
          python -m playwright install --with-deps chromium firefox webkit
      - name: Resolve live Cloudflare edge cache namespace
        shell: bash
        run: |
          set -euo pipefail
          status=""
          live_version=""
          for attempt in $(seq 1 24); do
            status="$(curl --connect-timeout 5 --max-time 15 -sS \
              -o /tmp/edge-health.json \
              -w '%{http_code}' \
              "$PRODUCTION_BASE_URL/__edge/health" || true)"
            cat /tmp/edge-health.json 2>/dev/null || true
            if [ "$status" = "200" ]; then
              live_version="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('/tmp/edge-health.json').read_text()).get('cache_version', ''))
          except Exception:
              print('')
          PY
              )"
              if [ -n "$live_version" ]; then
                echo "Live edge cache namespace: $live_version"
                if [ -z "$EXPECTED_EDGE_CACHE_VERSION" ] || [ "$live_version" = "$EXPECTED_EDGE_CACHE_VERSION" ]; then
                  echo "LIVE_EDGE_CACHE_VERSION=$live_version" >> "$GITHUB_ENV"
                  exit 0
                fi
                echo "Waiting for exact Cloudflare cutover namespace $EXPECTED_EDGE_CACHE_VERSION (currently $live_version)."
              fi
            fi
            sleep 5
          done
          echo "::error::Cloudflare edge did not expose expected cache namespace ${EXPECTED_EDGE_CACHE_VERSION:-<any>}; HTTP $status"
          exit 1
      - name: Verify live production UI and concurrency
        run: python scripts/production_smoke.py
      - name: Verify Chromium, Firefox, WebKit and accessibility
        run: python scripts/cross_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke
          path: artifacts/production-smoke
          if-no-files-found: warn
