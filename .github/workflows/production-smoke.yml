name: Production smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/production_smoke.py"
      - "scripts/cross_browser_smoke.py"
      - ".github/workflows/production-smoke.yml"
  workflow_run:
    workflows: ["Cloudflare site edge"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event.workflow_run.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  script-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile production smoke scripts
        run: python -m py_compile scripts/production_smoke.py scripts/cross_browser_smoke.py

  live:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PRODUCTION_BASE_URL: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev
      EXPECTED_EDGE_CACHE_VERSION: ${{ github.event.workflow_run.head_sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt playwright
      - name: Validate smoke scripts
        run: python -m py_compile scripts/production_smoke.py scripts/cross_browser_smoke.py
      - name: Install production browser and accessibility engines
        run: |
          npm install --no-save axe-core@4
          python -m playwright install --with-deps chromium firefox webkit
      - name: Verify Cloudflare cutover cache namespace
        if: env.EXPECTED_EDGE_CACHE_VERSION != ''
        shell: bash
        run: |
          set -euo pipefail
          status=""
          for attempt in $(seq 1 24); do
            status="$(curl --connect-timeout 5 --max-time 15 -sS \
              -o /tmp/edge-health.json \
              -w '%{http_code}' \
              "$PRODUCTION_BASE_URL/__edge/health" || true)"
            if [ "$status" = "200" ] && grep -q "\"cache_version\":\"$EXPECTED_EDGE_CACHE_VERSION\"" /tmp/edge-health.json; then
              cat /tmp/edge-health.json
              exit 0
            fi
            cat /tmp/edge-health.json 2>/dev/null || true
            sleep 5
          done
          echo "::error::Cloudflare edge did not expose cache namespace $EXPECTED_EDGE_CACHE_VERSION; HTTP $status"
          exit 1
      - name: Verify live production UI and concurrency
        run: python scripts/production_smoke.py
      - name: Verify Chromium, Firefox, WebKit and accessibility
        run: python scripts/cross_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke
          path: artifacts/production-smoke
          if-no-files-found: warn
