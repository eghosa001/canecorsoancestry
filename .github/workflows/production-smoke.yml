name: Production smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/production_smoke.py"
      - "scripts/cross_browser_smoke.py"
      - "registry/**"
      - "accounts/**"
      - "templates/**"
      - ".github/workflows/production-smoke.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
  workflow_run:
    workflows: ["Cloudflare site edge", "Provision Northflank origin"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_BASE_URL: https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser and accessibility engines
        run: |
          npm install --no-save axe-core@4
          python -m playwright install --with-deps chromium firefox webkit
      - name: Verify live production UI and concurrency
        run: python scripts/production_smoke.py
      - name: Verify Chromium, Firefox, WebKit and accessibility
        run: python scripts/cross_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke
          path: artifacts/production-smoke
          if-no-files-found: warn
