name: One-time retire former PULSE Oracle runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-pulse-runner-once.yml

permissions:
  contents: read

concurrency:
  group: cca-pulse-runner-retirement
  cancel-in-progress: false

jobs:
  retire:
    name: Verify CCA runner and disable PULSE service
    if: >-
      github.repository == 'eghosa001/canecorsoancestry' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 4
    steps:
      - name: Verify dedicated CCA runner on this VM
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "eghosa001/canecorsoancestry"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RUNNER_NAME" = "CCA-ORACLE"
          test "$(uname -m)" = aarch64
          test -f /home/opc/actions-runner-cca/.runner
          python3 -c 'import json; p="/home/opc/actions-runner-cca/.runner"; d=json.load(open(p, encoding="utf-8-sig")); assert d.get("gitHubUrl","").rstrip("/").lower()=="https://github.com/eghosa001/canecorsoancestry"; assert d.get("agentName")=="CCA-ORACLE"; print("PASS: new runner belongs to Cane Corso Ancestry only.")'
          sudo -n systemctl is-active --quiet actions.runner.eghosa001-canecorsoancestry.CCA-ORACLE.service
          echo "PASS: CCA registered, online, service active and successfully executing this workflow."

      - name: Stop and disable previous PULSE-CITY runner
        shell: bash
        run: |
          set -euo pipefail
          old="actions.runner.eghosa001-PULSE-CITY.ORACLE.service"
          new="actions.runner.eghosa001-canecorsoancestry.CCA-ORACLE.service"
          sudo -n systemctl disable --now "$old"
          if sudo -n systemctl is-active --quiet "$old"; then
            echo "::error::Old PULSE-CITY runner is still running."
            exit 1
          fi
          if sudo -n systemctl is-enabled --quiet "$old"; then
            echo "::error::Old PULSE-CITY runner is still enabled."
            exit 1
          fi
          sudo -n systemctl is-active --quiet "$new"
          echo "PASS: old PULSE-CITY service stopped and disabled; new CCA runner remains active."
          echo "Next: remove offline ORACLE runner registration from PULSE-CITY Settings > Actions > Runners."
