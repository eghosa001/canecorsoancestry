name: Cloudflare build check

on:
  pull_request:
    paths:
      - "worker.py"
      - "pyproject.toml"
      - "wrangler.*.toml"
      - "config/settings/cloudflare.py"
      - "core/storage.py"
      - "core/media_views.py"
      - "scripts/build_cloudflare_assets.py"
      - "scripts/render_wrangler.py"
      - ".github/workflows/cloudflare-*.yml"
      - "core/static/**"
      - "templates/**"
      - "accounts/templates/**"
      - "registry/templates/**"
      - "pedigrees/templates/**"

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_HYPERDRIVE_ID: "00000000-0000-0000-0000-000000000000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: npm install --global wrangler@latest
      - run: uv sync --all-groups

      - name: Build static assets
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          uv run python manage.py collectstatic --noinput
          uv run python scripts/build_cloudflare_assets.py

      - name: Render preview configuration
        run: uv run python scripts/render_wrangler.py wrangler.preview.toml wrangler.generated.toml

      - name: Remove legacy Railway dependency manifest from Worker bundle
        run: rm requirements.txt

      - name: Worker bundle dry run
        run: uv run pywrangler deploy --dry-run --config wrangler.generated.toml
