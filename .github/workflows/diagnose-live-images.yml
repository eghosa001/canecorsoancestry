name: Diagnose live dog images

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public dog images
        shell: bash
        run: |
          python - <<'PY'
          import html
          import re
          import urllib.parse
          import urllib.request

          base = "https://canecorsoancestry-site-edge.aighewieghosa111.workers.dev"

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent":"CCA-image-diagnostic/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.geturl(), r.headers, r.read().decode("utf-8", "replace")

          for label, query in [("bellissimo", "Branco Custodi Nos"), ("source", "NALAH")]:
              url = base + "/dogs/?" + urllib.parse.urlencode({"q": query})
              status, final, headers, body = fetch(url)
              print(f"{label}: search status={status} final={final}")
              links = re.findall(r'href="([^"]+)"', body)
              dog_links = [html.unescape(x) for x in links if "/dogs/" in x and x != "/dogs/"]
              if not dog_links:
                  print(f"{label}: no dog detail link found")
                  continue
              dog_url = urllib.parse.urljoin(base, dog_links[0])
              status, final, headers, detail = fetch(dog_url)
              print(f"{label}: detail status={status} url={dog_url}")
              imgs = re.findall(r'<img[^>]+src="([^"]+)"', detail, re.I)
              if not imgs:
                  print(f"{label}: no img src found on detail")
                  continue
              image_url = urllib.parse.urljoin(base, html.unescape(imgs[0]))
              print(f"{label}: image={image_url}")
              req = urllib.request.Request(image_url, headers={"User-Agent":"CCA-image-diagnostic/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print(f"{label}: image status={r.status} final={r.geturl()} content-type={r.headers.get('content-type')} length={r.headers.get('content-length')}")
              except Exception as exc:
                  print(f"{label}: image ERROR {type(exc).__name__}: {exc}")
          PY
