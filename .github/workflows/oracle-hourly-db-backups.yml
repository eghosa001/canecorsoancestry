name: Oracle PostgreSQL encrypted hourly backups
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Oracle Django production release (CI-gated)"]
    types: [completed]
  pull_request:
    paths:
      - "scripts/oracle_runner/backup_local_postgres.sh"
      - "scripts/oracle_runner/backup_local_postgres_no_r2.sh"
      - "scripts/oracle_runner/r2_postgres_backup.py"
      - ".github/workflows/oracle-hourly-db-backups.yml"
  push:
    branches: [main]
    paths:
      - "scripts/oracle_runner/backup_local_postgres.sh"
      - ".github/workflows/oracle-hourly-db-backups.yml"
permissions:
  contents: read
concurrency:
  group: cca-local-postgres-hourly-backup
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check backup and disaster recovery shell
        run: |
          bash -n scripts/oracle_runner/backup_local_postgres.sh
          bash -n scripts/oracle_runner/backup_local_postgres_no_r2.sh
          python3 -m py_compile scripts/oracle_runner/r2_postgres_backup.py
          python3 scripts/fast_path_guard.py
  backup:
    if: >-
      github.repository == 'eghosa001/canecorsoancestry' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: [self-hosted, linux, arm64, cca-oracle]
    timeout-minutes: 20
    env:
      CCA_MEDIA_BACKEND: ${{ vars.CCA_MEDIA_BACKEND || 'r2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify encrypted Oracle PostgreSQL backup
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CCA_MEDIA_BACKEND" == "oracle-local" ]] || sudo -n test -s /var/lib/cca/media/.cca-media-cutover-approved; then
            bash scripts/oracle_runner/backup_local_postgres_no_r2.sh
          elif bash scripts/oracle_runner/backup_local_postgres.sh; then
            echo "PASS: encrypted offsite R2 database backup verified."
          else
            # Cloudflare billing suspension makes the existing R2 gateway fail.
            # Never leave the production PostgreSQL database without a *new*
            # independently verified emergency snapshot just because R2 is down.
            echo "::warning::R2 offsite backup FAILED. Attempting emergency encrypted Oracle-local backup."
            bash scripts/oracle_runner/backup_local_postgres_no_r2.sh
            echo "::warning::DEGRADED BACKUP PROTECTION: verified LOCAL snapshot only; no offsite recovery copy."
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              printf '%s\n' '## DEGRADED — OFFSITE BACKUP UNAVAILABLE' 'A fresh encrypted local PostgreSQL snapshot was verified on Oracle. This is NOT an offsite backup. Restore R2 billing/access or arrange independent offsite backup storage.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
