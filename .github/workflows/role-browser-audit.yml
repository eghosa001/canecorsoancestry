name: Browser role and function audit

on:
  workflow_dispatch:
  push:
    branches: [audit/playwright-role-flows-20261010]
    paths:
      - "scripts/seed_browser_audit.py"
      - "scripts/role_browser_audit.py"
      - ".github/workflows/role-browser-audit.yml"
  pull_request:
    paths:
      - "scripts/seed_browser_audit.py"
      - "scripts/role_browser_audit.py"
      - ".github/workflows/role-browser-audit.yml"

permissions:
  contents: read

jobs:
  browser-role-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      PYTHONPATH: "."
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Django and Playwright
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium webkit
      - name: Validate audit syntax and create disposable test database
        run: |
          python -m py_compile scripts/seed_browser_audit.py scripts/role_browser_audit.py
          python manage.py migrate --noinput
          python -m scripts.seed_browser_audit
      - name: Start isolated Django web server
        shell: bash
        run: |
          set -euo pipefail
          python manage.py runserver --noreload 127.0.0.1:8000 > /tmp/cca-role-browser-django.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -n 120 /tmp/cca-role-browser-django.log
          exit 1
      - name: Exercise browser navigation and role-specific functionality
        run: python -m scripts.role_browser_audit
      - name: Collect browser report and Django errors
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/role-browser-audit/summary.json ]; then
            cat artifacts/role-browser-audit/summary.json
          fi
          if [ -f /tmp/cca-role-browser-django.log ]; then
            grep -E 'Internal Server Error|Traceback|Exception|Forbidden' /tmp/cca-role-browser-django.log | tail -n 60 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-role-audit
          path: artifacts/role-browser-audit
          if-no-files-found: warn
