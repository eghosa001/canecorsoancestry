{% extends "base.html" %}
{% block title %}Moderation · Cane Corso Ancestry<script>
(function () {
  function showAnchor() {
    var hash = window.location.hash;
    if (!hash) return;
    var element = document.getElementById(hash.slice(1));
    if (!element) return;
    for (var parent = element; parent; parent = parent.parentElement) {
      if (parent.tagName === "DETAILS") parent.open = true;
    }
  }
  window.addEventListener("hashchange", showAnchor);
  showAnchor();
}());
</script>
{% endblock %}
