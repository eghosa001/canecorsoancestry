name = "canecorsoancestry-edge"
main = "src/r2-media.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[routes]]
pattern = "media.canecorsoancestry.com"
custom_domain = true

[observability]
enabled = true

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "canecorsoancestry-media"

# Optimize dog photo renditions directly from private R2 object bytes.
# Cloudflare Images Free supports 5,000 unique transformations per month;
# our Worker falls back to the original when unavailable or over quota.
[images]
binding = "IMAGES"

# Do not enable Worker-wide HTTP caching. Oracle uses authenticated HEAD
# before PUT and GET for the SAME object key; negative lookups must never
# survive a subsequent write. Private versioned WebP renditions remain durable
# in R2, independently of Cloudflare's optional edge Cache API.
[cache]
enabled = false
