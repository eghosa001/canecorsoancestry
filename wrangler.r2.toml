name = "canecorsoancestry-edge"
main = "src/r2-media.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[routes]]
pattern = "media.canecorsoancestry.com"
custom_domain = true

[observability]
enabled = true

# Emergency public-archive media gateway while Cloudflare has disabled R2.
# No R2 or Images bindings: existing signed archive photographs are served
# from the verified owner Drive manifest. Restricted uploads and private
# documents must use Oracle local storage after recovery cutover.
#
# To restore R2 after billing is re-enabled, explicitly add the bindings back.
# Do not enable Worker-wide HTTP caching. Oracle uses authenticated HEAD
# before PUT and GET for the SAME object key; negative lookups must never
# survive a subsequent write. Private versioned WebP renditions remain durable
# in R2, independently of Cloudflare's optional edge Cache API.
[cache]
enabled = false
