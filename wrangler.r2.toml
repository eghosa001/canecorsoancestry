name = "canecorsoancestry-edge"
main = "src/r2-media.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[routes]]
pattern = "media.canecorsoancestry.com"
custom_domain = true

[observability]
enabled = true

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "canecorsoancestry-media"

# Optimize dog photo renditions directly from private R2 object bytes.
# Cloudflare Images Free supports 5,000 unique transformations per month;
# our Worker falls back to the original when unavailable or over quota.
[images]
binding = "IMAGES"

# Enable the Cache API for signed public photo renditions only. The worker
# verifies each HMAC before cache lookup; private R2 gateway routes are never
# cached. Versioned WebPs also persist in R2 after edge eviction.
[cache]
enabled = true
