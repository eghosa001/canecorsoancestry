name = "canecorsoancestry"
main = "worker.py"
compatibility_date = "2026-09-30"
compatibility_flags = ["python_workers"]
workers_dev = true

[observability]
enabled = true

[python_modules]
exclude = ["**/*.pyc", "**/__pycache__", "**/tests/**", "**/test/**"]

[assets]
directory = "./worker_assets"
binding = "ASSETS"
run_worker_first = ["/*", "!/static/*"]

[vars]
SITE_URL = "https://canecorsoancestry.com"
DJANGO_ALLOWED_HOSTS = "canecorsoancestry.com,www.canecorsoancestry.com,.workers.dev"
DJANGO_CSRF_TRUSTED_ORIGINS = "https://canecorsoancestry.com,https://www.canecorsoancestry.com,https://*.workers.dev"
MEDIA_MIGRATION_ENABLED = "0"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "__HYPERDRIVE_ID__"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "canecorsoancestry-media"

[[routes]]
pattern = "canecorsoancestry.com"
custom_domain = true
